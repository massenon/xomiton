    { id: 'a3', type: 'besoin', status: 'pris_en_charge', prio: 'normale', ack: true, commune: 'Allada', zone: 'Atlantique', ago: 1500, viol: null, needs: ['soutien_juridique'], pseudo: null, contact: 'sms', text: 'Je voudrais savoir comment porter plainte sans être exposée.', hist: [{ w: 'hier', x: 'Alerte reçue (Nouveau)' }, { w: 'hier', x: 'Réception accusée par toi.' }, { w: 'hier', x: 'Prise en charge par toi.' }] },

  let Q = [];   // file de synchronisation

  const pend = () => Q.filter(i => ['pending', 'sending', 'conflict'].includes(i.status)).length;
  const newAlerts = () => A.filter(a => a.status === 'nouveau').length;
  const openAlerts = () => A.filter(a => a.status !== 'clos');
  const find = code => C.find(c => c.code === code);
  const place = a => `${a.commune} (${a.zone})`;

  const aStatus = a => badge(a.status === 'nouveau' ? '' : a.status === 'clos' ? 'mute' : 'ok', en('alert_status', a.status));
  const aPrio = p => badge(p === 'critique' ? 'danger' : p === 'haute' ? 'warn' : 'mute', en('alert_priority', p));
  const aType = x => badge(x === 'sos' ? 'danger' : x === 'besoin' ? '' : 'violet', en('alert_type', x));
  const secH = (h, n) => `<div class="sec-h"><h2>${esc(h)}</h2>${n ? `<span class="n">${esc(n)}</span>` : ''}</div>`;
  const nextCode = kind => `${kind}-${String(Math.max(...C.map(c => +c.code.slice(4)), 0) + 1).padStart(4, '0')}`;

  /* ---------- Accueil ---------- */
  function home() {
    const nc = C.length, month = C.filter(c => c.date.startsWith('2026-10')).length, prog = C.filter(c => c.status === 'en_cours').length, closed = C.filter(c => c.status === 'clos').length;

    const na = newAlerts(), nco = C.filter(c => c.status === 'ouvert').length;

    return { tab: 'home', title: esc(t('home.title')), plain: t('home.title'), caption: '', html: `
      <section class="hello"><div class="row wrap">${badge('', t('home.badge'))}<span class="pill-duty">${esc(t('home.duty'))}</span></div>
        <h2>${esc(t('home.greeting', { name: ME.pseudo }))}</h2><p class="muted small" style="margin:0">${esc(t('home.intro'))}</p></section>
      <section aria-labelledby="kh" class="stack-s">${secH(t('home.kpi_label')).replace('<h2>', '<h2 id="kh">')}
        <ul class="kpis">${kpi.map(([k, v]) => `<li><span class="v">${v}</span><span class="l">${esc(t('home.kpi.' + k))}</span></li>`).join('')}</ul></section>

        <a class="link-row" href="#/dossiers">${ic('folder')}<span class="grow"><b>${esc(t('home.cases_to_contact', { count: nco }))}</b></span>${ic('next', 'sm')}</a>
        <button class="link-row" data-act="oos">${ic('users')}<span class="grow"><b>${esc(t('home.session'))}</b></span>${ic('next', 'sm')}</button></section>
      <section class="stack-s" aria-labelledby="sh">${secH(t('home.shortcuts_label')).replace('<h2>', '<h2 id="sh">')}
        <div class="shortcuts">${sc.map(([k, i, h]) => (h ? `<a class="tile" href="#/${h}">${ic(i, 'lg')}<b>${esc(t('home.shortcuts.' + k))}</b></a>` : `<button class="tile" data-act="oos">${ic(i, 'lg')}<b>${esc(t('home.shortcuts.' + k))}</b></button>`)).join('')}</div></section>` };
  }

  /* ---------- Alertes ---------- */
  function actionsFor(a, full) {

    if (a.status === 'pris_en_charge' || a.status === 'en_cours') b.push(`<button class="btn btn-primary" data-act="close" data-id="${a.id}">${esc(t('alerts.close'))}</button>`);
    if (!full) b.push(`<a class="btn btn-outline" href="#/alerte/${a.id}" aria-label="${esc(t('alerts.detail_for', { type: en('alert_type', a.type), place: a.commune }))}">${esc(t('alerts.detail'))}</a>`);
    return b.join('');
  }
  function alerts() {

      <div class="row wrap between"><div class="row wrap"><b>${n} ${esc(t('alerts.open_count', { count: n }))}</b></div>

      <p class="note">${ic('bell', 'sm')}<span>${esc(t('alerts.on_duty'))}</span></p>
      <div class="stack">${A.map(a => `<article class="acard ${a.type === 'sos' && a.status === 'nouveau' ? 'sos' : ''}" aria-label="${esc(en('alert_type', a.type) + ', ' + a.commune)}">
        <div class="top">${aType(a.type)}${aStatus(a)}${aPrio(a.prio)}</div>
        <h3>${esc(en('alert_type', a.type))} · ${esc(place(a))}</h3>
        <div class="meta"><span>${ic('clock', 'sm')} ${esc(t('alerts.ago', { time: ago(a.ago) }))}</span>${a.viol ? `<span>${esc(en('violence', a.viol))}</span>` : ''}</div>
        <div class="acts">${actionsFor(a)}</div></article>`).join('')}</div>` };
  }
  function alertDetail(id) {
    const a = A.find(x => x.id === id);

    const dd = (k, v) => `<div><dt>${esc(t('alerts.fields.' + k))}</dt><dd>${v}</dd></div>`;
    const pos = a.lat ? `${String(a.lat.toFixed(2)).replace('.', ',')}° N, ${String(a.lng.toFixed(2)).replace('.', ',')}° E · ${esc(t('alerts.accuracy', { meters: a.acc }))}` : esc(t('common.none'));
    return { tab: 'alerts', back: 'alertes', backLabel: t('alerts.title'), title: `${esc(en('alert_type', a.type))} · ${esc(a.commune)}`, plain: t('alerts.detail_for', { type: en('alert_type', a.type), place: a.commune }), html: `
      <div class="row wrap">${aType(a.type)}${aStatus(a)}${aPrio(a.prio)}</div>
      ${a.status === 'nouveau' && !a.ack ? `<p class="note warn">${ic('alert', 'sm')}<span>${esc(t('alerts.escalation'))}</span></p>` : ''}
      <dl class="dl card" style="padding:4px 14px">${dd('received', esc(ago(a.ago)))}${a.type === 'sos' ? dd('notified', esc(t('alerts.notified_text'))) : ''}${dd('place', esc(place(a)))}${dd('category', esc(a.viol ? en('violence', a.viol) : T.common.none))}${dd('needs', esc(a.needs.length ? a.needs.map(n => en('needs', n)).join(', ') : T.common.none))}${dd('author', esc(t('alerts.anonymous')))}${dd('contact', esc(a.contact ? t('alerts.contact_masked') : t('alerts.no_contact')))}${dd('position', pos)}${dd('description', esc(a.text))}</dl>
      <section class="stack-s">${secH(t('alerts.fields.history'))}<ol class="tl card">${a.hist.map((h, i) => `<li class="${i === a.hist.length - 1 ? '' : 'done'}"><span class="when">${esc(h.w)}</span>${esc(h.x)}</li>`).join('')}</ol></section>
      <div class="acts" style="display:flex;flex-direction:column;gap:8px">${actionsFor(a, true).replace(/class="btn /g, 'class="btn btn-block ')}</div>` };
  }
  function pushHist(a, x) { a.hist.push({ w: 'à l’instant', x }); }
  function needNet() { if (S.net === 'off') { Kit.toast(t('alerts.offline')); return true; } return false; }

  /* ---------- Dossiers ---------- */
  function cases() {
    return { tab: 'cases', title: esc(t('cases.title')), plain: t('cases.title'), html: `
      <p class="muted small" style="margin:0">${esc(t('cases.intro'))}</p>
      <div class="search"><label class="vh" for="q">${esc(t('cases.search'))}</label>${ic('search')}<input class="input" id="q" type="search" inputmode="text" autocomplete="off" placeholder="${esc(t('cases.search_placeholder'))}" value="${esc(L.q)}"></div>
      <div class="stack-s" role="group" aria-label="${esc(t('cases.filters_label'))}">
        <div class="chips wrap" id="fk">${[['', t('cases.all_kinds')], ['VBG', 'VBG'], ['VDH', 'VDH']].map(([v, l]) => `<button class="chip" data-act="fk" data-v="${v}" aria-pressed="${L.kind === v}">${esc(l)}</button>`).join('')}</div>
        <div class="chips wrap" id="fs">${[['', t('cases.all_statuses')], ['ouvert', 'Ouvert'], ['en_cours', 'En cours'], ['clos', 'Clos'], ['archive', 'Archivé']].map(([v, l]) => `<button class="chip" data-act="fs" data-v="${v}" aria-pressed="${L.status === v}">${esc(l)}</button>`).join('')}</div></div>
      <div id="list" class="stack-s" aria-live="polite"></div>
      <a class="btn btn-primary btn-block" href="#/collecte" data-act="newcol">${ic('plus', 'sm')} ${esc(t('cases.new'))}</a>`,
      mount: () => { drawList(); document.getElementById('q').addEventListener('input', e => { L.q = e.target.value; drawList(); }); } };
  }
  function drawList() {
    const host = document.getElementById('list'); if (!host) return;
    const r = C.filter(c => (!L.q || c.code.toLowerCase().includes(L.q.trim().toLowerCase())) && (!L.status || c.status === L.status) && (!L.kind || c.kind === L.kind));
    host.innerHTML = `<div class="sec-h"><b>${esc(t('cases.results', { count: r.length }))}</b>${(L.q || L.status || L.kind) ? `<button class="btn-link" data-act="resetf">${esc(t('cases.reset'))}</button>` : ''}</div>` +
      (r.length ? r.map(c => `<a class="link-row" href="#/dossier/${c.code}" aria-label="${esc(c.code + ', ' + en('case_status', c.status) + ', ' + t('cases.open'))}"><span class="grow"><span class="row wrap" style="gap:6px"><b>${c.code}</b>${kindBadge(c.kind)}${stBadge(c.status)}</span>
        <span class="small muted" style="display:block;margin-top:4px">${fmt(c.date)} · ${esc(c.commune)} · ${esc(en('violence', c.viol))} · ${esc(t('cases.steps', { count: c.fu.length }))}</span></span>${ic('next', 'sm')}</a>`).join('')
        : `<div class="empty"><b>${esc(L.q || L.status || L.kind ? t('cases.empty_filtered') : t('cases.empty'))}</b>${L.q || L.status || L.kind ? '' : esc(t('cases.empty_text'))}</div>`);
  }
  function sheetSec(title, rows, open) {
    return `<details class="card" ${open ? 'open' : ''} style="padding:0"><summary class="h3" style="padding:14px 16px;min-height:48px;display:flex;align-items:center;cursor:pointer">${esc(title)}</summary><dl class="dl" style="padding:0 16px 8px">${rows.map(([k, v]) => `<div><dt>${esc(t('sheet.fields.' + k))}</dt><dd>${v == null || v === '' ? `<span class="muted">${esc(t('sheet.empty'))}</span>` : esc(v)}</dd></div>`).join('')}</dl></details>`;
  }
  function caseShow(code) {
    const c = find(code);
    if (!c) return { tab: 'cases', back: 'dossiers', title: esc(t('cases.title')), html: `<div class="empty"><b>${esc(t('cases.empty'))}</b></div>` };
    const s = c.sheet, locked = c.status === 'archive';
    const sc = x => (s ? x : null);
    const fu = c.fu.slice().sort((a, b) => a.date.localeCompare(b.date));
    return { tab: 'cases', back: 'dossiers', backLabel: t('case.back'), title: `${c.code}`, plain: c.code, html: `
      <div class="row wrap">${kindBadge(c.kind)}${stBadge(c.status)}${badge('mute', t('case.received', { date: fmt(c.date) }))}${badge('mute', t('case.age', { range: c.age }))}</div>
      ${s ? `<p class="muted small" style="margin:0">${esc(t('sheet.reference', { reference: s.ref }))}</p>` : `<p class="note">${ic('info', 'sm')}<span>${esc(t('sheet.not_filled'))}</span></p>`}
      <div class="stack-s">
      ${sheetSec(t('sheet.sections.identification'), [['pseudo', s ? s.pseudo : `Pseudo-${c.code.slice(-2)}${c.age.slice(0, 1)}`], ['sex', c.sex], ['age', c.age], ['population', c.pop], ['zone', `${c.commune} (${c.zone})`]], true)}
      ${sheetSec(t('sheet.sections.facts'), [['date', fmt(c.date)], ['place', sc(s && s.place)], ['type', en('violence', c.viol)], ['description', sc(s && s.desc)]], true)}
      ${sheetSec(t('sheet.sections.services'), [['services', s ? s.services.map(x => en('services', x)).join(', ') : null]])}
      ${sheetSec(t('sheet.sections.orientation'), s ? [['referral', s.referral.to], ['contact', s.referral.contact], ['referral_date', fmt(s.referral.date)], ['reason', s.referral.reason], ['urgency', t('sheet.urgency.' + s.referral.urgency)]] : [['referral', t('sheet.no_referral')]])}
      ${sheetSec(t('sheet.sections.consent'), s ? [['consent', s.consent.given ? t('sheet.yes') : t('sheet.no')], ['mode', t('sheet.modes.' + s.consent.mode)], ['sharing', s.consent.sharing ? t('sheet.yes') : t('sheet.no')]] : [['consent', null]])}</div>
      ${locked ? `<p class="note">${ic('lock', 'sm')}<span>${esc(t('case.locked'))}</span></p>` : `<form class="card stack-s" data-act-form="status" data-code="${c.code}"><div class="fld"><label for="ns">${esc(t('case.status_label'))}</label><select class="input" id="ns"><option value="">${esc(t('case.status_choose'))}</option>${['ouvert', 'en_cours', 'clos', 'archive'].filter(x => x !== c.status).map(x => `<option value="${x}">${esc(en('case_status', x))}</option>`).join('')}</select></div><button class="btn btn-outline" type="submit">${esc(t('case.status_submit'))}</button></form>`}
      <section class="stack-s" aria-labelledby="fh">${secH(t('case.timeline')).replace('<h2>', '<h2 id="fh">')}
        ${fu.length ? `<ol class="tl card">${fu.map(f => `<li class="${f.outcome === 'realise' ? 'done' : ''} ${f.queued ? 'queued' : ''}"><span class="when">${fmt(f.date)}</span><div class="row wrap" style="gap:6px"><b>${esc(f.step)}</b>${badge(f.outcome === 'realise' ? 'ok' : f.outcome === 'planifie' ? '' : 'mute', en('followup_outcome', f.outcome))}${f.queued ? badge('warn', t('case.in_queue')) : ''}</div>
          ${f.comment ? `<div class="small muted">${esc(f.comment)}</div>` : ''}${f.next ? `<div class="small muted">${esc(t('case.next'))} : ${fmt(f.next)}</div>` : ''}
          ${f.outcome === 'planifie' && !locked ? `<button class="btn-link" data-act="done" data-code="${c.code}" data-id="${f.id}">${esc(t('case.mark_done'))}</button>` : ''}</li>`).join('')}</ol>` : `<p class="muted card">${esc(t('case.timeline_empty'))}</p>`}</section>
      ${locked ? '' : `<a class="btn btn-primary btn-block" href="#/suivi/${c.code}">${ic('plus', 'sm')} ${esc(t('case.add'))}</a>`}`,
      mount: pane => { const f = pane.querySelector('[data-act-form="status"]'); if (f) f.addEventListener('submit', e => { e.preventDefault(); const v = f.querySelector('select').value; if (!v) return; c.status = v; Kit.toast(t('case.status_saved')); Kit.render({ noFocus: true }); }); } };
  }
  function followForm(code) {
    const c = find(code); if (!c) return caseShow(code);
    const e = FU.errors; const err = k => (e[k] ? `<span class="err" id="e-${k}">${ic('alert', 'sm')}${esc(e[k])}</span>` : '');
    const inv = k => (e[k] ? `aria-invalid="true" aria-describedby="e-${k}"` : '');
    const ne = Object.keys(e).length;
    return { tab: 'cases', back: `dossier/${code}`, backLabel: code, title: esc(t('case.add_title')), plain: t('case.add_title'), html: `
      <p class="muted small" style="margin:0">${code} · ${esc(t('col.no_identity_title'))}</p>
      ${ne ? `<div class="errsum" role="alert" tabindex="-1" id="es">${esc(t('case.errors_title', { count: ne }))}</div>` : ''}
      <form id="ff" class="stack" novalidate>
        <div class="fld"><label for="f-step">${esc(t('case.fields.step'))} <span class="req" aria-hidden="true">*</span></label><select class="input" id="f-step" ${inv('step')}><option value="">${esc(t('case.choose'))}</option>${T.case.steps_list.map(s => `<option ${FU.step === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>${err('step')}</div>
        <div class="fld"><label for="f-date">${esc(t('case.fields.date'))} <span class="req" aria-hidden="true">*</span></label><input class="input" id="f-date" type="date" value="${FU.date}" ${inv('date')}>${err('date')}</div>
        <div class="fld"><label for="f-out">${esc(t('case.fields.outcome'))}</label><select class="input" id="f-out">${Object.entries(T.enums.followup_outcome).map(([k, v]) => `<option value="${k}" ${FU.outcome === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></div>
        <div class="fld"><label for="f-next">${esc(t('case.fields.next'))} <span class="muted" style="font-weight:400">${esc(t('case.optional'))}</span></label><input class="input" id="f-next" type="date" value="${FU.next}" ${inv('next')}>${err('next')}</div>
        <div class="fld"><label for="f-com">${esc(t('case.fields.comment'))} <span class="muted" style="font-weight:400">${esc(t('case.optional'))}</span></label><textarea class="input" id="f-com" rows="4" ${inv('comment')}>${esc(FU.comment)}</textarea><span class="hint" id="cc">${esc(t('case.comment_hint', { count: FU.comment.length, max: 500 }))}</span>${err('comment')}</div>
        <button class="btn btn-primary btn-block" type="submit">${esc(t('case.add_submit'))}</button></form>`,
      mount: pane => {
        const g = id => pane.querySelector('#' + id);
        g('f-com').addEventListener('input', ev => { FU.comment = ev.target.value; g('cc').textContent = t('case.comment_hint', { count: FU.comment.length, max: 500 }); });
        ['step', 'date', 'out', 'next'].forEach(k => g('f-' + k).addEventListener('change', ev => { FU[{ out: 'outcome' }[k] || k] = ev.target.value; }));
        g('ff').addEventListener('submit', ev => {
          ev.preventDefault(); const er = {};
          if (!FU.step) er.step = t('case.errors.required');
          if (!FU.date) er.date = t('case.errors.required');
          if (FU.next && FU.date && FU.next < FU.date) er.next = t('case.errors.next_before');
          if (FU.comment.length > 500) er.comment = t('case.errors.comment_max', { max: 500 });
          FU.errors = er;
          if (Object.keys(er).length) { Kit.render({ noFocus: true }); const s = document.getElementById('es'); s && s.focus(); return; }
          const off = S.net === 'off'; const id = Date.now();
          c.fu.push({ id, step: FU.step, date: FU.date, outcome: FU.outcome, next: FU.next, comment: FU.comment, queued: off });
          if (off) Q.push({ id: 'q' + (++qSeq), kind: 'followup', label: `${FU.step} · ${code}`, status: 'pending', when: 'à l’instant', fuRef: [code, id] });
          Kit.toast(off ? t('case.followup_queued') : t('case.followup_saved'));
          Object.assign(FU, { step: '', date: TODAY, outcome: 'planifie', next: '', comment: '', errors: {} });
          Kit.go('#/dossier/' + code);
        });
      } };
  }

  /* ---------- Collecte ---------- */
  function validateStep(n) {
    const e = {};
    if (n === 1) {
      if (!F.kind) e.kind = t('col.errors.required');
      if (!F.date) e.date = t('col.errors.required'); else if (isNaN(Date.parse(F.date))) e.date = t('col.errors.date_invalid'); else if (F.date > TODAY) e.date = t('col.errors.date_future');
    }

    close: d => { if (needNet()) return; Kit.confirm({ title: t('alerts.close_title'), text: esc(t('alerts.close_confirm')), ok: t('alerts.close_yes'), onOk: () => { const a = A.find(x => x.id === d.id); a.status = 'clos'; pushHist(a, 'Clôturée par toi.'); Kit.toast(t('alerts.closed')); Kit.render({ noFocus: true }); } }); },
    fk: d => { L.kind = d.v; Kit.render({ noFocus: true }); },
    fs: d => { L.status = d.v; Kit.render({ noFocus: true }); },
    resetf: () => { L.q = ''; L.status = ''; L.kind = ''; Kit.render({ noFocus: true }); },
    done: d => { const c = find(d.code); const f = c.fu.find(x => x.id === +d.id); f.outcome = 'realise'; if (S.net === 'off') { f.queued = true; Q.push({ id: 'q' + (++qSeq), kind: 'followup', label: `${f.step} · ${d.code}`, status: 'pending', when: 'à l’instant', fuRef: [d.code, f.id] }); } Kit.toast(t('case.followup_done')); Kit.render({ noFocus: true }); },
    goto: d => { F.errors = {}; F.step = +d.step; Kit.render({ top: true }); },
    clear: () => { F = F0(); Kit.toast(t('col.draft_cleared')); Kit.render({ top: true }); },
    newcol: () => { F = F0(); },
    syncnow: () => runSync(),
    cfpick: d => { CF.pick = d.k; const b = document.querySelector('[data-act="cfgo"]'); if (b) b.disabled = false; },
    cfgo: d => {
      const i = Q.find(x => x.id === d.id); if (!CF.pick) return Kit.toast(t('conflict.choose_first'));
      const v = CF.pick === 'server' ? i.server : i.mine;
      Kit.confirm({ title: t('conflict.confirm_title', { value: v }), text: esc(t(CF.pick === 'server' ? 'conflict.confirm_server' : 'conflict.confirm_mine')), ok: t('conflict.yes'),
        onOk: () => { i.choice = CF.pick; i.status = 'resolved'; if (i.caseCode) { const c = find(i.caseCode); if (c) c.status = { 'Clos': 'clos', 'En cours': 'en_cours', 'Ouvert': 'ouvert' }[v] || c.status; } CF.pick = ''; Kit.toast(t('sync.resolved_toast')); Kit.render({ noFocus: true }); } });
    },
    sosalt: () => Kit.confirm({ title: t('sos.alt_title'), text: esc(t('sos.alt_text')), ok: t('sos.alt_yes'), cancel: t('sos.cancel'), onOk: sendSos }),
    safe: () => Kit.toast(t('sos.safe_ok')),
    sosreset: () => { SOSS.state = 'idle'; },
  };

  /* ---------- Démarrage ---------- */
  function demoFill() {
    Object.assign(F, { kind: 'VBG', date: '2024-03-14', zone: 'Atlantique', commune: 'Abomey-Calavi', pop: 'Jeunes filles (15-24)', sex: 'Femme', age: '15-17', viol: 'sexuelle', ref: 'psy', notes: 'Contexte familial, première écoute faite par la pair du quartier.', errors: {} });
  }
  Kit.start({
    title: T.title, sub: T.sub, home: 'accueil', space: 'pair', logo: '{{IMG:logo-couleur.svg}}', actions,
    tabs: [
      { id: 'home', href: 'accueil', icon: 'home', label: T.nav.home },
      { id: 'alerts', href: 'alertes', icon: 'bell', label: T.nav.alerts, count: () => (newAlerts() ? String(newAlerts()) : '') },
      { id: 'sos', href: 'sos', label: T.nav.sos, sos: true },
      { id: 'cases', href: 'dossiers', icon: 'folder', label: T.nav.cases },
      { id: 'net', href: 'index.html#/fil', ext: true, icon: 'feed', label: T.nav.network },
    ],
    rail: [
      { title: T.page.g_pair, items: [
        { href: 'accueil', label: 'Accueil pair' }, { href: 'alertes', label: 'Alertes routées vers moi' }, { href: 'alerte/a1', label: 'Détail d’une alerte SOS' },
        { href: 'dossiers', label: 'Mes dossiers' }, { href: 'dossier/VBG-0042', label: 'Fiche dossier (5 sections, frise)' }, { href: 'suivi/VBG-0042', label: 'Ajouter un suivi' }, { href: 'sos', label: 'SOS' } ] },
      { title: 'Collecte', items: [
        { href: 'collecte?etape=1', label: 'Collecte : étape 1' }, { href: 'collecte?etape=5&demo=1', label: 'Collecte : vérification + avertissement' },
        { href: 'collecte?etape=5&demo=1&net=off&submit=1', label: 'Collecte hors ligne : en file' }, { href: 'collecte?etape=5&demo=1&net=on&submit=1', label: 'Collecte en ligne : envoyé' } ] },
      { title: T.page.g_offline, items: [
        { href: 'sync?net=off', label: 'File de synchronisation (hors ligne)' }, { href: 'sync?net=on', label: 'File : conflit 409 signalé' }, { href: 'conflit/q1', label: 'Conflit 409 : je choisis (serveur ou mon appareil)' } ] },
      { title: 'Notifications', items: [{ href: 'push-sos', label: 'Push SOS reçu (admins ET pair·es)' }] },
    ],
    banner: () => (S.net === 'off' ? `<div class="nb" role="status">${ic('wifi-off', 'sm')}<span>${esc(t('net.banner'))}</span></div>` : ''),
    chip: r => { if (r.name === 'sync') return ''; const n = pend(), off = S.net === 'off'; const lab = off ? t('net.offline') + (n ? ` · ${n}` : '') : n ? t('net.pending_short', { count: n }) : t('net.online'); return `<a class="netchip ${off ? 'off' : ''}" href="#/sync" aria-label="${esc(lab + ' — ' + t('net.open_sync'))}">${ic(off ? 'wifi-off' : n ? 'clock' : 'wifi')}<span>${esc(lab)}</span></a>`; },
    init: () => {
      Q.push({ id: 'q' + (++qSeq), kind: 'status', label: 'Statut du dossier VBG-0031', status: 'conflict', when: 'hier à 17:40', field: 'Statut', base: 'Ouvert', server: 'Clos', mine: 'En cours', choice: '', caseCode: 'VBG-0031' });
      if (S.net === 'off') {
        Q.push({ id: 'q' + (++qSeq), kind: 'case', label: 'Dossier VBG · Ouidah', status: 'pending', when: 'aujourd’hui à 09:14', data: { kind: 'VBG', date: '2026-10-27', zone: 'Atlantique', commune: 'Ouidah', pop: 'Femmes cis', sex: 'Femme', age: '25-34', viol: 'psychologique' } });
        Q.push({ id: 'q' + (++qSeq), kind: 'followup', label: 'Appel de suivi · VBG-0047', status: 'pending', when: 'aujourd’hui à 09:20', fuRef: ['VBG-0047', 99] });
      }
    },
    onNet: (n, was, fromUrl) => { if (n === 'on' && was === 'off') setTimeout(runSync, 600); },
    onRoute: r => {
      if (r.name === 'collecte' && (r.q.etape || r.q.demo)) {
        F = F0(); if (r.q.demo) demoFill(); F.step = +(r.q.etape || 1);
        if (r.q.submit) { for (let i = 1; i <= 4; i++) if (Object.keys(validateStep(i)).length) { F.step = i; return; } setTimeout(() => { Q.length; submitCase(); }, 0); }
      }
    },
    screen: r => {
      switch (r.name) {
        case 'accueil': return home();
        case 'alertes': return alerts();
        case 'alerte': return alertDetail(r.args[0]);
        case 'dossiers': return cases();
        case 'dossier': return caseShow(r.args[0]);
        case 'suivi': return followForm(r.args[0]);
        case 'collecte': return collecte();
        case 'collecte-ok': return collecteOk(r.args[0]);
        case 'sync': return sync();
        case 'conflit': return conflit(r.args[0]);
        case 'push-sos': return pushSos();
        case 'sos': return sosScreen();
        default: return home();
      }
    },
  });
})();
</script>
</body>
