<style>
/* =====================================================================
   Jetons : copie du design system Xomiton (design-system/tokens/tokens.css)
   ===================================================================== */
:root {
  --xm-blue-50:#EBEFFA; --xm-blue-100:#D7DEF5; --xm-blue-200:#AFBEEC; --xm-blue-500:#0433C3; --xm-blue-600:#032BA6; --xm-blue-700:#032488; --xm-blue-800:#021C6B; --xm-blue-900:#02134A;
  --xm-red-50:#FDECEC; --xm-red-500:#E30E0E; --xm-red-600:#C10C0C; --xm-red-700:#9F0A0A;
  --xm-neutral-0:#FFFFFF; --xm-neutral-25:#FBF7FA; --xm-neutral-100:#F3EDF4; --xm-neutral-200:#E4DCE6; --xm-neutral-400:#8E88A0; --xm-neutral-600:#5B5670; --xm-neutral-900:#1B1630;
  --xm-green-700:#0B7A4B; --xm-amber-500:#F0A800; --xm-sky-700:#1864AB; --xm-violet-700:#6F2C91; --xm-rose-600:#C2255C;
  --xm-font-heading:"Montserrat","Segoe UI",Arial,sans-serif;
  --xm-font-body:Arial,"Liberation Sans",Helvetica,sans-serif;
  --xm-radius-md:8px; --xm-radius-lg:16px; --xm-radius-pill:999px;
  --xm-ease-out:cubic-bezier(.2,.8,.2,1);
  --xm-target-min:44px;

  /* Page du simulateur (hors appareil) */
  --pg-bg: var(--xm-neutral-100);
  --pg-surface: var(--xm-neutral-0);
  --pg-border: var(--xm-neutral-200);
  --pg-text: var(--xm-neutral-900);
  --pg-muted: var(--xm-neutral-600);
  --pg-accent: var(--xm-blue-500);
  --pg-accent-subtle: var(--xm-blue-50);
  --pg-code-bg: var(--xm-blue-900);
  --pg-code-text: #DCE3FA;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-page-theme="light"]) {
    --pg-bg:#0B0D1A; --pg-surface:#151829; --pg-border:#2A2E48; --pg-text:#EDEAF7; --pg-muted:#A9A5C0; --pg-accent:#7C97FF; --pg-accent-subtle:#1B2347; --pg-code-bg:#070917;
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--pg-bg); color: var(--pg-text); font: 15px/1.5 var(--xm-font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--xm-font-heading); line-height: 1.2; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pg-accent); outline-offset: 2px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 50; background: var(--pg-accent); color: #fff; padding: 10px 14px; border-radius: 8px; }
.skip:focus { top: 8px; }

/* ---------- Mise en page générale ---------- */
.sim { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--pg-surface); border-bottom: 1px solid var(--pg-border); flex-wrap: wrap; }
.topbar .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.topbar .brand img { height: 28px; width: auto; }
.topbar h1 { font-size: 16px; font-weight: 700; }
.topbar .sub { color: var(--pg-muted); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--pg-border); border-radius: var(--xm-radius-pill); padding: 3px; background: var(--pg-bg); }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: var(--xm-radius-pill); font-size: 13px; font-weight: 700; color: var(--pg-muted); min-height: 32px; }
.seg button[aria-pressed="true"] { background: var(--pg-surface); color: var(--pg-accent); box-shadow: 0 1px 3px rgb(27 22 48 / .14); }
.btn-ghost { border: 1px solid var(--pg-border); background: var(--pg-surface); border-radius: var(--xm-radius-pill); padding: 6px 14px; font-size: 13px; font-weight: 700; min-height: 34px; }

/* Décor des écrans connexion / inscription : ruban arc-en-ciel et petites illustrations (SVG en ligne, aria-hidden, statique). */
.view.has-deco { position: relative; isolation: isolate; }
.deco { pointer-events: none; user-select: none; }
.deco-top { position: absolute; z-index: -1; top: 0; left: 0; right: 0; height: 52px; }
.deco-top svg, .deco-end svg { display: block; width: 100%; height: 100%; }
.deco-end { height: 84px; margin: 0 -16px calc(-1 * (var(--safe-bottom) + 20px)); }

/* Scène centrale */
.stage { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding: 16px; min-height: 0; }
.stage-caption { margin-top: 10px; font-size: 13px; color: var(--pg-muted); text-align: center; }
.stage-caption b { color: var(--pg-text); }
.device-wrap { transform-origin: top center; }

/* ---------- Châssis ---------- */
.device { --w: 390px; --h: 844px; --bezel: 12px; --r: 55px; --sr: 44px; --safe-top: 47px; --safe-bottom: 34px; position: relative; width: calc(var(--w) + var(--bezel) * 2); height: calc(var(--h) + var(--bezel) * 2); padding: var(--bezel); border-radius: var(--r); background: #1d1b26; box-shadow: 0 0 0 2px #4a4757 inset, 0 30px 60px rgb(27 22 48 / .28), 0 8px 18px rgb(27 22 48 / .18); }
.device::before, .device::after { content: ""; position: absolute; background: #2b2836; border-radius: 3px; }
.device::before { left: -3px; top: 160px; width: 3px; height: 64px; box-shadow: 0 84px 0 #2b2836; }
.device::after { right: -3px; top: 220px; width: 3px; height: 96px; }
.device[data-model="pixel8"] { --w: 412px; --h: 880px; --bezel: 10px; --r: 44px; --sr: 34px; --safe-top: 32px; --safe-bottom: 24px; background: #23262b; box-shadow: 0 0 0 2px #50545b inset, 0 30px 60px rgb(27 22 48 / .28), 0 8px 18px rgb(27 22 48 / .18); }
.device[data-model="pixel8"]::before { left: auto; right: -3px; top: 150px; height: 48px; box-shadow: 0 70px 0 0 #2b2836, 0 90px 0 0 #2b2836; }
.device[data-model="pixel8"]::after { display: none; }
.screen { --app-bg: var(--xm-neutral-25); --app-text: var(--xm-neutral-900); position: relative; width: var(--w); height: var(--h); border-radius: var(--sr); overflow: hidden; background: var(--app-bg); isolation: isolate; }
.notch { position: absolute; z-index: 30; left: 50%; top: 0; transform: translateX(-50%); width: 162px; height: 33px; background: #000; border-radius: 0 0 20px 20px; }
.notch::after { content: ""; position: absolute; right: 30px; top: 11px; width: 10px; height: 10px; border-radius: 50%; background: #16151d; box-shadow: inset 0 0 0 2px #24222e; }
.device[data-model="pixel8"] .notch { width: 14px; height: 14px; top: 10px; border-radius: 50%; }
.device[data-model="pixel8"] .notch::after { display: none; }
.statusbar { position: absolute; z-index: 25; left: 0; right: 0; top: 0; height: var(--safe-top); display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 34px; font: 600 15px/1 -apple-system, "SF Pro Text", var(--xm-font-body); color: var(--sb-color, var(--app-text)); pointer-events: none; }
.statusbar .icons { display: flex; gap: 6px; align-items: center; }
.statusbar svg { width: 17px; height: 12px; fill: currentColor; }
.device[data-model="pixel8"] .statusbar { padding: 0 18px; font: 500 14px/1 Roboto, var(--xm-font-body); }
.homebar { position: absolute; z-index: 25; left: 50%; bottom: 8px; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--app-text); opacity: .85; pointer-events: none; }
.device[data-model="pixel8"] .homebar { width: 108px; height: 4px; bottom: 7px; }

/* ---------- Application (dans l'appareil) ---------- */
.app {
  --app-bg: var(--xm-neutral-25); --app-surface: var(--xm-neutral-0); --app-muted-surface: var(--xm-neutral-100); --app-border: var(--xm-neutral-200);
  --app-text: var(--xm-neutral-900); --app-muted: var(--xm-neutral-600); --app-primary: var(--xm-blue-500); --app-primary-hover: var(--xm-blue-600); --app-on-primary: #fff;
  --app-primary-subtle: var(--xm-blue-50); --app-primary-subtle-text: var(--xm-blue-800); --app-danger: var(--xm-red-500); --app-danger-subtle: var(--xm-red-50);
  --app-success: var(--xm-green-700); --app-warning: var(--xm-amber-500); --app-info: var(--xm-sky-700); --app-violet: var(--xm-violet-700);
  position: absolute; inset: 0; background: var(--app-bg); color: var(--app-text); font: 16px/1.5 var(--xm-font-body); display: flex; flex-direction: column;
}
.app[data-theme="dark"] {
  --app-bg: #0E1020; --app-surface: #171A2E; --app-muted-surface: #1F2340; --app-border: #2A2E48; --app-text: #EDEAF7; --app-muted: #A9A5C0;
  --app-primary: #7C97FF; --app-primary-hover: #9DB1FF; --app-on-primary: #0E1020; --app-primary-subtle: #1B2347; --app-primary-subtle-text: #9DB1FF;
  --app-danger: #FF6B6B; --app-danger-subtle: #3A1519; --app-success: #4DD39D; --app-warning: #FFC94D; --app-info: #7AB2FF; --app-violet: #C79BE6;
}
.screen:has(.app[data-theme="dark"]) { --app-bg: #0E1020; --app-text: #EDEAF7; }
.view { flex: 1; overflow-y: auto; overflow-x: hidden; padding: calc(var(--safe-top) + 4px) 16px calc(var(--safe-bottom) + 20px); scrollbar-width: none; overscroll-behavior: contain; }
.view::-webkit-scrollbar { display: none; }
.view.stack, .view.stack-lg { grid-auto-rows: max-content; align-content: start; } /* les cartes overflow:hidden ne doivent pas être compressées */
.app.has-tabs .view { padding-bottom: calc(var(--safe-bottom) + 86px); }
.app.has-appbar .view { padding-top: calc(var(--safe-top) + 60px); }
.appbar { position: absolute; z-index: 20; left: 0; right: 0; top: 0; padding: var(--safe-top) 8px 0; height: calc(var(--safe-top) + 56px); display: flex; align-items: center; gap: 4px; background: color-mix(in srgb, var(--app-bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--app-border); }
.appbar h2 { font-size: 18px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 50%; display: inline-grid; place-items: center; color: var(--app-text); position: relative; flex-shrink: 0; }
.icon-btn:hover { background: var(--app-muted-surface); }
.icon-btn .dot { position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--app-danger); border: 2px solid var(--app-bg); }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.ico.sm { width: 18px; height: 18px; }
.ico.lg { width: 28px; height: 28px; }

/* Barre d'onglets : 5 entrées, SOS au centre (MASTER §6) */
.tabbar { position: absolute; z-index: 20; left: 0; right: 0; bottom: 0; padding: 6px 6px calc(var(--safe-bottom) + 2px); display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; background: color-mix(in srgb, var(--app-surface) 94%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--app-border); }
.tabbar button { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--app-muted); padding: 6px 0; min-height: 48px; }
.tabbar button[aria-current="page"] { color: var(--app-primary); font-weight: 700; }
.tabbar a.tab-space { display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--app-primary-subtle-text); padding: 6px 0; min-height: 48px; text-decoration: none; font-weight: 700; position: relative; }
.tabbar a.tab-space::after { content: ""; position: absolute; top: 4px; right: calc(50% - 20px); width: 8px; height: 8px; border-radius: 50%; background: var(--app-violet); }
.tabbar a.tab-space .ico { color: var(--app-violet); }
.space-card { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; text-decoration: none; color: inherit; border-color: var(--app-primary); }
.space-card .ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--app-primary); color: var(--app-on-primary); }
.tabbar .sos-tab { transform: translateY(-14px); }
.tabbar .sos-tab span.b { width: 60px; height: 60px; border-radius: 50%; background: var(--app-danger); color: #fff; display: grid; place-items: center; font: 800 16px var(--xm-font-heading); box-shadow: 0 6px 16px rgb(227 14 14 / .35); border: 4px solid var(--app-surface); }
.tabbar .sos-tab { color: var(--app-danger); font-weight: 700; }

/* Composants de l'application */
.h-display { font: 800 28px/1.15 var(--xm-font-heading); letter-spacing: -.01em; }
.h1 { font: 800 24px/1.2 var(--xm-font-heading); }
.h2 { font: 700 19px/1.25 var(--xm-font-heading); }
.h3 { font: 700 16px/1.3 var(--xm-font-heading); }
.muted { color: var(--app-muted); }
.small { font-size: 14px; }
.xs { font-size: 13px; }
.stack { display: grid; gap: 12px; }
.stack-lg { display: grid; gap: 20px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.card { background: var(--app-surface); border: 1px solid var(--app-border); border-radius: var(--xm-radius-lg); padding: 16px; }
.card.flat { border: 0; background: var(--app-muted-surface); }
.card.tight { padding: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: var(--xm-radius-md); border: 1px solid transparent; font: 700 15px var(--xm-font-body); text-decoration: none; transition: background-color .12s; }
.btn-primary { background: var(--app-primary); color: var(--app-on-primary); }
.btn-primary:hover { background: var(--app-primary-hover); }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; }
.btn-soft { background: var(--app-primary-subtle); color: var(--app-primary-subtle-text); }
.btn-outline { background: transparent; border-color: var(--app-border); color: var(--app-text); }
.btn-danger { background: var(--app-danger); color: #fff; }
.btn-link { background: none; border: 0; color: var(--app-primary); font-weight: 700; padding: 0; min-height: 44px; }
.btn-block { width: 100%; }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.field { display: grid; gap: 6px; }
.field label, .label { font-size: 14px; font-weight: 700; }
.input { width: 100%; min-height: 48px; border: 1px solid var(--app-border); border-radius: var(--xm-radius-md); background: var(--app-surface); padding: 10px 14px; color: var(--app-text); }
textarea.input { min-height: 96px; resize: none; line-height: 1.45; }
.compose { display: flex; gap: 12px; align-items: flex-start; padding-top: 8px; }
.compose > .grow { flex: 1 1 0; min-width: 0; }
.compose textarea.input { display: block; width: 100%; min-width: 0; max-width: 100%; min-height: 120px; max-height: 320px; overflow-y: auto; resize: none; padding: 10px 12px; font-size: 17px; background: var(--app-surface); }
.input:focus { outline: 3px solid color-mix(in srgb, var(--app-primary) 35%, transparent); border-color: var(--app-primary); }
.input[aria-invalid="true"] { border-color: var(--app-danger); }
.err { color: var(--app-danger); font-size: 13px; display: flex; gap: 6px; align-items: flex-start; }
.hint { color: var(--app-muted); font-size: 13px; }
.pw { position: relative; }
.pw .input { padding-right: 52px; }
.pw .icon-btn { position: absolute; right: 2px; top: 2px; }
.check { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--app-primary); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--app-border); min-height: 56px; }
.switch:last-child { border-bottom: 0; }
.switch input { appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--app-border); position: relative; flex-shrink: 0; transition: background-color .2s; cursor: pointer; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .2s var(--xm-ease-out); }
.switch input:checked { background: var(--app-primary); }
.switch input:checked::after { transform: translateX(18px); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { border: 1px solid var(--app-border); background: var(--app-surface); border-radius: var(--xm-radius-pill); padding: 0 14px; min-height: 36px; font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--app-primary); border-color: var(--app-primary); color: var(--app-on-primary); font-weight: 700; }
.badge { display: inline-flex; align-items: center; gap: 4px; border-radius: var(--xm-radius-pill); padding: 2px 10px; font-size: 12px; font-weight: 700; background: var(--app-primary-subtle); color: var(--app-primary-subtle-text); }
.badge.ok { background: color-mix(in srgb, var(--app-success) 14%, transparent); color: var(--app-success); }
.badge.warn { background: color-mix(in srgb, var(--app-warning) 22%, transparent); color: color-mix(in srgb, var(--app-warning) 45%, var(--app-text)); }
.badge.danger { background: var(--app-danger-subtle); color: var(--app-danger); }
.badge.violet { background: color-mix(in srgb, var(--app-violet) 14%, transparent); color: var(--app-violet); }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--xm-font-heading); color: #fff; flex-shrink: 0; }
.avatar.lg { width: 84px; height: 84px; font-size: 28px; border: 4px solid var(--app-surface); }
.list { display: grid; }
.list > * { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--app-border); min-height: 56px; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; color: inherit; text-decoration: none; }
.list > *:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alert { border-radius: var(--xm-radius-md); padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; background: var(--app-primary-subtle); color: var(--app-primary-subtle-text); }
.alert.ok { background: color-mix(in srgb, var(--app-success) 12%, transparent); color: var(--app-success); }
.alert.danger { background: var(--app-danger-subtle); color: var(--app-danger); }
.progress { height: 8px; border-radius: 4px; background: var(--app-muted-surface); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--app-primary); border-radius: inherit; transition: width .3s var(--xm-ease-out); }
.tile { display: grid; gap: 8px; align-content: start; padding: 14px; border-radius: var(--xm-radius-lg); background: var(--app-surface); border: 1px solid var(--app-border); text-align: left; min-height: 96px; color: inherit; }
.tile .ico { color: var(--app-primary); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.thumb { border-radius: var(--xm-radius-md); background: var(--app-muted-surface) center/cover no-repeat; }
.toast { position: absolute; z-index: 40; left: 16px; right: 16px; bottom: calc(var(--safe-bottom) + 92px); background: var(--xm-neutral-900); color: #fff; border-radius: var(--xm-radius-md); padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; box-shadow: 0 10px 30px rgb(0 0 0 / .25); animation: toast-in .25s var(--xm-ease-out); }
.app[data-theme="dark"] .toast { background: #EDEAF7; color: #0E1020; }
@keyframes toast-in { from { transform: translateY(12px); opacity: 0; } }
.stepper { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: 6px; }
.stepper i { height: 5px; border-radius: 3px; background: var(--app-border); }
.stepper i.on { background: var(--app-primary); }

/* Splash / carrousel plein écran (photos) */
.splash { position: absolute; inset: 0; background: #0B0D1A; color: #fff; }
.slides { position: absolute; inset: 0; overflow: hidden; touch-action: pan-y; }
.slides:focus-visible { outline-offset: -4px; outline-color: #fff; }
.slides-track { display: flex; height: 100%; transition: transform .45s var(--xm-ease-out); }
.slide { position: relative; flex: 0 0 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
.slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slide.is-banner { background: #0B0D1A; }
.slide.is-banner img { inset: 0 auto auto 0; height: auto; object-fit: fill; -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent 100%); mask-image: linear-gradient(180deg, #000 55%, transparent 100%); }
.slide .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(8 10 30 / .62) 0%, rgb(8 10 30 / .12) 24%, rgb(8 10 30 / .08) 40%, rgb(8 10 30 / .78) 70%, rgb(8 10 30 / .94) 100%); }
.slide-copy { position: relative; padding: 0 28px calc(var(--safe-bottom) + 196px); }
.slide-copy h2 { font-size: 28px; line-height: 1.15; font-weight: 800; color: #fff; text-wrap: balance; }
.slide-copy p { color: rgb(255 255 255 / .92); margin: 12px 0 0; font-size: 16px; line-height: 1.5; }
.splash-bar { position: absolute; z-index: 3; top: 0; left: 0; right: 0; padding: calc(var(--safe-top) + 4px) 8px 0 24px; display: flex; align-items: center; justify-content: space-between; }
.splash-bar img { height: 26px; width: auto; }
.splash-skip { min-width: 44px; min-height: 44px; padding: 0 16px; border: 0; border-radius: var(--xm-radius-pill); background: rgb(8 10 30 / .38); color: #fff; font: 700 15px var(--xm-font-body); backdrop-filter: blur(6px); }
.splash-foot { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; padding: 0 24px calc(var(--safe-bottom) + 14px); display: grid; gap: 10px; }
.splash-actions { display: grid; gap: 10px; }
.splash .btn { min-height: 52px; }
.splash .btn-primary { background: #fff; color: var(--xm-blue-700); }
.splash .btn-primary:hover { background: var(--xm-blue-50); }
.splash .btn-ghost-light { background: rgb(8 10 30 / .3); border: 1.5px solid rgb(255 255 255 / .85); color: #fff; }
.splash :focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.dots { display: flex; gap: 0; justify-content: center; }
.dots button { width: 32px; height: 44px; border: 0; padding: 0; background: transparent; display: grid; place-items: center; }
.dots button i { width: 8px; height: 8px; border-radius: 4px; background: rgb(255 255 255 / .55); transition: width .25s var(--xm-ease-out), background-color .25s; }
.dots button[aria-current="true"] i { width: 24px; background: #fff; }
.screen:has(.splash) .homebar { background: #fff; }

/* OTP */
.otp { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.otp input { width: 100%; height: 56px; text-align: center; font: 700 22px var(--xm-font-heading); border: 1px solid var(--app-border); border-radius: var(--xm-radius-md); background: var(--app-surface); color: var(--app-text); }
.otp input:focus { outline: 3px solid color-mix(in srgb, var(--app-primary) 35%, transparent); border-color: var(--app-primary); }

/* Jauge de mot de passe */
.meter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.meter i { height: 6px; border-radius: 3px; background: var(--app-border); transition: background-color .2s; }
.rules { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 13px; }
.rules li { display: flex; gap: 6px; align-items: center; color: var(--app-muted); }
.rules li.ok { color: var(--app-success); }

/* SOS */
.sos-wrap { display: grid; justify-items: center; gap: 18px; text-align: center; padding-top: 10px; }
.sos-big { position: relative; width: 184px; height: 184px; border-radius: 50%; border: 0; background: var(--app-danger); color: #fff; font: 800 34px var(--xm-font-heading); box-shadow: 0 16px 36px rgb(227 14 14 / .35); touch-action: none; user-select: none; -webkit-user-select: none; }
.sos-big svg.ring { position: absolute; inset: -12px; width: calc(100% + 24px); height: calc(100% + 24px); transform: rotate(-90deg); }
.sos-big svg.ring circle { fill: none; stroke: var(--app-danger); stroke-width: 6; stroke-dasharray: 650; stroke-dashoffset: 650; }
.sos-big.holding svg.ring circle { transition: stroke-dashoffset 2s linear; stroke-dashoffset: 0; }
.count { font: 800 72px/1 var(--xm-font-heading); color: var(--app-danger); font-variant-numeric: tabular-nums; }

/* Fil */
.post { background: var(--app-surface); border: 1px solid var(--app-border); border-radius: var(--xm-radius-lg); overflow: hidden; }
.post-head { display: flex; gap: 10px; align-items: center; padding: 14px 14px 8px; }
.post-body { padding: 0 14px 10px; font-size: 15px; }
.post-img { aspect-ratio: 16 / 9; background: center/cover no-repeat var(--app-muted-surface); }
.post-actions { display: flex; border-top: 1px solid var(--app-border); }
.post-actions button { flex: 1; border: 0; background: none; min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--app-muted); font-size: 14px; }
.post-actions button[aria-pressed="true"] { color: var(--app-danger); font-weight: 700; }
.post-actions button[aria-pressed="true"] .ico { fill: currentColor; }
.poll { border: 1px solid var(--app-border); border-radius: var(--xm-radius-md); padding: 12px; margin: 0 14px 12px; display: grid; gap: 8px; }
.poll-opt { position: relative; overflow: hidden; border: 1px solid var(--app-border); border-radius: var(--xm-radius-md); min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--app-surface); text-align: left; width: 100%; font-size: 14px; color: var(--app-text); }
.poll-opt .bar { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--app-primary) 14%, transparent); transition: width .5s var(--xm-ease-out); }
.poll-opt > span { position: relative; }
.poll-opt .pct { margin-left: auto; font-weight: 700; }
.poll-opt.mine { border-color: var(--app-primary); }
.composer { display: flex; gap: 10px; align-items: center; }
.composer .fake { flex: 1; min-height: 44px; border-radius: var(--xm-radius-pill); background: var(--app-muted-surface); border: 0; text-align: left; padding: 0 16px; color: var(--app-muted); }

/* Messagerie */
.bubbles { display: grid; gap: 8px; }
.bubble { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.4; }
.bubble.in { background: var(--app-surface); border: 1px solid var(--app-border); border-bottom-left-radius: 6px; justify-self: start; }
.bubble.out { background: var(--app-primary); color: var(--app-on-primary); border-bottom-right-radius: 6px; justify-self: end; }
.bubble .t { display: block; font-size: 11px; opacity: .7; margin-top: 4px; }
.chatbar { position: absolute; z-index: 20; left: 0; right: 0; bottom: 0; padding: 8px 10px calc(var(--safe-bottom) + 6px); display: flex; gap: 8px; background: var(--app-surface); border-top: 1px solid var(--app-border); }
.chatbar .input { border-radius: var(--xm-radius-pill); }
.typing { display: inline-flex; gap: 4px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--app-muted); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .25; } }

/* Profil */
.cover { height: 120px; margin: calc(-1 * (var(--safe-top) + 4px)) -16px 0; background: center/cover no-repeat; position: relative; }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgb(0 0 0 / .25), transparent 50%); }

/* ---------- Panneau droit : transposition Flutter ---------- */
.panel { overflow-y: auto; background: var(--pg-surface); border-left: 1px solid var(--pg-border); padding: 18px 18px 28px; }
.panel h2 { font-size: 18px; font-weight: 800; }
.panel .route { display: inline-block; margin-top: 6px; font: 13px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; background: var(--pg-accent-subtle); color: var(--pg-accent); padding: 3px 8px; border-radius: 6px; }
.panel section { margin-top: 18px; }
.panel h3 { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.panel dl { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; margin: 0; font-size: 14px; }
.panel dt { color: var(--pg-muted); }
.panel dd { margin: 0; font: 13px/1.45 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; word-break: break-word; }
.panel pre { margin: 0; background: var(--pg-code-bg); color: var(--pg-code-text); border-radius: 10px; padding: 12px 14px; font: 12.5px/1.55 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; overflow-x: auto; white-space: pre; }
.panel ul.api { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font: 13px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
.panel ul.api li { display: flex; gap: 8px; align-items: baseline; }
.panel .verb { font-weight: 700; min-width: 52px; }
.verb.GET { color: #0B7A4B; } .verb.POST { color: var(--pg-accent); } .verb.PATCH, .verb.PUT { color: #B84B00; } .verb.DELETE { color: #C10C0C; }
@media (prefers-color-scheme: dark) { :root:not([data-page-theme="light"]) .verb.GET { color: #4DD39D; } :root:not([data-page-theme="light"]) .verb.PATCH { color: #FF9A5C; } :root:not([data-page-theme="light"]) .verb.DELETE { color: #FF8787; } }
.panel .ds { display: flex; flex-wrap: wrap; gap: 6px; }
.panel .ds span { border: 1px solid var(--pg-border); border-radius: var(--xm-radius-pill); padding: 2px 10px; font-size: 13px; }
.panel .warn { border-left: 4px solid #F0A800; background: color-mix(in srgb, #F0A800 12%, var(--pg-surface)); padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 14px; }
.panel .state { font-size: 13px; color: var(--pg-muted); }
.panel .state code { color: var(--pg-text); }

/* ---------- Réactif ---------- */
@media (max-width: 1280px) {
  .sim { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; height: auto; min-height: 100vh; }
  .stage { min-height: calc(100vh - 60px); }
  .panel { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--pg-border); display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0 24px; }
  .panel > header { grid-column: 1 / -1; }
}
@media (max-width: 820px) {
  .sim { grid-template-columns: 1fr; }
  .topbar { padding: 10px 16px; }
  .topbar .sub { display: none; }
  .stage { padding: 12px 0; min-height: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

<script>
/* Session et sélecteur d'espace partagés (simulateur, espace pair, admin mobile) — décision client du 29/10/2026 :
   UNE SEULE application, un seul compte ; un compte peut cumuler Membre + Pair éducateur·rice et/ou Admin.
   Après connexion, un sélecteur d'espace s'affiche selon les rôles ; un commutateur reste dans l'en-tête et dans le profil.
   La session de démonstration est partagée entre les trois pages par localStorage (clé xm-session-v1) ;
   sans stockage disponible (file://, navigation privée), chaque page retombe sur des rôles de démonstration. */
(function () {
  'use strict';
  const KEY = 'xm-session-v1';
  const ORDER = ['membre', 'pair', 'admin'];
  const DEST = { membre: 'index.html#/dashboard', pair: 'espace-pair.html#/accueil', admin: 'admin-mobile.html#/tableau' };
  const LAB = { membre: 'Membre', pair: 'Pair éducateur·rice', admin: 'Administration' };
  const SHORT = { membre: 'Membre', pair: 'Pair', admin: 'Admin' };
  const DESC = {
    membre: 'Réseau social, messages, SOS, ressources et événements.',
    pair: 'Alertes routées vers toi, dossiers, collecte hors ligne, file de synchronisation.',
    admin: 'Astreinte, inscriptions, rôles et invitations, modération, maintenance.',
  };
  const ICO = {
    membre: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    pair: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>',
    admin: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
  };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const svg = (n, c) => `<svg class="${c || 'xmsp-i'}" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICO[n] || ''}</svg>`;
  const clean = r => { const s = new Set(['membre', ...(Array.isArray(r) ? r : [])]); return ORDER.filter(x => s.has(x)); };
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } };
  let mem = null, created = false;
  const state = () => mem || (mem = read() || (created = true, { roles: ['membre'], space: 'membre' }));
  const write = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* stockage indisponible */ } };

  const X = window.XmSpace = {
    ORDER, DEST, LAB, SHORT, DESC, esc, svg,
    isNew: () => { state(); return created; },
    reset: () => { mem = { roles: ['membre'], space: 'membre' }; created = true; write(); },
    roles: () => clean(state().roles),
    space: () => state().space || 'membre',
    multi: () => X.roles().length > 1,
    has: r => X.roles().includes(r),
    setRoles: r => { state().roles = clean(r); if (!X.has(state().space)) state().space = 'membre'; write(); },
    setSpace: s => { state().space = s; write(); },
    /* Chaque page déclare son espace. En mode recette (menu ☰), le rôle manquant est ajouté au compte de démonstration. */
    enter: space => { const s = state(); const r = new Set(clean(s.roles)); r.add(space); s.roles = clean([...r]); s.space = space; write(); },
    /* Bouton de l'en-tête : espace courant + chevron ; n'existe que pour un compte à plusieurs rôles. */
    pill: (cur, cls) => (X.multi() ? `<button type="button" class="xmsp-pill ${cls || ''}" data-xmsp-open aria-haspopup="dialog" aria-label="Espace actuel : ${esc(LAB[cur])}. Changer d’espace">${svg(cur)}<span>${esc(SHORT[cur])}</span><svg class="xmsp-c" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>` : ''),
    /* Liste des espaces accessibles (écran de choix et feuille). */
    options: cur => X.roles().map(r => `<a class="xmsp-opt" href="${DEST[r]}" data-xmsp-go="${r}" ${r === cur ? 'aria-current="page"' : ''}><span class="xmsp-ic">${svg(r)}</span><span class="xmsp-tx"><b>${esc(LAB[r])}</b><small>${esc(DESC[r])}</small></span>${r === cur ? '<span class="xmsp-here">Ici</span>' : '<svg class="xmsp-c2" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'}</a>`).join(''),
    /* Feuille « Choisir mon espace » dans l'écran du téléphone. */
    open: (host, cur) => {
      host = host || document.getElementById('app'); if (!host) return;
      cur = cur || X.space();
      const opener = document.activeElement;
      const el = document.createElement('div'); el.className = 'xmsp-ov';
      el.innerHTML = `<div class="xmsp-scrim" data-xmsp-close></div><div class="xmsp-sheet" role="dialog" aria-modal="true" aria-labelledby="xmspT"><div class="xmsp-grab" aria-hidden="true"></div>
        <h2 id="xmspT">Choisir mon espace</h2><p class="xmsp-p">Un seul compte, une seule connexion. Tes rôles : ${X.roles().map(r => `<b>${esc(LAB[r])}</b>`).join(', ')}.</p>
        <div class="xmsp-list">${X.options(cur)}</div><button type="button" class="xmsp-x" data-xmsp-close>Fermer</button></div>`;
      host.appendChild(el);
      const close = () => { document.removeEventListener('keydown', key, true); el.remove(); if (opener && opener.focus && document.contains(opener)) opener.focus({ preventScroll: true }); };
      const key = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
      document.addEventListener('keydown', key, true);
      el.addEventListener('click', e => { if (e.target.closest('[data-xmsp-close]')) close(); });
      const a = el.querySelector('.xmsp-opt:not([aria-current])') || el.querySelector('.xmsp-opt'); if (a) a.focus({ preventScroll: true });
    },
  };

  document.addEventListener('click', e => {
    const o = e.target.closest('[data-xmsp-open]'); if (o) { e.preventDefault(); X.open(document.getElementById('app'), o.dataset.xmspCur); return; }
    const g = e.target.closest('[data-xmsp-go]'); if (g) { X.setSpace(g.dataset.xmspGo); /* la navigation suit le lien */ }
  });

  const css = document.createElement('style'); css.id = 'xmspCss';
  css.textContent = `
.xmsp-pill { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px 0 12px; border-radius: 999px; border: 1.5px solid var(--app-primary, #0433C3); background: var(--app-primary-subtle, #EBEFFA); color: var(--app-primary-subtle-text, #021C6B); font: 700 13px var(--xm-font-body, Arial, sans-serif); cursor: pointer; white-space: nowrap; }
.xmsp-pill:hover { background: var(--app-surface, #fff); }
.xmsp-pill .xmsp-i { width: 18px; height: 18px; } .xmsp-pill .xmsp-c { width: 16px; height: 16px; }
.xmsp-pill:focus-visible { outline: 3px solid var(--app-primary, #0433C3); outline-offset: 2px; }
.xmsp-ov { position: absolute; inset: 0; z-index: 60; }
.xmsp-scrim { position: absolute; inset: 0; background: rgb(10 12 28 / .6); }
.xmsp-sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; overflow-y: auto; background: var(--app-surface, #fff); color: var(--app-text, #1B1630); border-radius: 20px 20px 0 0; padding: 12px 16px calc(var(--safe-bottom, 34px) + 14px); display: grid; gap: 12px; font-family: var(--xm-font-body, Arial, sans-serif); }
.xmsp-grab { width: 40px; height: 4px; border-radius: 2px; background: var(--app-border, #E4DCE6); justify-self: center; }
.xmsp-sheet h2 { font: 700 19px/1.25 var(--xm-font-heading, Montserrat, sans-serif); margin: 0; }
.xmsp-p { margin: 0; font-size: 14px; color: var(--app-muted, #5B5670); }
.xmsp-list { display: grid; gap: 10px; }
.xmsp-opt { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; min-height: 64px; padding: 10px 12px; border: 1.5px solid var(--app-border, #E4DCE6); border-radius: 16px; color: inherit; text-decoration: none; background: var(--app-surface, #fff); }
.xmsp-opt[aria-current="page"] { border-color: var(--app-primary, #0433C3); background: var(--app-primary-subtle, #EBEFFA); }
.xmsp-opt:focus-visible { outline: 3px solid var(--app-primary, #0433C3); outline-offset: 2px; }
.xmsp-ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--app-primary, #0433C3); color: var(--app-on-primary, #fff); }
.xmsp-ic .xmsp-i { width: 24px; height: 24px; }
.xmsp-tx { display: grid; gap: 2px; min-width: 0; } .xmsp-tx b { font-size: 16px; } .xmsp-tx small { font-size: 13px; color: var(--app-muted, #5B5670); line-height: 1.35; }
.xmsp-here { font-size: 12px; font-weight: 700; color: var(--app-primary-subtle-text, #021C6B); }
.xmsp-c2 { width: 20px; height: 20px; color: var(--app-muted, #5B5670); }
.xmsp-x { min-height: 48px; border-radius: 12px; border: 1px solid var(--app-border, #E4DCE6); background: transparent; color: inherit; font: 700 15px var(--xm-font-body, Arial, sans-serif); cursor: pointer; }
.xmsp-strip { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-bottom: -4px; }
`;
  document.head.appendChild(css);
})();

</script>

        <div class="field"><label for="st">Contact de confiance (téléphone)</label><input class="input" id="st" inputmode="tel" value="${esc(d.trusted)}" placeholder="+229 01 97 00 00 00" autocomplete="tel"><span class="hint">Prévenu·e uniquement si tu déclenches un SOS.</span></div>
        <label class="switch"><span><b>Mode discret</b><br><span class="xs muted">Icône et nom neutres, notifications sans contenu.</span></span><input type="checkbox" id="sd" ${d.discreet ? 'checked' : ''}></label>`,
      () => `<label class="check"><input type="checkbox" id="c1" ${d.cgu ? 'checked' : ''}><span>J’accepte les <u>conditions d’utilisation</u> et la <u>charte de la communauté</u>. <b>(obligatoire)</b></span></label>
        <label class="check"><input type="checkbox" id="c2" ${d.privacy ? 'checked' : ''}><span>J’ai lu la <u>politique de confidentialité</u> : mes données sont hébergées de façon sécurisée et je peux les supprimer à tout moment. <b>(obligatoire)</b></span></label>
        <label class="check"><input type="checkbox" id="c3" ${d.sensitive ? 'checked' : ''}><span>J’autorise l’enregistrement de mes données sensibles (orientation, identité de genre) pour personnaliser l’accompagnement. <span class="muted">(facultatif)</span></span></label>
        <label class="check"><input type="checkbox" id="c4" ${d.news ? 'checked' : ''}><span>Je souhaite recevoir la newsletter Xomiton. <span class="muted">(facultatif, désinscription en un clic)</span></span></label>
        <div id="consentErr"></div>`
    ][st - 1]();
    return `<div class="appbar">${decoTop()}<button class="icon-btn" data-action="prev" aria-label="Retour">${ic('back')}</button><h2>Étape ${st} sur 4</h2>${st === 2 || st === 3 ? '<button class="btn-link small" data-action="skipstep" style="padding:0 12px">Passer</button>' : ''}</div>
    <div class="view stack-lg"><div class="stepper" style="--n:4">${[1, 2, 3, 4].map(i => `<i class="${i <= st ? 'on' : ''}"></i>`).join('')}</div>
      <h1 class="h1">${titles[st - 1]}</h1>${inv ? `<div class="alert" role="status">${ic('shield', 'sm')}<span><b>Invitation de l’équipe Xomiton</b> (code ${esc(inv)}). Tu t’inscris comme tout le monde ; une fois ton compte créé, l’équipe valide ton rôle de pair éducateur·rice.</span></div>` : ''}<form class="stack" id="sf" novalidate>${body}<div id="sfErr"></div>
      <button class="btn btn-primary btn-block" id="sfGo" ${st === 1 && !d.age15 ? 'disabled' : ''}>${st === 4 ? 'Créer mon compte' : 'Continuer'}</button></form>
      ${st === 1 ? '<button class="btn btn-link" data-go="login">J’ai déjà un compte</button>' : ''}${decoEnd()}</div>`; },
  mount: (root, inv) => { const d = S.signup, f = root.querySelector('#sf');
    root.querySelector('[data-action=prev]').onclick = () => { if (d.step > 1) { d.step--; save(); render(); } else back(); };
    const skip = root.querySelector('[data-action=skipstep]'); if (skip) skip.onclick = () => { d.step++; save(); render(); };
    const age = root.querySelector('#sa'), go1 = root.querySelector('#sfGo');
    if (age) { age.onchange = () => { d.age15 = age.checked; go1.disabled = !age.checked; root.querySelector('#sfErr').innerHTML = ''; save(); };
      root.querySelector('#under15').onclick = () => { d.age15 = false; age.checked = false; go1.disabled = true; save();
        root.querySelector('#sfErr').innerHTML = `<div class="alert" role="status" tabindex="-1" id="ageRefus">${ic('info', 'sm')}<span><b>Merci de ta franchise.</b> Pour te protéger, Xomiton n’est pas ouvert avant 15 ans, donc nous ne pouvons pas créer ton compte. Tu n’as rien fait de mal et tu n’es pas seule : parle à une personne de confiance (un·e adulte, une infirmière scolaire, un·e enseignant·e). Si tu es en danger, appelle les secours de ta région.</span></div>`; root.querySelector('#ageRefus').focus(); }; }
    const pw = root.querySelector('#sw'); if (pw) pw.oninput = () => { d.password = pw.value; root.querySelector('#meter').innerHTML = meter(pw.value); };
    root.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { d[b.dataset.pick] = b.dataset.val || b.textContent; save(); render(); });
    f.onsubmit = ev => { ev.preventDefault(); const err = m => { root.querySelector('#sfErr').innerHTML = `<div class="alert danger" role="alert">${ic('alert', 'sm')}<span>${m}</span></div>`; };
      if (d.step === 1) { d.pseudo = f.sp.value.trim(); d.email = f.se.value.trim();
        if (!d.age15) return err('Pour créer ton compte, confirme que tu as 15 ans ou plus.');
        if (d.pseudo.length < 3) return err('Choisis un pseudonyme d’au moins 3 caractères.');
        if (!/^\S+@\S+\.\S+$/.test(d.email)) return err('Indique une adresse e-mail valide, par exemple nom@exemple.bj.');
        if (strength(d.password).score < 3) return err('Ton mot de passe doit être au moins « Fort » : 10 caractères, majuscule, minuscule et chiffre.'); }
      if (d.step === 2) d.zone = f.sz.value;
      if (d.step === 3) { d.trusted = f.st.value.trim(); d.discreet = f.sd.checked; }
      if (d.step === 4) { d.cgu = f.c1.checked; d.privacy = f.c2.checked; d.sensitive = f.c3.checked; d.news = f.c4.checked;
        if (!d.cgu || !d.privacy) { save(); return err('Pour créer ton compte, accepte les conditions d’utilisation et la politique de confidentialité.'); }
        S.user = Object.assign(S.user, { pseudo: d.pseudo, email: d.email, name: d.pseudo, zone: d.zone || S.user.zone }); S.newsletter.on = d.news;
        S.otp = { purpose: 'signup', email: d.email, invite: inv || '' }; d.step = 1; save(); syncTop(); return go('otp'); }
      d.step++; save(); render(); };
  } });

let otpTimer = null, otpLeft = 30, otpErr = '';
def({ id: 'otp', module: 'auth', title: 'Code par e-mail (OTP)', route: '/otp?purpose=login|signup|reset', page: 'OtpPage', provider: 'otpControllerProvider.family(OtpPurpose)', chrome: 'bare',
  tree: `OtpPage(purpose)
└─ Scaffold
   ├─ AppBar(BackButton)
   └─ Column
      ├─ Icon(mail) + Text « Vérifie tes e-mails »
      ├─ XmOtpField(length: 6,
      │    autofillHints: oneTimeCode,
      │    collage du code complet)
      ├─ Text erreur (Semantics liveRegion)
      ├─ TextButton « Renvoyer » (compte à rebours 30 s)
      └─ FilledButton « Valider »`,
  api: [['POST', '/api/v1/auth/otp/verify', '{purpose, email, code} → {token} | {reset_token}'], ['POST', '/api/v1/auth/otp/send', '{purpose, email} (limité : 5 / heure)']],
  ds: DS('XmOtpField', 'FilledButton.primary', 'Countdown'),
  warn: 'OTP par e-mail, pas par SMS : couverture universelle, coût nul, aucune dépendance opérateur. Un seul écran pour connexion, inscription et réinitialisation via le paramètre purpose. Code valable 10 min, 5 essais.',
  render: () => { const o = S.otp; const lbl = { login: 'pour te connecter', signup: 'pour activer ton compte', reset: 'pour choisir un nouveau mot de passe' }[o.purpose];
    return `${appbar('Vérification')}<div class="view stack-lg">
      <div class="stack" style="justify-items:start"><span class="avatar" style="background:var(--app-primary-subtle);color:var(--app-primary);width:56px;height:56px">${ic('mail', 'lg')}</span>
      <h1 class="h1">Vérifie tes e-mails</h1><p class="muted" style="margin:0">Nous avons envoyé un code à 6 chiffres à <b style="color:var(--app-text)">${esc(o.email)}</b> ${lbl}.</p></div>
      <form class="stack" id="of" novalidate><fieldset style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:8px">Code de vérification</legend>
      <div class="otp">${[0, 1, 2, 3, 4, 5].map(i => `<input inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="${i ? 'off' : 'one-time-code'}" aria-label="Chiffre ${i + 1}">`).join('')}</div></fieldset>
      ${otpErr ? `<div class="err" role="alert">${ic('alert', 'sm')}${esc(otpErr)}</div>` : ''}
      <div class="hint">Démo : saisis n’importe quel code à 6 chiffres (000000 est refusé).</div>
      <button class="btn btn-primary btn-block">Valider</button></form>
      <button class="btn btn-link" id="resend" ${otpLeft > 0 ? 'disabled' : ''}>${otpLeft > 0 ? `Renvoyer le code dans ${otpLeft} s` : 'Renvoyer le code'}</button></div>`; },
  mount: root => { const ins = [...root.querySelectorAll('.otp input')], f = root.querySelector('#of');
    ins[0].focus();
    ins.forEach((inp, i) => {
      inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, '').slice(-1); if (inp.value && ins[i + 1]) ins[i + 1].focus(); });
      inp.addEventListener('keydown', e => { if (e.key === 'Backspace' && !inp.value && ins[i - 1]) ins[i - 1].focus(); });
      inp.addEventListener('paste', e => { const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6); if (t.length) { e.preventDefault(); t.split('').forEach((c, j) => { if (ins[j]) ins[j].value = c; }); (ins[t.length] || ins[5]).focus(); } });
    });
    clearInterval(otpTimer); otpTimer = setInterval(() => { otpLeft = Math.max(0, otpLeft - 1); const b = root.querySelector('#resend'); if (!b) return clearInterval(otpTimer); b.disabled = otpLeft > 0; b.textContent = otpLeft > 0 ? `Renvoyer le code dans ${otpLeft} s` : 'Renvoyer le code'; if (!otpLeft) clearInterval(otpTimer); }, 1000);
    root.querySelector('#resend').onclick = () => { otpLeft = 30; otpErr = ''; toast('Nouveau code envoyé. Il annule le précédent.'); render(); };
    f.onsubmit = e => { e.preventDefault(); const code = ins.map(x => x.value).join('');
      if (code.length < 6) { otpErr = 'Saisis les 6 chiffres du code.'; return render(); }
      if (code === '000000') { otpErr = 'Ce code est incorrect ou a expiré. Vérifie le dernier e-mail reçu ou demande un nouveau code.'; return render(); }
      otpErr = ''; otpLeft = 30; clearInterval(otpTimer);
      if (S.otp.purpose === 'reset') return go('reset');
      S.auth = true; const login = S.otp.purpose === 'login';
      XmSpace.setRoles(login ? (ACCT[S.otp.acct] || ['membre']) : ['membre']); XmSpace.setSpace('membre'); // l'inscription ne crée que des membres
      save(); stack = [];
      go(login && isMulti() ? 'espaces' : 'dashboard', { replace: true }); // plusieurs rôles : sélecteur d'espace
      toast(S.otp.purpose === 'signup' ? (S.otp.invite ? 'Bienvenue ! Ton compte membre est actif ; l’équipe valide ton rôle de pair sous 48 h.' : 'Bienvenue sur Xomiton, ton compte est actif.') : 'Connexion réussie.'); };
  } });

let sosPhase = 'idle', sosHold = null, sosTick = null, sosLeft = 5;
def({ id: 'sos', module: 'sos', title: 'SOS', route: '/sos', page: 'SosPage', provider: 'sosControllerProvider (Notifier<SosState>)', chrome: 'stack',
  tree: `SosPage
└─ Scaffold
   ├─ AppBar(BackButton)
   └─ Center › Column
      ├─ Text « Maintiens 2 secondes »
      ├─ XmSosButton(size: 184,
      │    onLongPress 2 s → anneau,
      │    Semantics(onTap double appui))
      ├─ SwitchListTile « Partager ma position »
      └─ (compte à rebours 5 s) OutlinedButton « Annuler »`,
  api: [['POST', '/api/v1/sos', '{lat, lng, accuracy, share_location} → envoi dans la requête (Http::pool, 3 s)'], ['POST', '/api/v1/sos/{id}/cancel', 'pendant le compte à rebours']],
  ds: DS('XmSosButton', 'SwitchListTile', 'OutlinedButton 52 px'),
  warn: 'Hors ligne : l’alerte part dès le retour du réseau + appel direct aux numéros d’urgence en cache. Alternatives au maintien : double appui puis confirmation, ou Espace maintenu au clavier. HapticFeedback.heavyImpact au déclenchement.',
  render: () => `${appbar('SOS')}<div class="view"><div class="sos-wrap">
    ${sosPhase === 'count' ? `<p class="h2" style="margin:20px 0 0">Envoi de ton alerte dans</p><div class="count" aria-live="assertive">${sosLeft}</div><p class="muted" style="margin:0">Tu peux encore annuler.</p><button class="btn btn-outline btn-block" id="sosCancel" style="min-height:52px;font-size:17px">Annuler l’alerte</button>`
    : `<p class="h2" style="margin:12px 0 0">Maintiens le bouton 2 secondes pour envoyer ton alerte</p><p class="small muted" style="margin:0">Tes contacts de confiance et le point focal de ta zone seront prévenus.</p>
    <button class="sos-big" id="sosBtn" aria-describedby="sosHelp">SOS<svg class="ring" viewBox="0 0 208 208" aria-hidden="true"><circle cx="104" cy="104" r="100"/></svg></button>
    <p class="xs muted" id="sosHelp" style="margin:0">Au clavier : maintiens la touche Espace. Lecteur d’écran : double appui puis confirme.</p>
    <label class="switch card" style="width:100%;padding:12px 16px;border-bottom:1px solid var(--app-border)"><span style="text-align:left"><b>Partager ma position</b><br><span class="xs muted">Seulement avec les personnes alertées.</span></span><input type="checkbox" id="sosShare" ${S.sos.share ? 'checked' : ''}></label>
    <button class="btn btn-link" data-go="urgences">${ic('phone', 'sm')} Appeler un numéro d’urgence</button>`}</div></div>`,
  mount: root => { const b = root.querySelector('#sosBtn');
    const startCount = () => { sosPhase = 'count'; sosLeft = 5; if (navigator.vibrate) navigator.vibrate(80); render();
      sosTick = setInterval(() => { sosLeft--; if (sosLeft <= 0) { clearInterval(sosTick); sosPhase = 'idle'; go('sos-envoye', { replace: true }); } else { const c = document.querySelector('.count'); if (c) c.textContent = sosLeft; } }, 1000); };
    const c = root.querySelector('#sosCancel'); if (c) { c.focus(); c.onclick = () => { clearInterval(sosTick); sosPhase = 'idle'; render(); toast('Alerte annulée. Personne n’a été prévenu.'); }; }
    if (!b) return;
    const share = root.querySelector('#sosShare'); share.onchange = () => { S.sos.share = share.checked; save(); };
    const down = e => { if (e.type === 'keydown' && e.key !== ' ' && e.key !== 'Enter') return; if (e.repeat) return; e.preventDefault(); b.classList.add('holding'); sosHold = setTimeout(() => { b.classList.remove('holding'); startCount(); }, 2000); };
    const up = () => { clearTimeout(sosHold); b.classList.remove('holding'); };
    b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('keydown', down); b.addEventListener('keyup', up);
    b.addEventListener('dblclick', () => { if (confirm('Envoyer une alerte SOS maintenant ?')) startCount(); });
  } });

const VIOL = ['Violence physique', 'Violence psychologique', 'Violence sexuelle', 'Violence économique', 'Harcèlement en ligne', 'Discrimination'];
def({ id: 'signalement', module: 'sos', title: 'Signalement (4 étapes)', route: '/signalement?step=1..4', page: 'ReportFormPage', provider: 'reportDraftProvider (persisté localement)', chrome: 'stack',
  tree: `ReportFormPage
└─ Scaffold
   ├─ AppBar(« Étape n sur 4 »)
   ├─ XmStepper
   └─ _Step
      1 XmChoiceList(type de violence)
      2 XmTextArea(récit, min 20 car.)
      3 ZoneSelect + CommuneSelect (cascade)
      4 SegmentedButton(anonyme | contactable)
   → _Summary → _TrackingCode (copier)`,
  api: [['POST', '/api/v1/signalements', '{type, description, zone, commune, contact?, anonymous}'], ['—', 'file hors ligne', 'Hive → synchronisation au retour du réseau']],
  ds: DS('XmStepper', 'XmChoiceList', 'XmTextArea', 'SegmentedButton', 'FilledButton.primary'),
  warn: 'Brouillon sauvegardé à chaque étape (Hive chiffré) : « Tu peux t’arrêter et reprendre plus tard ». Le bouton « Envoyer » est bleu, jamais rouge.',
  render: () => { const r = S.report, st = r.step;
    const steps = [
      () => `<h1 class="h1">Que s’est-il passé ?</h1><div class="stack" style="gap:8px">${VIOL.map(v => `<button type="button" class="card tight row" data-type="${v}" aria-pressed="${r.type === v}" style="text-align:left;color:inherit;${r.type === v ? 'border-color:var(--app-primary);background:var(--app-primary-subtle)' : ''}"><span class="grow">${v}</span>${r.type === v ? ic('check') : ''}</button>`).join('')}</div>`,
      () => `<h1 class="h1">Raconte, avec tes mots</h1><div class="field"><label for="rt">Description</label><textarea class="input" id="rt" rows="6" placeholder="Ce qui s’est passé, quand, et si tu es toujours en danger.">${esc(r.text)}</textarea><span class="hint" id="rtc">${r.text.length} caractères (20 minimum)</span></div>`,
      () => `<h1 class="h1">Où ?</h1><div class="field"><label for="rz">Département</label><select class="input" id="rz">${['Littoral', 'Atlantique', 'Ouémé', 'Borgou', 'Zou'].map(z => `<option ${r.zone === z ? 'selected' : ''}>${z}</option>`).join('')}</select></div><div class="field"><label for="rc">Commune</label><input class="input" id="rc" value="${esc(r.city)}"></div>`,
      () => `<h1 class="h1">Veux-tu être recontacté·e ?</h1><div class="chips wrap">${[['anonyme', 'Rester anonyme'], ['contactable', 'Être recontacté·e']].map(c => `<button type="button" class="chip" data-contact="${c[0]}" aria-pressed="${r.contact === c[0]}">${c[1]}</button>`).join('')}</div>
        ${r.contact === 'contactable' ? `<div class="field"><label for="rch">Canal préféré</label><select class="input" id="rch">${['WhatsApp', 'SMS', 'Appel', 'E-mail'].map(c => `<option ${r.channel === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>` : '<div class="alert">' + ic('shield', 'sm') + '<span>Aucune donnée d’identité n’est enregistrée. Garde ton code de suivi pour connaître la suite.</span></div>'}
        <div class="card flat stack small" style="gap:4px"><b>Récapitulatif</b><span>${esc(r.type || '—')}</span><span class="muted">${esc(r.text.slice(0, 90))}${r.text.length > 90 ? '…' : ''}</span><span class="muted">${esc(r.city)}, ${esc(r.zone)}</span></div>`
    ];
    return `${appbar('Étape ' + st + ' sur 4')}<div class="view stack-lg"><div class="stepper" style="--n:4">${[1, 2, 3, 4].map(i => `<i class="${i <= st ? 'on' : ''}"></i>`).join('')}</div>
      <form class="stack-lg" id="rf2" novalidate>${steps[st - 1]()}<div id="rErr2"></div><div class="row"><button type="button" class="btn btn-outline" id="rPrev" ${st === 1 ? 'hidden' : ''}>Retour</button><button class="btn btn-primary" style="flex:1">${st === 4 ? 'Envoyer mon signalement' : 'Continuer'}</button></div></form>
      <p class="xs muted" style="text-align:center;margin:0">${ic('lock', 'sm')} Brouillon enregistré sur ton téléphone. Tu peux reprendre plus tard.</p></div>`; },
  mount: root => { const r = S.report, f = root.querySelector('#rf2'), er = m => root.querySelector('#rErr2').innerHTML = `<div class="err" role="alert">${ic('alert', 'sm')}${m}</div>`;
    root.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { r.type = b.dataset.type; save(); render(); });
    root.querySelectorAll('[data-contact]').forEach(b => b.onclick = () => { r.contact = b.dataset.contact; save(); render(); });
    const t = root.querySelector('#rt'); if (t) t.oninput = () => { r.text = t.value; save(); root.querySelector('#rtc').textContent = t.value.length + ' caractères (20 minimum)'; };
    root.querySelector('#rPrev').onclick = () => { r.step--; save(); render(); };
    f.onsubmit = e => { e.preventDefault();
      if (r.step === 1 && !r.type) return er('Choisis le type de situation.');
      if (r.step === 2 && r.text.trim().length < 20) return er('Décris la situation en 20 caractères au moins.');
      if (r.step === 3) { r.zone = f.rz.value; r.city = f.rc.value.trim() || r.city; }
      if (r.step === 4) { if (f.rch) r.channel = f.rch.value;
        const code = 'XM-' + Math.random().toString(36).slice(2, 6).toUpperCase() + '-' + String(Math.floor(Math.random() * 90 + 10));
        S.reports.unshift({ code, type: r.type, status: 'Reçu', date: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) });
        S.report = DEFAULT().report; save(); return showCode(code); }
      r.step++; save(); render(); };
    function showCode(code) { root.querySelector('.view').innerHTML = `<div class="alert ok" role="status">${ic('check')}<span><b>Ton signalement est envoyé.</b><br>Une personne formée le lira sous 24 h.</span></div>
      <div class="card stack" style="justify-items:center;text-align:center"><span class="small muted">Ton code de suivi</span><div class="h-display" style="letter-spacing:.06em">${code}</div><button class="btn btn-soft btn-sm" id="cp">${ic('copy', 'sm')} Copier le code</button></div>
      <button class="btn btn-primary btn-block" data-go="sighub">Suivre mes signalements</button>`;
      root.querySelector('#cp').onclick = () => { try { navigator.clipboard.writeText(code); } catch (e) { /* presse-papiers indisponible */ } toast('Code copié.'); }; }
  } });

/* ---------- fil d'actualités ---------- */
const postCard = p => { const liked = !!S.liked[p.id]; const pv = S.votes[p.id];
  let poll = '';
  if (p.poll) { const total = p.poll.opts.reduce((a, o, i) => a + o[1] + (pv && pv.includes(i) ? 1 : 0), 0);
    poll = `<div class="poll" data-poll="${p.id}"><b class="small">${ic('chart', 'sm')} ${esc(p.poll.q)}</b><span class="xs muted">${p.poll.multi ? 'Plusieurs réponses' : 'Une seule réponse'} · ${p.poll.ends}</span>
      ${p.poll.opts.map((o, i) => { const c = o[1] + (pv && pv.includes(i) ? 1 : 0), pct = total ? Math.round(c * 100 / total) : 0;
        return pv ? `<div class="poll-opt ${pv.includes(i) ? 'mine' : ''}"><i class="bar" style="width:${pct}%"></i><span>${esc(o[0])}${pv.includes(i) ? ' ' + ic('check', 'sm') : ''}</span><span class="pct">${pct} %</span></div>`
          : `<button class="poll-opt" data-vote="${i}"><span>${esc(o[0])}</span></button>`; }).join('')}
      <span class="xs muted">${total} vote${total > 1 ? 's' : ''}${pv ? ' · <button class="btn-link xs" data-unvote style="min-height:0">Retirer mon vote</button>' : ''}</span></div>`; }
  return `<article class="post" data-post="${p.id}"><div class="post-head">${av(p.author)}<div class="grow"><b class="small">${esc(p.author)}</b><div class="xs muted">${esc(p.role)} · ${esc(p.ago)}</div></div><span class="badge ${p.tag === 'Sondage' ? 'violet' : ''}">${esc(p.tag)}</span></div>
    <div class="post-body">${esc(p.text)}</div>${p.img ? `<div class="post-img" style="background-image:url(${IMG[p.img] || p.img})" role="img" aria-label="Illustration de la publication"></div>` : ''}${poll}
    <div class="post-actions"><button data-like="${p.id}" aria-pressed="${liked}">${ic('heart', 'sm')} ${p.likes + (liked ? 1 : 0)}</button><button data-go="post" data-param="${p.id}">${ic('chat', 'sm')} ${p.comments + (S.comments[p.id] ? S.comments[p.id].length - (p.id === 3 ? 2 : 0) : 0)}</button><button data-share>${ic('share', 'sm')} Partager</button></div></article>`; };
const bindPosts = root => {
  root.querySelectorAll('[data-like]').forEach(b => b.onclick = () => { const id = b.dataset.like; S.liked[id] = !S.liked[id]; save(); render(); });
  root.querySelectorAll('[data-vote]').forEach(b => b.onclick = () => { const id = b.closest('[data-poll]').dataset.poll; S.votes[id] = [+b.dataset.vote]; save(); render(); toast('Merci, ton vote est enregistré.'); });
  root.querySelectorAll('[data-unvote]').forEach(b => b.onclick = () => { delete S.votes[b.closest('[data-poll]').dataset.poll]; save(); render(); });
  root.querySelectorAll('[data-share]').forEach(b => b.onclick = () => toast('Lien copié. Partage-le sur WhatsApp, Telegram ou Facebook.'));
};

def({ id: 'postpublication', module: 'feed', title: 'Créer une publication', route: '/postpublication', page: 'PostComposerPage', provider: 'postComposerProvider (Notifier<PostDraft>)', chrome: 'stack',

    <div class="compose">${av(S.user.name)}<div class="grow"><label class="vh" for="pt">Ta publication</label><textarea class="input" id="pt" rows="5" maxlength="3000" placeholder="Partage une pensée, une question, un témoignage…"></textarea></div></div>

def({ id: 'sondage', module: 'feed', title: 'Créer un sondage', route: '/postpublication/sondage', page: 'PollComposerPage', provider: 'pollComposerProvider', chrome: 'stack',
  tree: `PollComposerPage
└─ Scaffold
   ├─ AppBar(action « Publier »)
   └─ Form › ListView
      ├─ XmTextField(question, 5–200 car.)
      ├─ ReorderableListView(réponses 2–6)

      ├─ TextButton « Ajouter une réponse »
      ├─ XmTextArea(texte) + _ImagePicker
      ├─ DropdownMenu(durée)
      └─ SwitchListTile × 2 (choix multiple, résultats avant vote)`,
  api: [['POST', '/api/v1/posts', '{kind: poll, question, options[], multiple, duration_days, text?, photo?}']],
  ds: DS('XmTextField', 'ReorderableListView', 'SwitchListTile', 'XmPollCard (aperçu)'),
  warn: 'Même règles que le web (post-create.php) : 2 à 6 réponses distinctes, durée 1 j à 30 j ou sans fin, votes confidentiels.',
  render: () => `${appbar('Nouveau sondage', '<button class="btn btn-primary btn-sm" form="qf" style="margin-right:8px">Publier</button>')}<div class="view"><form class="stack-lg" id="qf" novalidate>
    <div class="field"><label for="qq">Question</label><input class="input" id="qq" maxlength="200" placeholder="Ex. : quel thème pour le prochain atelier ?"></div>
    <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:6px">Réponses (2 à 6)</legend><div class="stack" style="gap:8px" id="qo">${[1, 2].map(i => `<div class="row"><input class="input" placeholder="Réponse ${i}" aria-label="Réponse ${i}"><button type="button" class="icon-btn" data-rm aria-label="Retirer">${ic('x', 'sm')}</button></div>`).join('')}</div>
    <button type="button" class="btn btn-soft btn-sm" id="qadd" style="justify-self:start">${ic('plus', 'sm')} Ajouter une réponse</button></fieldset>
    <div class="field"><label for="qt">Texte d’accompagnement (facultatif)</label><textarea class="input" id="qt" rows="3"></textarea></div>
    <div class="field"><label for="qd">Durée</label><select class="input" id="qd"><option>1 jour</option><option>3 jours</option><option selected>1 semaine</option><option>2 semaines</option><option>Sans date de fin</option></select></div>
    <div><label class="switch"><span><b>Plusieurs réponses</b></span><input type="checkbox" id="qm"></label><label class="switch"><span><b>Résultats visibles avant le vote</b></span><input type="checkbox" id="qr"></label></div>
    <div id="qErr"></div><p class="xs muted" style="margin:0">${ic('lock', 'sm')} Les votes sont confidentiels : seuls les totaux sont affichés.</p></form></div>`,
  mount: root => { const box = root.querySelector('#qo'), f = root.querySelector('#qf');
    const sync = () => { const rows = box.children; [...rows].forEach((r, i) => { r.querySelector('input').placeholder = 'Réponse ' + (i + 1); r.querySelector('[data-rm]').disabled = rows.length <= 2; }); root.querySelector('#qadd').disabled = rows.length >= 6; };
    root.querySelector('#qadd').onclick = () => { const r = box.lastElementChild.cloneNode(true); r.querySelector('input').value = ''; box.appendChild(r); sync(); r.querySelector('input').focus(); };
    box.onclick = e => { const b = e.target.closest('[data-rm]'); if (b && box.children.length > 2) { b.parentElement.remove(); sync(); } };
    sync();
    f.onsubmit = e => { e.preventDefault(); const q = f.qq.value.trim(), opts = [...box.querySelectorAll('input')].map(i => i.value.trim()).filter(Boolean);
      const er = m => root.querySelector('#qErr').innerHTML = `<div class="err" role="alert">${ic('alert', 'sm')}${m}</div>`;
      if (q.length < 5) return er('Écris une question d’au moins 5 caractères.');
      if (opts.length < 2) return er('Propose au moins 2 réponses.');
      if (new Set(opts.map(o => o.toLowerCase())).size !== opts.length) return er('Deux réponses sont identiques.');
      S.posts.unshift({ id: Date.now(), author: S.user.name, role: isPair() ? 'Pair éducateur·rice' : 'Membre', ago: 'à l’instant', tag: 'Sondage', text: f.qt.value.trim(), likes: 0, comments: 0,

      S.feedFilter = 'Tout'; save(); go('fil', { replace: true }); toast('Ton sondage est en ligne.'); };
  } });

  tree: `ChatPage(id)

/* =====================================================================
   Navigation (équivalent go_router)
   ===================================================================== */
const app = document.getElementById('app');
const byId = id => SCREENS.find(s => s.id === id || (s.alias || []).includes(id));
let cur = { id: 'splash', param: '' };
const current = () => byId(cur.id);
function parseHash() { const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')); const [id, param] = h.split('/'); return { id: id || '', param: param || '' }; }
function go(id, o = {}) {
  const s = byId(id); if (!s) return;
  if (!o.replace && !o.fromHash && cur.id && cur.id !== s.id) stack.push(cur);
  cur = { id: s.id, param: o.param || '' };
  if (s.module !== 'auth' && !S.auth) { S.auth = true; S.seen = true; save(); } // saut direct depuis l'index : session de démo
  const hash = '#/' + (o.fromHash && o.rawId ? o.rawId : s.id) + (cur.param ? '/' + cur.param : '');
  if (location.hash !== hash) history.replaceState(null, '', hash);
  render(true);
}
function back() { const p = stack.pop(); if (p) { cur = p; history.replaceState(null, '', '#/' + p.id + (p.param ? '/' + p.param : '')); render(true); } else go(S.auth ? 'dashboard' : 'login', { replace: true }); }
let toastT = null;
function toast(msg) { const old = app.querySelector('.toast'); if (old) old.remove(); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.innerHTML = ic('check', 'sm') + '<span>' + esc(msg) + '</span>'; app.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3200); }

const TABS = [['dashboard', 'home', 'Accueil'], ['fil', 'feed', 'Fil'], ['sos', 'sos', 'SOS'], ['message', 'chat', 'Messages'], ['profil', 'user', 'Profil']];
function render(scrollTop) {
  const s = current(); if (!s) return;
  const prevScroll = app.querySelector('.view') ? app.querySelector('.view').scrollTop : 0;
  app.dataset.theme = S.theme;
  app.className = 'app' + (s.chrome === 'tabs' ? ' has-tabs' : '') + (s.chrome === 'stack' || ['otp', 'forgot', 'reset', 'signup'].includes(s.id) ? ' has-appbar' : '');
  let html = s.render(cur.param);
  if (s.id !== 'espaces' && s.module !== 'auth') XmSpace.setSpace('membre');
  const extra = isPair() && isAdmin() ? `<button data-xmsp-open data-xmsp-cur="membre" class="tab-space-btn">${ic('users')}<span>Espaces</span></button>` : isPair() ? `<a class="tab-space" href="espace-pair.html#/accueil" data-xmsp-go="pair">${ic('shield')}<span>Espace pair</span></a>` : isAdmin() ? `<a class="tab-space" href="admin-mobile.html#/tableau" data-xmsp-go="admin">${ic('chart')}<span>Admin</span></a>` : '';
  if (s.chrome === 'tabs') html += `<nav class="tabbar" aria-label="Navigation principale" ${extra ? 'style="grid-template-columns:repeat(6,1fr)"' : ''}>${TABS.map(t => `<button data-go="${t[0]}" class="${t[0] === 'sos' ? 'sos-tab' : ''}" ${s.tab === t[0] ? 'aria-current="page"' : ''}>${t[0] === 'sos' ? '<span class="b">SOS</span>' : ic(t[1])}<span>${t[0] === 'sos' ? 'Alerte' : t[2]}</span></button>`).join('')}${extra}</nav>`;
  app.innerHTML = html;
  if (s.chrome === 'tabs' && isMulti() && s.id !== 'profil') { const v = app.querySelector('.view'); if (v) v.insertAdjacentHTML('afterbegin', `<div class="xmsp-strip">${XmSpace.pill('membre')}</div>`); }
  app.querySelectorAll('[data-back]').forEach(b => b.onclick = back);
  app.querySelectorAll('[data-go]').forEach(b => { if (!b.onclick) b.onclick = e => { e.preventDefault(); go(b.dataset.go, { param: b.dataset.param || '' }); }; });
  app.querySelectorAll('[data-toggle-pw]').forEach(b => b.onclick = () => { const i = app.querySelector('#' + b.dataset.togglePw); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.innerHTML = ic(show ? 'eyeOff' : 'eye'); b.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe'); });
  if (s.mount) s.mount(app, cur.param);
  app.querySelectorAll('.tab-space-btn').forEach(b => { b.style.cssText = 'border:0;background:transparent;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--app-primary-subtle-text);padding:6px 0;min-height:48px'; });
  const v = app.querySelector('.view'); if (v && !scrollTop && !['chat', 'assistant'].includes(s.id)) v.scrollTop = prevScroll;
  document.getElementById('screen').style.setProperty('--sb-color', ['profil', 'splash'].includes(s.id) ? '#fff' : '');
  updatePanel(s); if (window.XmNav) XmNav.mark();
}

function updatePanel(s) {
  const n = SCREENS.indexOf(s) + 1, mod = MODULES.find(m => m[0] === s.module);
  document.getElementById('panel').innerHTML = `<header><div class="state">Écran ${String(n).padStart(2, '0')} sur ${SCREENS.length} · module <code>${s.module}</code> (${mod[1]})</div><h2 style="margin-top:4px">${esc(s.title)}</h2><span class="route">${esc(s.route)}</span></header>
    <section><h3>Flutter</h3><dl><dt>Route</dt><dd>GoRoute('${esc(s.route.split('?')[0])}')</dd><dt>Page</dt><dd>${esc(s.page)}</dd><dt>Provider</dt><dd>${esc(s.provider)}</dd><dt>Dossier</dt><dd>lib/features/${s.module}/presentation/</dd>${s.source ? `<dt>Source</dt><dd>${esc(s.source)}</dd>` : ''}</dl></section>
    <section><h3>Arbre de widgets</h3><pre>${esc(s.tree)}</pre></section>
    <section><h3>Appels API</h3>${s.api.length ? `<ul class="api">${s.api.map(a => `<li><span class="verb ${a[0]}">${a[0]}</span><span>${esc(a[1])}${a[2] ? `<br><span style="color:var(--pg-muted)">${esc(a[2])}</span>` : ''}</span></li>`).join('')}</ul>` : '<p class="state">Aucun appel réseau : écran local.</p>'}</section>
    <section><h3>Composants du design system</h3><div class="ds">${s.ds.map(d => `<span>${esc(d)}</span>`).join('')}</div></section>
    <section><h3>Point de vigilance</h3><p class="warn">${esc(s.warn)}</p></section>
    <section><h3>État simulé</h3><p class="state">onboardingProvider.seen = <code>${S.seen}</code> · session = <code>${S.auth}</code> · rôles = <code>${XmSpace.roles().join(' + ')}</code> · espace = <code>${XmSpace.space()}</code>${s.id === 'otp' ? ` · purpose = <code>${S.otp.purpose}</code>` : ''}<br>Lien profond : <code>index.html#/${s.id}</code></p></section>`;
}
function syncTop() {
  document.querySelectorAll('[data-model]').forEach(b => b.setAttribute('aria-pressed', b.dataset.model === S.model));
  document.querySelectorAll('[data-acct]').forEach(b => b.setAttribute('aria-pressed', b.dataset.acct === acctOf()));
  document.getElementById('device').dataset.model = S.model;
  document.getElementById('caption').innerHTML = S.model === 'pixel8' ? '<b>Pixel 8</b> · 412 × 880 · Android 15 · Arial → Roboto' : '<b>iPhone 14</b> · 390 × 844 · iOS 18 · zones sûres 47 / 34';
  fit();
}
document.querySelectorAll('.topbar [data-model]').forEach(b => b.onclick = () => { S.model = b.dataset.model; save(); syncTop(); render(); });
document.querySelectorAll('.topbar [data-acct]').forEach(b => b.onclick = () => { XmSpace.setRoles(ACCT[b.dataset.acct]); XmSpace.setSpace('membre'); save(); syncTop(); render(); });
app.addEventListener('click', e => { if (e.target.closest('[data-askpair]')) toast('Demande envoyée. L’équipe la valide depuis son tableau de bord ou l’appli, sous 48 h.'); });
document.getElementById('reset').onclick = () => { try { localStorage.removeItem(KEY); } catch (e) { /* indisponible */ } XmSpace.reset(); S = DEFAULT(); stack = []; slide = 0; syncTop(); go('splash', { replace: true }); };

/* Mise à l'échelle de l'appareil dans la scène */
function fit() {
  const wrap = document.getElementById('deviceWrap'), dev = document.getElementById('device'), stage = document.querySelector('.stage');
  wrap.style.transform = 'none'; wrap.style.height = ''; wrap.style.width = '';
  const w = dev.offsetWidth, h = dev.offsetHeight, small = window.innerWidth <= 820;
  const availH = small ? Infinity : stage.clientHeight - 60, availW = stage.clientWidth - 24;
  const k = Math.min(1, availW / w, availH / h);
  wrap.style.transform = `scale(${k})`; wrap.style.width = w + 'px'; wrap.style.height = (h * k) + 'px';
}
window.addEventListener('resize', fit);
const tick = () => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); };
tick(); setInterval(tick, 15000);

window.addEventListener('hashchange', () => { const h = parseHash(); if (h.id && byId(h.id) && (byId(h.id).id !== cur.id || h.param !== cur.param)) { stack = []; go(h.id, { param: h.param, fromHash: true, rawId: h.id }); } });
syncTop();
const h0 = parseHash();
if (h0.id && byId(h0.id)) go(h0.id, { param: h0.param, fromHash: true, rawId: h0.id });
else go(S.auth ? 'dashboard' : (S.seen ? 'login' : 'splash'), { replace: true }); // redirection go_router selon onboardingProvider
})();
</script>
