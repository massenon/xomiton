/* =====================================================================
   Jetons : copie du design system Xomiton (design-system/tokens/tokens.css)
   ===================================================================== */
:root {
  --xm-blue-50:#EBEFFA; --xm-blue-100:#D7DEF5; --xm-blue-200:#AFBEEC; --xm-blue-500:#0433C3; --xm-blue-600:#032BA6; --xm-blue-700:#032488; --xm-blue-800:#021C6B; --xm-blue-900:#02134A;
  --xm-red-50:#FDECEC; --xm-red-500:#E30E0E; --xm-red-600:#C10C0C; --xm-red-700:#9F0A0A;
  --xm-neutral-0:#FFFFFF; --xm-neutral-25:#FBF7FA; --xm-neutral-100:#F3EDF4; --xm-neutral-200:#E4DCE6; --xm-neutral-400:#8E88A0; --xm-neutral-600:#5B5670; --xm-neutral-900:#1B1630;
  --xm-green-700:#0B7A4B; --xm-amber-500:#F0A800; --xm-sky-700:#1864AB; --xm-violet-700:#6F2C91; --xm-rose-600:#C2255C;
  --xm-font-heading:"Montserrat","Segoe UI",Arial,sans-serif;
  --xm-font-body:Arial,"Liberation Sans",Helvetica,sans-serif;
  --xm-radius-md:8px; --xm-radius-lg:16px; --xm-radius-pill:999px;
  --xm-ease-out:cubic-bezier(.2,.8,.2,1);
  --xm-target-min:44px;

  /* Page du simulateur (hors appareil) */
  --pg-bg: var(--xm-neutral-100);
  --pg-surface: var(--xm-neutral-0);
  --pg-border: var(--xm-neutral-200);
  --pg-text: var(--xm-neutral-900);
  --pg-muted: var(--xm-neutral-600);
  --pg-accent: var(--xm-blue-500);
  --pg-accent-subtle: var(--xm-blue-50);
  --pg-code-bg: var(--xm-blue-900);
  --pg-code-text: #DCE3FA;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-page-theme="light"]) {
    --pg-bg:#0B0D1A; --pg-surface:#151829; --pg-border:#2A2E48; --pg-text:#EDEAF7; --pg-muted:#A9A5C0; --pg-accent:#7C97FF; --pg-accent-subtle:#1B2347; --pg-code-bg:#070917;
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--pg-bg); color: var(--pg-text); font: 15px/1.5 var(--xm-font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--xm-font-heading); line-height: 1.2; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pg-accent); outline-offset: 2px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 50; background: var(--pg-accent); color: #fff; padding: 10px 14px; border-radius: 8px; }
.skip:focus { top: 8px; }

/* ---------- Mise en page générale ---------- */
.sim { display: grid; grid-template-columns: 272px minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--pg-surface); border-bottom: 1px solid var(--pg-border); flex-wrap: wrap; }
.topbar .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.topbar .brand img { height: 28px; width: auto; }
.topbar h1 { font-size: 16px; font-weight: 700; }
.topbar .sub { color: var(--pg-muted); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--pg-border); border-radius: var(--xm-radius-pill); padding: 3px; background: var(--pg-bg); }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: var(--xm-radius-pill); font-size: 13px; font-weight: 700; color: var(--pg-muted); min-height: 32px; }
.seg button[aria-pressed="true"] { background: var(--pg-surface); color: var(--pg-accent); box-shadow: 0 1px 3px rgb(27 22 48 / .14); }
.btn-ghost { border: 1px solid var(--pg-border); background: var(--pg-surface); border-radius: var(--xm-radius-pill); padding: 6px 14px; font-size: 13px; font-weight: 700; min-height: 34px; }

/* Rail gauche : index des écrans */
.rail { overflow-y: auto; background: var(--pg-surface); border-right: 1px solid var(--pg-border); padding: 12px 10px 24px; }
.rail-search { width: 100%; border: 1px solid var(--pg-border); border-radius: var(--xm-radius-md); padding: 8px 10px; background: var(--pg-bg); margin-bottom: 8px; min-height: 38px; }
.rail-group { margin-top: 14px; }
.rail-group h2 { font-size: 13px; font-weight: 700; padding: 0 8px 4px; display: flex; justify-content: space-between; align-items: baseline; }
.rail-group h2 code { font: 12px/1 var(--xm-font-body); color: var(--pg-muted); }
.rail a { display: grid; grid-template-columns: 26px 1fr; gap: 6px; align-items: baseline; padding: 7px 8px; border-radius: var(--xm-radius-md); color: var(--pg-text); text-decoration: none; font-size: 14px; }
.rail a .n { color: var(--pg-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.rail a .r { grid-column: 2; color: var(--pg-muted); font-size: 12px; }
.rail a:hover { background: var(--pg-bg); }
.rail a[aria-current="page"] { background: var(--pg-accent-subtle); color: var(--pg-accent); font-weight: 700; }
.rail a[aria-current="page"] .n, .rail a[aria-current="page"] .r { color: var(--pg-accent); }

/* Scène centrale */
.stage { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding: 16px; min-height: 0; }
.stage-caption { margin-top: 10px; font-size: 13px; color: var(--pg-muted); text-align: center; }
.stage-caption b { color: var(--pg-text); }
.device-wrap { transform-origin: top center; }

/* ---------- Châssis ---------- */
.device { --w: 390px; --h: 844px; --bezel: 12px; --r: 55px; --sr: 44px; --safe-top: 47px; --safe-bottom: 34px; position: relative; width: calc(var(--w) + var(--bezel) * 2); height: calc(var(--h) + var(--bezel) * 2); padding: var(--bezel); border-radius: var(--r); background: #1d1b26; box-shadow: 0 0 0 2px #4a4757 inset, 0 30px 60px rgb(27 22 48 / .28), 0 8px 18px rgb(27 22 48 / .18); }
.device::before, .device::after { content: ""; position: absolute; background: #2b2836; border-radius: 3px; }
.device::before { left: -3px; top: 160px; width: 3px; height: 64px; box-shadow: 0 84px 0 #2b2836; }
.device::after { right: -3px; top: 220px; width: 3px; height: 96px; }
.device[data-model="pixel8"] { --w: 412px; --h: 880px; --bezel: 10px; --r: 44px; --sr: 34px; --safe-top: 32px; --safe-bottom: 24px; background: #23262b; box-shadow: 0 0 0 2px #50545b inset, 0 30px 60px rgb(27 22 48 / .28), 0 8px 18px rgb(27 22 48 / .18); }
.device[data-model="pixel8"]::before { left: auto; right: -3px; top: 150px; height: 48px; box-shadow: 0 70px 0 0 #2b2836, 0 90px 0 0 #2b2836; }
.device[data-model="pixel8"]::after { display: none; }
.screen { --app-bg: var(--xm-neutral-25); --app-text: var(--xm-neutral-900); position: relative; width: var(--w); height: var(--h); border-radius: var(--sr); overflow: hidden; background: var(--app-bg); isolation: isolate; }
.notch { position: absolute; z-index: 30; left: 50%; top: 0; transform: translateX(-50%); width: 162px; height: 33px; background: #000; border-radius: 0 0 20px 20px; }
.notch::after { content: ""; position: absolute; right: 30px; top: 11px; width: 10px; height: 10px; border-radius: 50%; background: #16151d; box-shadow: inset 0 0 0 2px #24222e; }
.device[data-model="pixel8"] .notch { width: 14px; height: 14px; top: 10px; border-radius: 50%; }
.device[data-model="pixel8"] .notch::after { display: none; }
.statusbar { position: absolute; z-index: 25; left: 0; right: 0; top: 0; height: var(--safe-top); display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 34px; font: 600 15px/1 -apple-system, "SF Pro Text", var(--xm-font-body); color: var(--sb-color, var(--app-text)); pointer-events: none; }
.statusbar .icons { display: flex; gap: 6px; align-items: center; }
.statusbar svg { width: 17px; height: 12px; fill: currentColor; }
.device[data-model="pixel8"] .statusbar { padding: 0 18px; font: 500 14px/1 Roboto, var(--xm-font-body); }
.homebar { position: absolute; z-index: 25; left: 50%; bottom: 8px; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--app-text); opacity: .85; pointer-events: none; }
.device[data-model="pixel8"] .homebar { width: 108px; height: 4px; bottom: 7px; }

/* ---------- Application (dans l'appareil) ---------- */
.app {
  --app-bg: var(--xm-neutral-25); --app-surface: var(--xm-neutral-0); --app-muted-surface: var(--xm-neutral-100); --app-border: var(--xm-neutral-200);
  --app-text: var(--xm-neutral-900); --app-muted: var(--xm-neutral-600); --app-primary: var(--xm-blue-500); --app-primary-hover: var(--xm-blue-600); --app-on-primary: #fff;
  --app-primary-subtle: var(--xm-blue-50); --app-primary-subtle-text: var(--xm-blue-800); --app-danger: var(--xm-red-500); --app-danger-subtle: var(--xm-red-50);
  --app-success: var(--xm-green-700); --app-warning: var(--xm-amber-500); --app-info: var(--xm-sky-700); --app-violet: var(--xm-violet-700);
  position: absolute; inset: 0; background: var(--app-bg); color: var(--app-text); font: 16px/1.5 var(--xm-font-body); display: flex; flex-direction: column;
}
.app[data-theme="dark"] {
  --app-bg: #0E1020; --app-surface: #171A2E; --app-muted-surface: #1F2340; --app-border: #2A2E48; --app-text: #EDEAF7; --app-muted: #A9A5C0;
  --app-primary: #7C97FF; --app-primary-hover: #9DB1FF; --app-on-primary: #0E1020; --app-primary-subtle: #1B2347; --app-primary-subtle-text: #9DB1FF;
  --app-danger: #FF6B6B; --app-danger-subtle: #3A1519; --app-success: #4DD39D; --app-warning: #FFC94D; --app-info: #7AB2FF; --app-violet: #C79BE6;
}
.screen:has(.app[data-theme="dark"]) { --app-bg: #0E1020; --app-text: #EDEAF7; }
.view { flex: 1; overflow-y: auto; overflow-x: hidden; padding: calc(var(--safe-top) + 4px) 16px calc(var(--safe-bottom) + 20px); scrollbar-width: none; overscroll-behavior: contain; }
.view::-webkit-scrollbar { display: none; }
.view.stack, .view.stack-lg { grid-auto-rows: max-content; align-content: start; } /* les cartes overflow:hidden ne doivent pas être compressées */
.app.has-tabs .view { padding-bottom: calc(var(--safe-bottom) + 86px); }
.app.has-appbar .view { padding-top: calc(var(--safe-top) + 60px); }
.appbar { position: absolute; z-index: 20; left: 0; right: 0; top: 0; padding: var(--safe-top) 8px 0; height: calc(var(--safe-top) + 56px); display: flex; align-items: center; gap: 4px; background: color-mix(in srgb, var(--app-bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--app-border); }
.appbar h2 { font-size: 18px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 50%; display: inline-grid; place-items: center; color: var(--app-text); position: relative; flex-shrink: 0; }
.icon-btn:hover { background: var(--app-muted-surface); }
.icon-btn .dot { position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--app-danger); border: 2px solid var(--app-bg); }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.ico.sm { width: 18px; height: 18px; }
.ico.lg { width: 28px; height: 28px; }

/* Barre d'onglets : 5 entrées, SOS au centre (MASTER §6) */
.tabbar { position: absolute; z-index: 20; left: 0; right: 0; bottom: 0; padding: 6px 6px calc(var(--safe-bottom) + 2px); display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; background: color-mix(in srgb, var(--app-surface) 94%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--app-border); }
.tabbar button { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--app-muted); padding: 6px 0; min-height: 48px; }
.tabbar button[aria-current="page"] { color: var(--app-primary); font-weight: 700; }
.tabbar .sos-tab { transform: translateY(-14px); }
.tabbar .sos-tab span.b { width: 60px; height: 60px; border-radius: 50%; background: var(--app-danger); color: #fff; display: grid; place-items: center; font: 800 16px var(--xm-font-heading); box-shadow: 0 6px 16px rgb(227 14 14 / .35); border: 4px solid var(--app-surface); }
.tabbar .sos-tab { color: var(--app-danger); font-weight: 700; }

/* Composants de l'application */
.h-display { font: 800 28px/1.15 var(--xm-font-heading); letter-spacing: -.01em; }
.h1 { font: 800 24px/1.2 var(--xm-font-heading); }
.h2 { font: 700 19px/1.25 var(--xm-font-heading); }
.h3 { font: 700 16px/1.3 var(--xm-font-heading); }
.muted { color: var(--app-muted); }
.small { font-size: 14px; }
.xs { font-size: 13px; }
.stack { display: grid; gap: 12px; }
.stack-lg { display: grid; gap: 20px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.card { background: var(--app-surface); border: 1px solid var(--app-border); border-radius: var(--xm-radius-lg); padding: 16px; }
.card.flat { border: 0; background: var(--app-muted-surface); }
.card.tight { padding: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: var(--xm-radius-md); border: 1px solid transparent; font: 700 15px var(--xm-font-body); text-decoration: none; transition: background-color .12s; }
.btn-primary { background: var(--app-primary); color: var(--app-on-primary); }
.btn-primary:hover { background: var(--app-primary-hover); }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; }
.btn-soft { background: var(--app-primary-subtle); color: var(--app-primary-subtle-text); }
.btn-outline { background: transparent; border-color: var(--app-border); color: var(--app-text); }
.btn-danger { background: var(--app-danger); color: #fff; }
.btn-link { background: none; border: 0; color: var(--app-primary); font-weight: 700; padding: 0; min-height: 44px; }
.btn-block { width: 100%; }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.field { display: grid; gap: 6px; }
.field label, .label { font-size: 14px; font-weight: 700; }
.input { width: 100%; min-height: 48px; border: 1px solid var(--app-border); border-radius: var(--xm-radius-md); background: var(--app-surface); padding: 10px 14px; color: var(--app-text); }
textarea.input { min-height: 96px; resize: none; line-height: 1.45; }
.input:focus { outline: 3px solid color-mix(in srgb, var(--app-primary) 35%, transparent); border-color: var(--app-primary); }
.input[aria-invalid="true"] { border-color: var(--app-danger); }
.err { color: var(--app-danger); font-size: 13px; display: flex; gap: 6px; align-items: flex-start; }
.hint { color: var(--app-muted); font-size: 13px; }
.pw { position: relative; }
.pw .input { padding-right: 52px; }
.pw .icon-btn { position: absolute; right: 2px; top: 2px; }
.check { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--app-primary); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--app-border); min-height: 56px; }
.switch:last-child { border-bottom: 0; }
.switch input { appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--app-border); position: relative; flex-shrink: 0; transition: background-color .2s; cursor: pointer; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .2s var(--xm-ease-out); }
.switch input:checked { background: var(--app-primary); }
.switch input:checked::after { transform: translateX(18px); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { border: 1px solid var(--app-border); background: var(--app-surface); border-radius: var(--xm-radius-pill); padding: 0 14px; min-height: 36px; font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--app-primary); border-color: var(--app-primary); color: var(--app-on-primary); font-weight: 700; }
.badge { display: inline-flex; align-items: center; gap: 4px; border-radius: var(--xm-radius-pill); padding: 2px 10px; font-size: 12px; font-weight: 700; background: var(--app-primary-subtle); color: var(--app-primary-subtle-text); }
.badge.ok { background: color-mix(in srgb, var(--app-success) 14%, transparent); color: var(--app-success); }
.badge.warn { background: color-mix(in srgb, var(--app-warning) 22%, transparent); color: color-mix(in srgb, var(--app-warning) 45%, var(--app-text)); }
.badge.danger { background: var(--app-danger-subtle); color: var(--app-danger); }
.badge.violet { background: color-mix(in srgb, var(--app-violet) 14%, transparent); color: var(--app-violet); }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--xm-font-heading); color: #fff; flex-shrink: 0; }
.avatar.lg { width: 84px; height: 84px; font-size: 28px; border: 4px solid var(--app-surface); }
.list { display: grid; }
.list > * { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--app-border); min-height: 56px; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; color: inherit; text-decoration: none; }
.list > *:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alert { border-radius: var(--xm-radius-md); padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; background: var(--app-primary-subtle); color: var(--app-primary-subtle-text); }
.alert.ok { background: color-mix(in srgb, var(--app-success) 12%, transparent); color: var(--app-success); }
.alert.danger { background: var(--app-danger-subtle); color: var(--app-danger); }
.progress { height: 8px; border-radius: 4px; background: var(--app-muted-surface); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--app-primary); border-radius: inherit; transition: width .3s var(--xm-ease-out); }
.tile { display: grid; gap: 8px; align-content: start; padding: 14px; border-radius: var(--xm-radius-lg); background: var(--app-surface); border: 1px solid var(--app-border); text-align: left; min-height: 96px; color: inherit; }
.tile .ico { color: var(--app-primary); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.thumb { border-radius: var(--xm-radius-md); background: var(--app-muted-surface) center/cover no-repeat; }
.toast { position: absolute; z-index: 40; left: 16px; right: 16px; bottom: calc(var(--safe-bottom) + 92px); background: var(--xm-neutral-900); color: #fff; border-radius: var(--xm-radius-md); padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; box-shadow: 0 10px 30px rgb(0 0 0 / .25); animation: toast-in .25s var(--xm-ease-out); }
.app[data-theme="dark"] .toast { background: #EDEAF7; color: #0E1020; }
@keyframes toast-in { from { transform: translateY(12px); opacity: 0; } }
.stepper { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: 6px; }
.stepper i { height: 5px; border-radius: 3px; background: var(--app-border); }
.stepper i.on { background: var(--app-primary); }


/* =====================================================================
   Maquettes « Espace pair » et « Admin mobile » : compléments au simulateur
   ===================================================================== */
:root[data-page-theme="dark"] { --pg-bg:#0B0D1A; --pg-surface:#151829; --pg-border:#2A2E48; --pg-text:#EDEAF7; --pg-muted:#A9A5C0; --pg-accent:#7C97FF; --pg-accent-subtle:#1B2347; color-scheme: dark; }
.sim { grid-template-columns: 268px minmax(0, 1fr); }
.topbar .brand .logo { height: 28px; width: auto; }
.topbar .ctl { display: flex; align-items: center; gap: 8px; }
.topbar .ctl > span { font-size: 13px; color: var(--pg-muted); }
.seg button { min-height: 36px; }
.rail a { grid-template-columns: 1fr; }
.rail h2 { margin: 0; }
.rail .note { margin: 18px 8px 0; font-size: 13px; color: var(--pg-muted); }
.rail-select { display: none; }
.rail a { min-height: 40px; align-items: center; }

/* Jetons applicatifs complémentaires (contrastes AA) */
.app { --app-danger-text: var(--xm-red-700); --app-on-danger: #fff; --app-warn-bg: color-mix(in srgb, var(--xm-amber-500) 22%, var(--app-bg)); --app-warn-text: #5A3D00; --app-ok-bg: color-mix(in srgb, var(--app-success) 12%, var(--app-bg)); }
.app[data-theme="dark"] { --app-danger-text: #FF9A9A; --app-on-danger: #2A0C0C; --app-warn-bg: #3A2D0E; --app-warn-text: #FFD98A; --app-ok-bg: #12332A; }
.app * { scrollbar-width: none; }
.app :focus-visible { outline: 3px solid var(--app-primary); outline-offset: 2px; }
.app [tabindex="-1"]:focus { outline: none; }
.err { color: var(--app-danger-text); }
.badge.danger { background: var(--app-danger-subtle); color: var(--app-danger-text); }
.badge.warn { background: var(--app-warn-bg); color: var(--app-warn-text); }
.badge.ok { background: var(--app-ok-bg); color: var(--app-success); }
.badge.mute { background: var(--app-muted-surface); color: var(--app-muted); }
.badge { min-height: 24px; }
.btn-danger { background: var(--app-primary); color: var(--app-on-primary); }

/* Cadre de l'application : en-tête, bandeau, panneau, onglets */
.hdr { flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: var(--safe-top) 8px 6px; min-height: calc(var(--safe-top) + 54px); background: var(--app-bg); border-bottom: 1px solid var(--app-border); }
.hdr .t { flex: 1; min-width: 0; margin: 0 0 0 4px; font: 700 18px/1.2 var(--xm-font-heading); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr .t small { display: block; font: 400 12px/1.2 var(--xm-font-body); color: var(--app-muted); margin-top: 2px; }
.netchip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: var(--xm-radius-pill); border: 1px solid var(--app-border); background: var(--app-surface); color: var(--app-text); font: 700 13px var(--xm-font-body); flex-shrink: 0; }
.netchip.off { background: var(--app-warn-bg); color: var(--app-warn-text); border-color: transparent; }
.netchip .ico { width: 18px; height: 18px; }
.nb { flex-shrink: 0; display: flex; gap: 10px; align-items: flex-start; padding: 10px 16px; background: var(--app-warn-bg); color: var(--app-warn-text); font-size: 13px; line-height: 1.4; border-bottom: 1px solid var(--app-border); }
.pane { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 16px 16px 28px; display: grid; gap: 16px; align-content: start; grid-auto-rows: max-content; }
.tb { flex-shrink: 0; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; padding: 6px 4px calc(var(--safe-bottom) + 2px); background: var(--app-surface); border-top: 1px solid var(--app-border); }
.tb a { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 56px; padding: 4px 0; font-size: 12px; color: var(--app-muted); text-decoration: none; border-radius: var(--xm-radius-md); position: relative; }
.tb a[aria-current="page"] { color: var(--app-primary); font-weight: 700; }
.tb a[aria-current="page"]::before { content: ""; position: absolute; top: -7px; width: 28px; height: 3px; border-radius: 2px; background: var(--app-primary); }
.tb a .cnt { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--app-primary); color: var(--app-on-primary); font: 700 11px/20px var(--xm-font-body); text-align: center; }
.tb a.sos { color: var(--app-danger-text); font-weight: 700; transform: translateY(-14px); min-height: 64px; }
.tb a.sos .b { width: 56px; height: 56px; border-radius: 50%; background: var(--app-danger); color: var(--app-on-danger); display: grid; place-items: center; font: 800 16px var(--xm-font-heading); border: 4px solid var(--app-surface); box-shadow: 0 6px 16px rgb(227 14 14 / .3); }
.tb a.sos[aria-current="page"]::before { display: none; }
.live { position: absolute; z-index: 40; left: 16px; right: 16px; bottom: calc(var(--safe-bottom) + 86px); pointer-events: none; }
.live .toast { position: static; animation: toast-in .25s var(--xm-ease-out); pointer-events: auto; }
.scrim { position: absolute; inset: 0; z-index: 35; background: rgb(10 12 28 / .6); animation: fade-in .2s; }
.sheet { position: absolute; z-index: 36; left: 0; right: 0; bottom: 0; max-height: 90%; overflow-y: auto; background: var(--app-surface); color: var(--app-text); border-radius: 20px 20px 0 0; padding: 12px 16px calc(var(--safe-bottom) + 14px); display: grid; gap: 14px; align-content: start; box-shadow: 0 -10px 30px rgb(0 0 0 / .25); animation: sheet-in .28s var(--xm-ease-out); }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--app-border); justify-self: center; }
.sheet h2 { font: 700 19px/1.25 var(--xm-font-heading); margin: 0; }
@keyframes sheet-in { from { transform: translateY(40px); opacity: 0; } }
@keyframes fade-in { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* Blocs communs */
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-h h2 { font: 700 17px/1.3 var(--xm-font-heading); margin: 0; }
.sec-h .n { font-size: 13px; color: var(--app-muted); }
.hello { display: grid; gap: 6px; }
.hello h2 { font: 800 24px/1.2 var(--xm-font-heading); margin: 0; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; padding: 0; list-style: none; }
.kpis li { background: var(--app-surface); border: 1px solid var(--app-border); border-radius: var(--xm-radius-lg); padding: 12px 14px; display: grid; gap: 2px; }
.kpis .v { font: 800 30px/1.1 var(--xm-font-heading); color: var(--app-primary); font-variant-numeric: tabular-nums; }
.kpis .l { font-size: 13px; color: var(--app-muted); }
.kpis li.hot { border-color: var(--app-danger); }
.link-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 14px; background: var(--app-surface); border: 1px solid var(--app-border); border-radius: var(--xm-radius-lg); color: inherit; text-decoration: none; text-align: left; }
.link-row .grow { flex: 1; min-width: 0; }
.link-row .ico:first-child { color: var(--app-primary); }
.stack-s { display: grid; gap: 8px; }
.shortcuts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.shortcuts .tile { min-height: 84px; }
.shortcuts .tile b { font-size: 14px; }
.pill-duty { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; min-height: 24px; border-radius: var(--xm-radius-pill); background: var(--app-primary); color: var(--app-on-primary); font: 700 12px var(--xm-font-body); }
.pill-duty::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.acard { background: var(--app-surface); border: 1px solid var(--app-border); border-radius: var(--xm-radius-lg); padding: 14px; display: grid; gap: 10px; }
.acard.sos { border-left: 4px solid var(--app-danger); }
.acard .top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.acard h3 { font: 700 16px/1.3 var(--xm-font-heading); margin: 0; }
.acard .meta { font-size: 13px; color: var(--app-muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.acard .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.acard .acts .btn { flex: 1 1 140px; }
.dl { display: grid; gap: 0; margin: 0; }
.dl > div { display: grid; grid-template-columns: 120px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--app-border); font-size: 14px; }
.dl > div:last-child { border-bottom: 0; }
.dl dt { color: var(--app-muted); }
.dl dd { margin: 0; overflow-wrap: anywhere; }
.tl { list-style: none; margin: 0; padding: 0; display: grid; }
.tl li { position: relative; padding: 0 0 18px 28px; font-size: 14px; }
.tl li::before { content: ""; position: absolute; left: 4px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--app-surface); border: 3px solid var(--app-primary); }
.tl li::after { content: ""; position: absolute; left: 9px; top: 20px; bottom: -2px; width: 2px; background: var(--app-border); }
.tl li:last-child { padding-bottom: 0; }
.tl li:last-child::after { display: none; }
.tl li.done::before { background: var(--app-primary); }
.tl li.queued::before { border-style: dashed; border-color: var(--app-warn-text); }
.tl .when { font-size: 12px; color: var(--app-muted); display: block; }
.tl .row { align-items: flex-start; }
.seg-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0; }
.seg-tabs .chip { min-height: 44px; padding: 0 16px; }
.chip .cnt { font-size: 12px; opacity: .85; }
.search { position: relative; }
.search .ico { position: absolute; left: 14px; top: 13px; color: var(--app-muted); pointer-events: none; }
.search .input { padding-left: 42px; }
.empty { text-align: center; padding: 28px 12px; color: var(--app-muted); display: grid; gap: 6px; }
.empty b { color: var(--app-text); font-family: var(--xm-font-heading); }

/* Alerte (encadrés) */
.note { border-radius: var(--xm-radius-md); padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; background: var(--app-primary-subtle); color: var(--app-primary-subtle-text); }
.note.warn { background: var(--app-warn-bg); color: var(--app-warn-text); }
.note.ok { background: var(--app-ok-bg); color: var(--app-success); }
.note p { margin: 0; }
.note .ico { margin-top: 2px; }
.app[data-theme="dark"] .note { color: var(--app-text); }
.app[data-theme="dark"] .note.warn { color: var(--app-warn-text); }
.app[data-theme="dark"] .note.ok { color: var(--app-success); }

/* Formulaires */
.fld { display: grid; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.fld > legend, .fld > label { font-size: 14px; font-weight: 700; padding: 0; }
.fld .req { color: var(--app-danger-text); }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 40px; }
.opts { display: grid; gap: 8px; }
.opts.cols2 { grid-template-columns: 1fr 1fr; }
.opts.cols3 { grid-template-columns: 1fr 1fr 1fr; }
.opt { position: relative; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 14px; border: 1px solid var(--app-border); border-radius: var(--xm-radius-md); background: var(--app-surface); font-size: 15px; cursor: pointer; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--app-muted); flex-shrink: 0; display: grid; place-items: center; }
.opt input:checked ~ .dot { border-color: var(--app-primary); }
.opt input:checked ~ .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--app-primary); }
.opt:has(input:checked) { border-color: var(--app-primary); background: var(--app-primary-subtle); }
.app[data-theme="dark"] .opt:has(input:checked) { color: var(--app-text); }
.opt:has(input:focus-visible) { outline: 3px solid var(--app-primary); outline-offset: 2px; }
.opt small { display: block; color: var(--app-muted); font-size: 13px; line-height: 1.35; }
.opt .tx { flex: 1; min-width: 0; }
.opt.sm { min-height: 44px; justify-content: center; text-align: center; padding: 6px 8px; font-weight: 700; }
.opt.sm .dot { display: none; }
.steplab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; color: var(--app-muted); margin-bottom: 6px; }
.steplab b { color: var(--app-text); font-family: var(--xm-font-heading); font-size: 15px; }
.formnav { display: flex; gap: 10px; }
.formnav .btn { flex: 1; }
.errsum { border: 2px solid var(--app-danger-text); border-radius: var(--xm-radius-md); padding: 10px 12px; font-size: 14px; color: var(--app-text); background: var(--app-danger-subtle); }
.app[data-theme="dark"] .errsum { color: var(--app-text); }
.errsum:focus { outline: 3px solid var(--app-primary); }
.review .row-r { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--app-border); font-size: 14px; }
.review .row-r .k { color: var(--app-muted); font-size: 13px; }
.review .row-r .btn-link { min-height: 44px; min-width: 44px; }

/* File de synchronisation */
.q-item { background: var(--app-surface); border: 1px solid var(--app-border); border-radius: var(--xm-radius-lg); padding: 12px 14px; display: grid; gap: 8px; }
.q-item.conflict { border-color: var(--app-warn-text); border-width: 2px; }
.q-item .top { display: flex; gap: 10px; align-items: flex-start; }
.q-item .top .grow { flex: 1; min-width: 0; }
.q-item h3 { font: 700 15px/1.3 var(--xm-font-heading); margin: 0; }
.q-item .sub { font-size: 13px; color: var(--app-muted); }
.clock-off { color: var(--app-muted); opacity: .75; }
.sync-card { display: grid; gap: 12px; }
.sync-card .stat { display: flex; align-items: center; gap: 12px; }
.sync-card .stat .ico { width: 32px; height: 32px; color: var(--app-primary); }
.sync-card.off .stat .ico { color: var(--app-muted); opacity: .7; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.cmp { display: grid; gap: 8px; }
.cmp .opt small b { color: var(--app-text); }

/* SOS */
.sos-wrap { display: grid; justify-items: center; gap: 16px; text-align: center; }
.sos-btn { position: relative; width: 168px; height: 168px; border-radius: 50%; border: 0; background: var(--app-danger); color: var(--app-on-danger); font: 800 34px var(--xm-font-heading); box-shadow: 0 14px 30px rgb(227 14 14 / .3); touch-action: none; user-select: none; -webkit-user-select: none; }
.sos-btn svg { position: absolute; inset: -10px; width: calc(100% + 20px); height: calc(100% + 20px); transform: rotate(-90deg); }
.sos-btn circle { fill: none; stroke: var(--app-danger-text); stroke-width: 6; stroke-dasharray: 600; stroke-dashoffset: 600; }
.sos-btn.holding circle { transition: stroke-dashoffset 2s linear; stroke-dashoffset: 0; }

/* Maquette : compte à rebours d'escalade, confirmation forte */
.band-sos { background: var(--app-danger-subtle); border: 2px solid var(--app-danger); border-radius: var(--xm-radius-lg); padding: 14px; display: grid; gap: 12px; color: var(--app-text); }
.band-sos h2 { font: 800 18px/1.25 var(--xm-font-heading); margin: 0; display: flex; gap: 8px; align-items: center; }
.band-sos h2 .sosb { background: var(--app-danger); color: var(--app-on-danger); border-radius: var(--xm-radius-pill); padding: 2px 10px; font-size: 13px; }
.band-sos .item { background: var(--app-surface); border-radius: var(--xm-radius-md); padding: 10px 12px; display: grid; gap: 8px; }
.mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.state-card { display: grid; gap: 8px; }
.state-card .big { font: 800 22px/1.2 var(--xm-font-heading); }
.check-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; font-size: 14px; }
.check-list li { display: flex; gap: 8px; align-items: flex-start; }
.check-list .ico { color: var(--app-success); margin-top: 2px; }
.unread { position: relative; }
.unread::before { content: ""; position: absolute; left: -8px; top: 22px; width: 8px; height: 8px; border-radius: 50%; background: var(--app-primary); }

/* Phone étroit : plein écran sans châssis */
@media (max-width: 900px) {
  .sim { grid-template-columns: 1fr; }
  .rail { display: none; }
  .rail-select { display: block; min-height: 40px; max-width: 220px; }
  .topbar { padding: 8px 12px; gap: 8px; }
  .topbar .sub { display: none; }
}
@media (max-width: 480px) {
  .sim { height: 100dvh; }
  .topbar .brand { display: none; }
  .stage { padding: 0; justify-content: flex-start; }
  .stage-caption { display: none; }
  .device-wrap { width: 100% !important; height: 100% !important; transform: none !important; }
  .device { --safe-top: 12px; --safe-bottom: 12px; width: 100%; height: 100%; padding: 0; border-radius: 0; background: none; box-shadow: none; }
  .device::before, .device::after, .notch, .statusbar, .homebar { display: none; }
  .screen { width: 100%; height: 100%; border-radius: 0; }
}
.netchip { text-decoration: none; }
.acard .meta span { display: inline-flex; align-items: center; gap: 4px; }
.acard .acts .btn { flex: 1 1 130px; padding: 0 12px; text-align: center; line-height: 1.2; }

.netchip { padding: 0 10px; }
.seg-tabs { flex-wrap: wrap; }

/* Corrections de contraste et de cibles */
.app { --app-success-text: #075C38; }
.app[data-theme="dark"] { --app-success-text: var(--app-success); }
.badge.ok, .note.ok { color: var(--app-success-text); }
.app[data-theme="dark"] .note.ok { color: var(--app-success); }
.chip { min-height: 44px; }
@media (max-width: 480px) { .topbar .ctl > span { display: none; } .topbar { gap: 6px; padding: 6px 8px; } .seg button { padding: 6px 8px; } .rail-select { max-width: 100%; flex: 1 1 100%; } }

</style>

<noscript>Cette maquette demande JavaScript.</noscript>
<script>
/* Noyau commun des maquettes (Espace pair, Admin mobile) : routage par ancre, thème, réseau, feuilles, notifications.
   Dépend de l'objet de chaînes T défini en tête du fichier de la maquette. */
(function () {
  'use strict';
  const Kit = window.Kit = {};
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const t = (key, v = {}) => {
    let o = key.split('.').reduce((a, k) => (a == null ? a : a[k]), T);
    if (o == null) return key;
    if (typeof o === 'object') o = v.count === 0 && o.zero !== undefined ? o.zero : v.count === 1 ? o.one : o.other;
    return String(o).replace(/:(\w+)/g, (m, k) => (v[k] !== undefined ? v[k] : m));
  };
  const P = {
    home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
    bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',

    folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
    'file-plus': '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>',
    sync: '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
    clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    'wifi-off': '<line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>',
    wifi: '<path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>',
    search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
    back: '<polyline points="15 18 9 12 15 6"/>',
    next: '<polyline points="9 18 15 12 9 6"/>',
    check: '<polyline points="20 6 9 17 4 12"/>',
    x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    pin: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
    users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    'user-check': '<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/>',
    tool: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
    send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
    cloud: '<polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>',
    info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
    ext: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',
    shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    dash: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
    lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    note: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    list: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
    swap: '<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  };
  const ic = (n, c = '') => `<svg class="ico ${c}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${P[n] || ''}</svg>`;
  Object.assign(Kit, { esc, t, ic });

  const q = new URLSearchParams(location.search);
  const hq = new URLSearchParams(location.hash.split('?')[1] || '');
  ['theme', 'net'].forEach(k => { if (hq.get(k)) q.set(k, hq.get(k)); });
  const S = Kit.S = {
    theme: q.get('theme') === 'dark' ? 'dark' : 'light', // clair par défaut ; plus de bascule dans l'interface (?theme=dark reste utilisable pour la recette)
    net: q.get('net') === 'off' ? 'off' : 'on',
    route: { name: '', args: [], q: {} },
  };
  let cfg, app, frame, ov, live, lastKey = '', toastTimer, current = null;
  const $ = (s, r = document) => r.querySelector(s);

  function parse() {
    const h = location.hash.replace(/^#\/?/, '');
    const [p, qs = ''] = h.split('?');
    const parts = p.split('/').filter(Boolean).map(decodeURIComponent);
    return { name: parts[0] || cfg.home, args: parts.slice(1), q: Object.fromEntries(new URLSearchParams(qs)) };
  }

  Kit.setTheme = th => {
    S.theme = th; app.dataset.theme = th; document.documentElement.dataset.pageTheme = th;
  };
  Kit.setNet = (n, silent) => {
    const was = S.net; S.net = n;
    document.querySelectorAll('[data-net-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.netSet === n)));
    if (!silent && was !== n) { if (cfg.onNet) cfg.onNet(n, was); Kit.render(); Kit.say(n === 'off' ? t('net.went_off') : t('net.went_on')); }
  };
  Kit.say = msg => { live.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastTimer); toastTimer = setTimeout(() => { live.innerHTML = ''; }, 4200); };
  Kit.toast = Kit.say;
  Kit.go = h => { location.hash = h; };

  Kit.render = (opts = {}) => {
    const r = S.route; const d = cfg.screen(r) || cfg.screen({ name: cfg.home, args: [], q: {} });
    const key = r.name + '/' + r.args.join('/');
    const old = $('.pane', frame); const keep = !opts.top && key === lastKey && old ? old.scrollTop : 0;
    const tabs = d.noTabs ? '' : `<nav class="tb" aria-label="${esc(t('nav.label'))}">${cfg.tabs.map(tb => `<a href="#/${tb.href}" ${d.tab === tb.id ? 'aria-current="page"' : ''} class="${tb.sos ? 'sos' : ''}">${tb.sos ? `<span class="b" aria-hidden="true">SOS</span><span class="vh">${esc(tb.label)}</span>` : `${ic(tb.icon)}<span>${esc(tb.label)}</span>`}${tb.count && tb.count() ? `<span class="cnt" aria-hidden="true">${esc(tb.count())}</span>` : ''}</a>`).join('')}</nav>`;
    const chip = cfg.chip && !d.back ? cfg.chip(r) : '';
    const banner = cfg.banner ? cfg.banner() : '';
    frame.innerHTML = `<header class="hdr">${d.back ? `<a class="icon-btn" href="#/${d.back}" aria-label="${esc(d.backLabel || t('nav.back'))}">${ic('back')}</a>` : ''}<h1 class="t" id="ttl" tabindex="-1">${d.title}</h1>${chip}</header>${banner}<main class="pane" id="pane">${d.html}</main>${tabs}`;
    const pane = $('.pane', frame); pane.scrollTop = keep;
    if (key !== lastKey && !opts.noFocus) { const tt = $('#ttl', frame); if (tt) tt.focus({ preventScroll: true }); }
    lastKey = key;
    document.title = (d.plain || '') + (d.plain ? ' · ' : '') + cfg.title;
    const links = [...document.querySelectorAll('.rail a')]; const cur = location.hash.replace(/^#\//, '');
    let hit = links.find(a => a.getAttribute('href') === '#/' + cur) || links.find(a => a.dataset.name === r.name);
    links.forEach(a => a.toggleAttribute('aria-current', a === hit)); if (hit) hit.setAttribute('aria-current', 'page');
    const cap = $('#caption'); if (cap) cap.innerHTML = d.caption || '';
    if (d.mount) d.mount(pane);
  };

  Kit.sheet = (html, o = {}) => {
    const opener = document.activeElement;
    ov.innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(o.label || '')}"><div class="grab" aria-hidden="true"></div>${html}</div>`;
    const sh = $('.sheet', ov);
    const close = () => { current = null; ov.innerHTML = ''; document.removeEventListener('keydown', key, true); if (opener && opener.focus && document.contains(opener)) opener.focus({ preventScroll: true }); if (o.onClose) o.onClose(); };
    const focusables = () => [...sh.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])')];
    const key = e => {
      if (e.key === 'Escape') { e.stopPropagation(); close(); }
      if (e.key === 'Tab') { const f = focusables(); if (!f.length) return; const a = f[0], z = f[f.length - 1]; if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); } }
    };
    document.addEventListener('keydown', key, true); current = close;
    ov.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
    const f = focusables().find(x => !x.matches('[data-close]')) || sh; (o.focus ? $(o.focus, sh) || f : f).focus({ preventScroll: true });
    if (o.onMount) o.onMount(sh, close);
    return close;
  };
  Kit.confirm = o => Kit.sheet(`<h2>${esc(o.title)}</h2><p style="margin:0">${o.text || ''}</p>${o.body || ''}<div class="formnav"><button class="btn btn-outline" data-close>${esc(o.cancel || t('common.cancel'))}</button><button class="btn btn-primary" id="okBtn" ${o.disabled ? 'disabled' : ''}>${esc(o.ok)}</button></div>`, {
    label: o.title,
    focus: o.focus,
    onMount: (sh, close) => { o.mount && o.mount(sh); $('#okBtn', sh).addEventListener('click', () => { if (o.validate && o.validate(sh) === false) return; close(); o.onOk && o.onOk(sh); }); },
  });

        ${a.status === 'nouveau' ? `<button class="btn ${a.ack ? 'btn-primary' : 'btn-outline'} btn-block" data-act="take" data-id="${a.id}">${esc(t('alerts.take'))}</button>` : ''}
        <div class="grid2"><button class="btn btn-outline" data-act="reassign" data-id="${a.id}">${ic('swap', 'sm')} ${esc(t('alerts.reassign'))}</button><button class="btn btn-outline" data-act="note" data-id="${a.id}">${ic('note', 'sm')} ${esc(t('alerts.note'))}</button></div>
        <form class="card stack-s" data-form="status" data-id="${a.id}"><div class="fld"><label for="ns">${esc(t('alerts.change_status'))}</label><select class="input" id="ns"><option value="">${esc(t('alerts.choose_status'))}</option>${Object.entries(T.enums.alert_status).filter(([k]) => k !== a.status).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select></div><button class="btn btn-outline" type="submit">${esc(t('common.apply'))}</button></form></div>`,
      mount: pane => { const f = pane.querySelector('[data-form="status"]'); f.addEventListener('submit', e => { e.preventDefault(); if (needNet()) return; const v = f.querySelector('select').value; if (!v) return; a.status = v; if (v !== 'nouveau') a.ack = true; a.hist.push(['à l’instant', `${en('alert_status', a.status)} (statut changé par vous)`]); Kit.toast(t('alerts.status_changed')); Kit.render({ noFocus: true }); }); } };
  }

  /* ---------- Pairs ---------- */
  function peers() {
    return { tab: 'peers', title: esc(t('peers.title')), plain: t('peers.title'), html: `
      <p class="muted small" style="margin:0">${esc(t('peers.intro'))}</p>
      <div class="sec-h"><b>${esc(t('peers.count', { count: P.length }))}</b></div>
      ${P.length ? P.map(p => `<article class="acard" aria-label="${esc(p.pseudo)}"><div class="row"><span class="avatar" style="background:var(--xm-blue-500)" aria-hidden="true">${esc(p.pseudo.slice(5, 6))}</span><div class="grow" style="flex:1"><h3>${esc(p.pseudo)}</h3><span class="small muted">${esc(t('peers.requested'))}</span></div></div>
        <div class="meta"><span>${ic('pin', 'sm')} ${esc(p.zone)}</span><span>${ic('clock', 'sm')} ${esc(t('peers.joined', { date: fmtDate(p.joined) }))}</span></div>
        <div>${badge(p.training ? 'ok' : 'warn', p.training ? t('peers.training') : t('peers.no_training'))}</div>
        <div class="acts"><button class="btn btn-primary" data-act="approve" data-id="${p.id}">${ic('check', 'sm')} ${esc(t('peers.validate'))}</button><button class="btn btn-outline" data-act="reject" data-id="${p.id}">${esc(t('peers.reject'))}</button></div></article>`).join('')
        : `<div class="empty"><b>${esc(t('peers.empty'))}</b>${esc(t('peers.empty_text'))}</div>` }` };
  }

  /* ---------- Maintenance ---------- */
  function maintenance() {
    const st = M.on ? 'ongoing' : 'inactive';
    return { tab: 'maint', title: esc(t('maint.title')), plain: t('maint.title'), html: `
      <section class="card state-card" aria-live="polite"><div>${badge(M.on ? 'warn' : 'ok', t('maint.states.' + st))}</div><div class="big">${esc(t('maint.headlines.' + st))}</div><p style="margin:0">${esc(t('maint.state_text.' + st))}</p>
        <dl class="dl"><div><dt>${esc(t('maint.state'))}</dt><dd>${esc(t('maint.states.' + st))}</dd></div><div><dt>${esc(t('maint.ends'))}</dt><dd>${esc(M.on ? (M.duration === 'unknown' ? t('maint.unknown') : `~ ${t('maint.durations.' + M.duration)}`) : t('maint.none'))}</dd></div>${M.on ? `<div><dt>${esc(t('maint.started'))}</dt><dd>${esc(M.since)}</dd></div>` : ''}</dl></section>
      <section class="card stack-s">${M.on ? `<p style="margin:0">${esc(t('maint.disable_text'))}</p><button class="btn btn-primary btn-block" data-act="mdisable">${ic('wifi', 'sm')} ${esc(t('maint.disable'))}</button>`
        : `<p style="margin:0">${esc(t('maint.live_text'))}</p><button class="btn btn-primary btn-block" data-act="menable">${ic('tool', 'sm')} ${esc(t('maint.enable'))}</button>`}</section>
      <section class="note ok" style="display:grid;gap:8px" aria-labelledby="oh"><b id="oh">${ic('shield', 'sm')} ${esc(t('maint.open_title'))}</b><span>${esc(t('maint.open_text'))}</span>
        <ul class="check-list">${T.maint.open_items.map(x => `<li>${ic('check', 'sm')}<span>${esc(x)}</span></li>`).join('')}</ul></section>
      <p class="muted small" style="margin:0">${esc(t('maint.intro'))}</p>` };
  }

  /* ---------- Notifications ---------- */
  function notifs() {
    const u = unread();
    return { tab: 'notifs', title: esc(t('notifs.title')), plain: t('notifs.title'), html: `
      <div class="row between wrap"><b>${esc(t('notifs.unread', { count: u }))}</b><button class="btn btn-outline btn-sm" style="min-height:44px" data-act="readall" ${u ? '' : 'disabled'}>${ic('check', 'sm')} ${esc(t('notifs.mark_all'))}</button></div>
      <ul class="stack-s" style="list-style:none;margin:0;padding:0">${N.map(n => `<li>${n.href ? `<a class="link-row ${n.unread ? 'unread' : ''}" href="#/${n.href}" data-act="readone" data-id="${n.id}">` : `<button class="link-row ${n.unread ? 'unread' : ''}" data-act="readone" data-id="${n.id}">`}${ic(n.icon)}<span class="grow"><b>${esc(n.title)}</b><span class="small muted" style="display:block">${esc(n.when)}${n.unread ? ' · ' + esc(t('notifs.unread_one')) : ''}</span></span>${n.href ? ic('next', 'sm') : ''}${n.href ? '</a>' : '</button>'}</li>`).join('')}</ul>` };
  }

  /* ---------- Actions ---------- */
  const doAck = (a, take) => { a.ack = true; if (take) a.status = 'pris_en_charge'; a.hist.push(['à l’instant', take ? 'Pris en charge par vous (réception accusée)' : 'Réception accusée par vous']); };
  const actions = {
    ack: d => { if (needNet()) return; doAck(byId(d.id)); Kit.toast(t('alerts.acknowledged')); Kit.render({ noFocus: true }); },
    take: d => { if (needNet()) return; doAck(byId(d.id), true); Kit.toast(t('alerts.taken')); Kit.render({ noFocus: true }); },
    tab: d => { L.tab = d.v; Kit.render({ noFocus: true }); },
    reset: () => { L.q = ''; L.status = ''; Kit.render({ noFocus: true }); },
    maps: () => Kit.confirm({ title: t('alerts.maps_title'), text: esc(t('alerts.maps_text')), body: `<p class="note warn">${ic('alert', 'sm')}<span>${esc(t('alerts.maps_help'))}</span></p>`, ok: t('alerts.maps_go'), cancel: t('common.cancel'), onOk: () => Kit.toast(t('alerts.maps_sim')) }),
    reassign: d => {
      const a = byId(d.id); const sorted = DIR.slice().sort((x, y) => (y[1] === a.zone) - (x[1] === a.zone));
      Kit.confirm({ title: t('alerts.reassign_title'), text: esc(t('alerts.reassign_help')), ok: t('alerts.reassign'), disabled: true, focus: '#rc',
        body: `<div class="fld"><label for="rc">${esc(t('alerts.contact_label'))}</label><select class="input" id="rc"><option value="">${esc(t('alerts.choose_contact'))}</option>${sorted.map(([n, z]) => `<option value="${esc(n)}">${esc(n)} — ${esc(z === 'National' ? t('alerts.national') : z)}</option>`).join('')}</select></div>`,
        mount: sh => { const ok = sh.querySelector('#okBtn'); sh.querySelector('#rc').addEventListener('change', e => { ok.disabled = !e.target.value; }); },
        validate: () => !needNet(),
        onOk: sh => { const name = sh.querySelector('#rc').value; a.routed = name; a.hist.push(['à l’instant', `Réattribuée à ${name} par vous`]); Kit.toast(t('alerts.reassigned', { name })); Kit.render({ noFocus: true }); } });
    },
    note: d => {
      const a = byId(d.id);
      Kit.confirm({ title: t('alerts.note_title'), text: '', ok: t('alerts.note_add'), focus: '#nt', body: `<div class="fld"><label for="nt">${esc(t('alerts.note'))}</label><textarea class="input" id="nt" rows="4" placeholder="${esc(t('alerts.note_placeholder'))}"></textarea><span class="hint" id="nth" role="status"></span></div>`,
        validate: sh => { const ta = sh.querySelector('#nt'); if (!ta.value.trim()) { sh.querySelector('#nth').textContent = t('alerts.note_empty'); ta.focus(); return false; } return !needNet(); },
        onOk: sh => { a.hist.push(['à l’instant', `Note interne : ${sh.querySelector('#nt').value.trim()}`]); Kit.toast(t('alerts.note_added')); Kit.render({ noFocus: true }); } });
    },
    approve: d => { const p = P.find(x => x.id === +d.id); Kit.confirm({ title: t('peers.validate_title', { name: p.pseudo }), text: esc(t('peers.validate_text')), ok: t('peers.validate_yes'), onOk: () => { if (needNet()) return; P.splice(P.indexOf(p), 1); Kit.toast(t('peers.approved', { name: p.pseudo })); Kit.render({ noFocus: true }); } }); },
    reject: d => { const p = P.find(x => x.id === +d.id); Kit.confirm({ title: t('peers.reject_title', { name: p.pseudo }), text: esc(t('peers.reject_text')), ok: t('peers.reject_yes'), onOk: () => { if (needNet()) return; P.splice(P.indexOf(p), 1); Kit.toast(t('peers.rejected', { name: p.pseudo })); Kit.render({ noFocus: true }); } }); },
    menable: () => {
      if (needNet()) return;
      Kit.confirm({ title: t('maint.confirm_title'), text: esc(t('maint.confirm_text')), ok: t('maint.enable_yes'), disabled: true, focus: '#mr',
        body: `<p class="note ok">${ic('shield', 'sm')}<span><b>${esc(t('maint.open_title'))}</b> ${esc(t('maint.open_text'))}</span></p>
          <div class="fld"><label for="mr">${esc(t('maint.reason'))}</label><input class="input" id="mr" value="${esc(t('maint.reason_default'))}"><span class="hint">${esc(t('maint.reason_hint'))}</span></div>
          <div class="fld"><label for="md">${esc(t('maint.duration'))}</label><select class="input" id="md">${Object.entries(T.maint.durations).map(([k, v]) => `<option value="${k}" ${k === '60' ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></div>
          <label class="check"><input type="checkbox" id="mk"><span>${esc(t('maint.acknowledge'))}</span></label>
          <div class="fld"><label for="mw">${esc(t('maint.prompt', { word: t('maint.word') }))}</label><input class="input" id="mw" autocomplete="off" autocapitalize="characters" aria-describedby="mwh"><span class="hint" id="mwh">${esc(t('maint.prompt_label'))}</span></div>`,
        mount: sh => {
          const ok = sh.querySelector('#okBtn'), k = sh.querySelector('#mk'), w = sh.querySelector('#mw');
          const upd = () => { ok.disabled = !(k.checked && w.value.trim() === t('maint.word')); const h = sh.querySelector('#mwh'); h.textContent = w.value && w.value.trim() !== t('maint.word') ? t('maint.mismatch') : t('maint.prompt_label'); };
          k.addEventListener('change', upd); w.addEventListener('input', upd);
        },
        onOk: sh => { M.on = true; M.since = '28/10/2026 à 10:12'; M.duration = sh.querySelector('#md').value; M.reason = sh.querySelector('#mr').value; Kit.toast(t('maint.enabled')); Kit.render({ noFocus: true }); } });
    },
    mdisable: () => { if (needNet()) return; Kit.confirm({ title: t('maint.disable') + ' ?', text: esc(t('maint.disable_text')), ok: t('maint.disable_yes'), onOk: () => { M.on = false; Kit.toast(t('maint.disabled')); Kit.render({ noFocus: true }); } }); },
    readall: () => { N.forEach(n => { n.unread = false; }); Kit.toast(t('notifs.marked_all')); Kit.render({ noFocus: true }); },
    readone: d => { const n = N.find(x => x.id === +d.id); n.unread = false; },
  };
