/* =====================================================================
   Jetons : copie du design system Xomiton (design-system/tokens/tokens.css)
   ===================================================================== */
:root {
  --xm-blue-50:#EBEFFA; --xm-blue-100:#D7DEF5; --xm-blue-200:#AFBEEC; --xm-blue-500:#0433C3; --xm-blue-600:#032BA6; --xm-blue-700:#032488; --xm-blue-800:#021C6B; --xm-blue-900:#02134A;
  --xm-red-50:#FDECEC; --xm-red-500:#E30E0E; --xm-red-600:#C10C0C; --xm-red-700:#9F0A0A;
  --xm-neutral-0:#FFFFFF; --xm-neutral-25:#FBF7FA; --xm-neutral-100:#F3EDF4; --xm-neutral-200:#E4DCE6; --xm-neutral-400:#8E88A0; --xm-neutral-600:#5B5670; --xm-neutral-900:#1B1630;
  --xm-green-700:#0B7A4B; --xm-amber-500:#F0A800; --xm-sky-700:#1864AB; --xm-violet-700:#6F2C91; --xm-rose-600:#C2255C;
  --xm-font-heading:"Montserrat","Segoe UI",Arial,sans-serif;
  --xm-font-body:Arial,"Liberation Sans",Helvetica,sans-serif;
  --xm-radius-md:8px; --xm-radius-lg:16px; --xm-radius-pill:999px;
  --xm-ease-out:cubic-bezier(.2,.8,.2,1);
  --xm-target-min:44px;

  /* Page du simulateur (hors appareil) */
  --pg-bg: var(--xm-neutral-100);
  --pg-surface: var(--xm-neutral-0);
  --pg-border: var(--xm-neutral-200);
  --pg-text: var(--xm-neutral-900);
  --pg-muted: var(--xm-neutral-600);
  --pg-accent: var(--xm-blue-500);
  --pg-accent-subtle: var(--xm-blue-50);
  --pg-code-bg: var(--xm-blue-900);
  --pg-code-text: #DCE3FA;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-page-theme="light"]) {
    --pg-bg:#0B0D1A; --pg-surface:#151829; --pg-border:#2A2E48; --pg-text:#EDEAF7; --pg-muted:#A9A5C0; --pg-accent:#7C97FF; --pg-accent-subtle:#1B2347; --pg-code-bg:#070917;
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--pg-bg); color: var(--pg-text); font: 15px/1.5 var(--xm-font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--xm-font-heading); line-height: 1.2; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pg-accent); outline-offset: 2px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 50; background: var(--pg-accent); color: #fff; padding: 10px 14px; border-radius: 8px; }
.skip:focus { top: 8px; }

/* ---------- Mise en page générale ---------- */
.sim { display: grid; grid-template-columns: 272px minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--pg-surface); border-bottom: 1px solid var(--pg-border); flex-wrap: wrap; }
.topbar .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.topbar .brand img { height: 28px; width: auto; }
.topbar h1 { font-size: 16px; font-weight: 700; }
.topbar .sub { color: var(--pg-muted); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--pg-border); border-radius: var(--xm-radius-pill); padding: 3px; background: var(--pg-bg); }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: var(--xm-radius-pill); font-size: 13px; font-weight: 700; color: var(--pg-muted); min-height: 32px; }
.seg button[aria-pressed="true"] { background: var(--pg-surface); color: var(--pg-accent); box-shadow: 0 1px 3px rgb(27 22 48 / .14); }
.btn-ghost { border: 1px solid var(--pg-border); background: var(--pg-surface); border-radius: var(--xm-radius-pill); padding: 6px 14px; font-size: 13px; font-weight: 700; min-height: 34px; }

/* Rail gauche : index des écrans */
.rail { overflow-y: auto; background: var(--pg-surface); border-right: 1px solid var(--pg-border); padding: 12px 10px 24px; }
.rail-search { width: 100%; border: 1px solid var(--pg-border); border-radius: var(--xm-radius-md); padding: 8px 10px; background: var(--pg-bg); margin-bottom: 8px; min-height: 38px; }
.rail-group { margin-top: 14px; }
.rail-group h2 { font-size: 13px; font-weight: 700; padding: 0 8px 4px; display: flex; justify-content: space-between; align-items: baseline; }
.rail-group h2 code { font: 12px/1 var(--xm-font-body); color: var(--pg-muted); }
.rail a { display: grid; grid-template-columns: 26px 1fr; gap: 6px; align-items: baseline; padding: 7px 8px; border-radius: var(--xm-radius-md); color: var(--pg-text); text-decoration: none; font-size: 14px; }
.rail a .n { color: var(--pg-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.rail a .r { grid-column: 2; color: var(--pg-muted); font-size: 12px; }
.rail a:hover { background: var(--pg-bg); }
.rail a[aria-current="page"] { background: var(--pg-accent-subtle); color: var(--pg-accent); font-weight: 700; }
.rail a[aria-current="page"] .n, .rail a[aria-current="page"] .r { color: var(--pg-accent); }

/* Scène centrale */
.stage { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding: 16px; min-height: 0; }
.stage-caption { margin-top: 10px; font-size: 13px; color: var(--pg-muted); text-align: center; }
.stage-caption b { color: var(--pg-text); }
.device-wrap { transform-origin: top center; }

/* ---------- Châssis ---------- */
.device { --w: 390px; --h: 844px; --bezel: 12px; --r: 55px; --sr: 44px; --safe-top: 47px; --safe-bottom: 34px; position: relative; width: calc(var(--w) + var(--bezel) * 2); height: calc(var(--h) + var(--bezel) * 2); padding: var(--bezel); border-radius: var(--r); background: #1d1b26; box-shadow: 0 0 0 2px #4a4757 inset, 0 30px 60px rgb(27 22 48 / .28), 0 8px 18px rgb(27 22 48 / .18); }
.device::before, .device::after { content: ""; position: absolute; background: #2b2836; border-radius: 3px; }
.device::before { left: -3px; top: 160px; width: 3px; height: 64px; box-shadow: 0 84px 0 #2b2836; }
.device::after { right: -3px; top: 220px; width: 3px; height: 96px; }
.device[data-model="pixel8"] { --w: 412px; --h: 880px; --bezel: 10px; --r: 44px; --sr: 34px; --safe-top: 32px; --safe-bottom: 24px; background: #23262b; box-shadow: 0 0 0 2px #50545b inset, 0 30px 60px rgb(27 22 48 / .28), 0 8px 18px rgb(27 22 48 / .18); }
.device[data-model="pixel8"]::before { left: auto; right: -3px; top: 150px; height: 48px; box-shadow: 0 70px 0 0 #2b2836, 0 90px 0 0 #2b2836; }
.device[data-model="pixel8"]::after { display: none; }
.screen { --app-bg: var(--xm-neutral-25); --app-text: var(--xm-neutral-900); position: relative; width: var(--w); height: var(--h); border-radius: var(--sr); overflow: hidden; background: var(--app-bg); isolation: isolate; }
.notch { position: absolute; z-index: 30; left: 50%; top: 0; transform: translateX(-50%); width: 162px; height: 33px; background: #000; border-radius: 0 0 20px 20px; }
.notch::after { content: ""; position: absolute; right: 30px; top: 11px; width: 10px; height: 10px; border-radius: 50%; background: #16151d; box-shadow: inset 0 0 0 2px #24222e; }
.device[data-model="pixel8"] .notch { width: 14px; height: 14px; top: 10px; border-radius: 50%; }
.device[data-model="pixel8"] .notch::after { display: none; }
.statusbar { position: absolute; z-index: 25; left: 0; right: 0; top: 0; height: var(--safe-top); display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 34px; font: 600 15px/1 -apple-system, "SF Pro Text", var(--xm-font-body); color: var(--sb-color, var(--app-text)); pointer-events: none; }
.statusbar .icons { display: flex; gap: 6px; align-items: center; }
.statusbar svg { width: 17px; height: 12px; fill: currentColor; }
.device[data-model="pixel8"] .statusbar { padding: 0 18px; font: 500 14px/1 Roboto, var(--xm-font-body); }
.homebar { position: absolute; z-index: 25; left: 50%; bottom: 8px; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--app-text); opacity: .85; pointer-events: none; }
.device[data-model="pixel8"] .homebar { width: 108px; height: 4px; bottom: 7px; }

/* ---------- Application (dans l'appareil) ---------- */
.app {
  --app-bg: var(--xm-neutral-25); --app-surface: var(--xm-neutral-0); --app-muted-surface: var(--xm-neutral-100); --app-border: var(--xm-neutral-200);
  --app-text: var(--xm-neutral-900); --app-muted: var(--xm-neutral-600); --app-primary: var(--xm-blue-500); --app-primary-hover: var(--xm-blue-600); --app-on-primary: #fff;
  --app-primary-subtle: var(--xm-blue-50); --app-primary-subtle-text: var(--xm-blue-800); --app-danger: var(--xm-red-500); --app-danger-subtle: var(--xm-red-50);
  --app-success: var(--xm-green-700); --app-warning: var(--xm-amber-500); --app-info: var(--xm-sky-700); --app-violet: var(--xm-violet-700);
  position: absolute; inset: 0; background: var(--app-bg); color: var(--app-text); font: 16px/1.5 var(--xm-font-body); display: flex; flex-direction: column;
}
.app[data-theme="dark"] {
  --app-bg: #0E1020; --app-surface: #171A2E; --app-muted-surface: #1F2340; --app-border: #2A2E48; --app-text: #EDEAF7; --app-muted: #A9A5C0;
  --app-primary: #7C97FF; --app-primary-hover: #9DB1FF; --app-on-primary: #0E1020; --app-primary-subtle: #1B2347; --app-primary-subtle-text: #9DB1FF;
  --app-danger: #FF6B6B; --app-danger-subtle: #3A1519; --app-success: #4DD39D; --app-warning: #FFC94D; --app-info: #7AB2FF; --app-violet: #C79BE6;
}
.screen:has(.app[data-theme="dark"]) { --app-bg: #0E1020; --app-text: #EDEAF7; }
.view { flex: 1; overflow-y: auto; overflow-x: hidden; padding: calc(var(--safe-top) + 4px) 16px calc(var(--safe-bottom) + 20px); scrollbar-width: none; overscroll-behavior: contain; }
.view::-webkit-scrollbar { display: none; }
.view.stack, .view.stack-lg { grid-auto-rows: max-content; align-content: start; } /* les cartes overflow:hidden ne doivent pas être compressées */
.app.has-tabs .view { padding-bottom: calc(var(--safe-bottom) + 86px); }
.app.has-appbar .view { padding-top: calc(var(--safe-top) + 60px); }
.appbar { position: absolute; z-index: 20; left: 0; right: 0; top: 0; padding: var(--safe-top) 8px 0; height: calc(var(--safe-top) + 56px); display: flex; align-items: center; gap: 4px; background: color-mix(in srgb, var(--app-bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--app-border); }
.appbar h2 { font-size: 18px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 50%; display: inline-grid; place-items: center; color: var(--app-text); position: relative; flex-shrink: 0; }
.icon-btn:hover { background: var(--app-muted-surface); }
.icon-btn .dot { position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--app-danger); border: 2px solid var(--app-bg); }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.ico.sm { width: 18px; height: 18px; }
.ico.lg { width: 28px; height: 28px; }

/* Barre d'onglets : 5 entrées, SOS au centre (MASTER §6) */
.tabbar { position: absolute; z-index: 20; left: 0; right: 0; bottom: 0; padding: 6px 6px calc(var(--safe-bottom) + 2px); display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; background: color-mix(in srgb, var(--app-surface) 94%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--app-border); }
.tabbar button { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--app-muted); padding: 6px 0; min-height: 48px; }
.tabbar button[aria-current="page"] { color: var(--app-primary); font-weight: 700; }
.tabbar .sos-tab { transform: translateY(-14px); }
.tabbar .sos-tab span.b { width: 60px; height: 60px; border-radius: 50%; background: var(--app-danger); color: #fff; display: grid; place-items: center; font: 800 16px var(--xm-font-heading); box-shadow: 0 6px 16px rgb(227 14 14 / .35); border: 4px solid var(--app-surface); }
.tabbar .sos-tab { color: var(--app-danger); font-weight: 700; }

/* Composants de l'application */
.h-display { font: 800 28px/1.15 var(--xm-font-heading); letter-spacing: -.01em; }
.h1 { font: 800 24px/1.2 var(--xm-font-heading); }
.h2 { font: 700 19px/1.25 var(--xm-font-heading); }
.h3 { font: 700 16px/1.3 var(--xm-font-heading); }
.muted { color: var(--app-muted); }
.small { font-size: 14px; }
.xs { font-size: 13px; }
.stack { display: grid; gap: 12px; }
.stack-lg { display: grid; gap: 20px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.card { background: var(--app-surface); border: 1px solid var(--app-border); border-radius: var(--xm-radius-lg); padding: 16px; }
.card.flat { border: 0; background: var(--app-muted-surface); }
.card.tight { padding: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: var(--xm-radius-md); border: 1px solid transparent; font: 700 15px var(--xm-font-body); text-decoration: none; transition: background-color .12s; }
.btn-primary { background: var(--app-primary); color: var(--app-on-primary); }
.btn-primary:hover { background: var(--app-primary-hover); }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; }
.btn-soft { background: var(--app-primary-subtle); color: var(--app-primary-subtle-text); }
.btn-outline { background: transparent; border-color: var(--app-border); color: var(--app-text); }
.btn-danger { background: var(--app-danger); color: #fff; }
.btn-link { background: none; border: 0; color: var(--app-primary); font-weight: 700; padding: 0; min-height: 44px; }
.btn-block { width: 100%; }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.field { display: grid; gap: 6px; }
.field label, .label { font-size: 14px; font-weight: 700; }
.input { width: 100%; min-height: 48px; border: 1px solid var(--app-border); border-radius: var(--xm-radius-md); background: var(--app-surface); padding: 10px 14px; color: var(--app-text); }
textarea.input { min-height: 96px; resize: none; line-height: 1.45; }
.input:focus { outline: 3px solid color-mix(in srgb, var(--app-primary) 35%, transparent); border-color: var(--app-primary); }
.input[aria-invalid="true"] { border-color: var(--app-danger); }
.err { color: var(--app-danger); font-size: 13px; display: flex; gap: 6px; align-items: flex-start; }
.hint { color: var(--app-muted); font-size: 13px; }
.pw { position: relative; }
.pw .input { padding-right: 52px; }
.pw .icon-btn { position: absolute; right: 2px; top: 2px; }
.check { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--app-primary); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--app-border); min-height: 56px; }
.switch:last-child { border-bottom: 0; }
.switch input { appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--app-border); position: relative; flex-shrink: 0; transition: background-color .2s; cursor: pointer; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .2s var(--xm-ease-out); }
.switch input:checked { background: var(--app-primary); }
.switch input:checked::after { transform: translateX(18px); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { border: 1px solid var(--app-border); background: var(--app-surface); border-radius: var(--xm-radius-pill); padding: 0 14px; min-height: 36px; font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--app-primary); border-color: var(--app-primary); color: var(--app-on-primary); font-weight: 700; }
.badge { display: inline-flex; align-items: center; gap: 4px; border-radius: var(--xm-radius-pill); padding: 2px 10px; font-size: 12px; font-weight: 700; background: var(--app-primary-subtle); color: var(--app-primary-subtle-text); }
.badge.ok { background: color-mix(in srgb, var(--app-success) 14%, transparent); color: var(--app-success); }
.badge.warn { background: color-mix(in srgb, var(--app-warning) 22%, transparent); color: color-mix(in srgb, var(--app-warning) 45%, var(--app-text)); }
.badge.danger { background: var(--app-danger-subtle); color: var(--app-danger); }
.badge.violet { background: color-mix(in srgb, var(--app-violet) 14%, transparent); color: var(--app-violet); }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--xm-font-heading); color: #fff; flex-shrink: 0; }
.avatar.lg { width: 84px; height: 84px; font-size: 28px; border: 4px solid var(--app-surface); }
.list { display: grid; }
.list > * { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--app-border); min-height: 56px; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; color: inherit; text-decoration: none; }
.list > *:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alert { border-radius: var(--xm-radius-md); padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; background: var(--app-primary-subtle); color: var(--app-primary-subtle-text); }
.alert.ok { background: color-mix(in srgb, var(--app-success) 12%, transparent); color: var(--app-success); }
.alert.danger { background: var(--app-danger-subtle); color: var(--app-danger); }
.progress { height: 8px; border-radius: 4px; background: var(--app-muted-surface); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--app-primary); border-radius: inherit; transition: width .3s var(--xm-ease-out); }
.tile { display: grid; gap: 8px; align-content: start; padding: 14px; border-radius: var(--xm-radius-lg); background: var(--app-surface); border: 1px solid var(--app-border); text-align: left; min-height: 96px; color: inherit; }
.tile .ico { color: var(--app-primary); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.thumb { border-radius: var(--xm-radius-md); background: var(--app-muted-surface) center/cover no-repeat; }
.toast { position: absolute; z-index: 40; left: 16px; right: 16px; bottom: calc(var(--safe-bottom) + 92px); background: var(--xm-neutral-900); color: #fff; border-radius: var(--xm-radius-md); padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; box-shadow: 0 10px 30px rgb(0 0 0 / .25); animation: toast-in .25s var(--xm-ease-out); }
.app[data-theme="dark"] .toast { background: #EDEAF7; color: #0E1020; }
@keyframes toast-in { from { transform: translateY(12px); opacity: 0; } }
.stepper { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: 6px; }
.stepper i { height: 5px; border-radius: 3px; background: var(--app-border); }
.stepper i.on { background: var(--app-primary); }


/* =====================================================================
   Maquettes « Espace pair » et « Admin mobile » : compléments au simulateur
   ===================================================================== */
:root[data-page-theme="dark"] { --pg-bg:#0B0D1A; --pg-surface:#151829; --pg-border:#2A2E48; --pg-text:#EDEAF7; --pg-muted:#A9A5C0; --pg-accent:#7C97FF; --pg-accent-subtle:#1B2347; color-scheme: dark; }
.sim { grid-template-columns: 268px minmax(0, 1fr); }
.topbar .brand .logo { height: 28px; width: auto; }
.topbar .ctl { display: flex; align-items: center; gap: 8px; }
.topbar .ctl > span { font-size: 13px; color: var(--pg-muted); }
.seg button { min-height: 36px; }
.rail a { grid-template-columns: 1fr; }
.rail h2 { margin: 0; }
.rail .note { margin: 18px 8px 0; font-size: 13px; color: var(--pg-muted); }
.rail-select { display: none; }
.rail a { min-height: 40px; align-items: center; }

/* Jetons applicatifs complémentaires (contrastes AA) */
.app { --app-danger-text: var(--xm-red-700); --app-on-danger: #fff; --app-warn-bg: color-mix(in srgb, var(--xm-amber-500) 22%, var(--app-bg)); --app-warn-text: #5A3D00; --app-ok-bg: color-mix(in srgb, var(--app-success) 12%, var(--app-bg)); }
.app[data-theme="dark"] { --app-danger-text: #FF9A9A; --app-on-danger: #2A0C0C; --app-warn-bg: #3A2D0E; --app-warn-text: #FFD98A; --app-ok-bg: #12332A; }
.app * { scrollbar-width: none; }
.app :focus-visible { outline: 3px solid var(--app-primary); outline-offset: 2px; }
.app [tabindex="-1"]:focus { outline: none; }
.err { color: var(--app-danger-text); }
.badge.danger { background: var(--app-danger-subtle); color: var(--app-danger-text); }
.badge.warn { background: var(--app-warn-bg); color: var(--app-warn-text); }
.badge.ok { background: var(--app-ok-bg); color: var(--app-success); }
.badge.mute { background: var(--app-muted-surface); color: var(--app-muted); }
.badge { min-height: 24px; }
.btn-danger { background: var(--app-primary); color: var(--app-on-primary); }

/* Cadre de l'application : en-tête, bandeau, panneau, onglets */
.hdr { flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: var(--safe-top) 8px 6px; min-height: calc(var(--safe-top) + 54px); background: var(--app-bg); border-bottom: 1px solid var(--app-border); }
.hdr .t { flex: 1; min-width: 0; margin: 0 0 0 4px; font: 700 18px/1.2 var(--xm-font-heading); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr .t small { display: block; font: 400 12px/1.2 var(--xm-font-body); color: var(--app-muted); margin-top: 2px; }
.netchip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: var(--xm-radius-pill); border: 1px solid var(--app-border); background: var(--app-surface); color: var(--app-text); font: 700 13px var(--xm-font-body); flex-shrink: 0; }
.netchip.off { background: var(--app-warn-bg); color: var(--app-warn-text); border-color: transparent; }
.netchip .ico { width: 18px; height: 18px; }
.nb { flex-shrink: 0; display: flex; gap: 10px; align-items: flex-start; padding: 10px 16px; background: var(--app-warn-bg); color: var(--app-warn-text); font-size: 13px; line-height: 1.4; border-bottom: 1px solid var(--app-border); }
.pane { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 16px 16px 28px; display: grid; gap: 16px; align-content: start; grid-auto-rows: max-content; }
.tb { flex-shrink: 0; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; padding: 6px 4px calc(var(--safe-bottom) + 2px); background: var(--app-surface); border-top: 1px solid var(--app-border); }
.tb a { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 56px; padding: 4px 0; font-size: 12px; color: var(--app-muted); text-decoration: none; border-radius: var(--xm-radius-md); position: relative; }
.tb a[aria-current="page"] { color: var(--app-primary); font-weight: 700; }

  function pushHist(a, x) { a.hist.push({ w: 'à l’instant', x }); }
  function needNet() { if (S.net === 'off') { Kit.toast(t('alerts.offline')); return true; } return false; }

  /* ---------- Dossiers ---------- */
  function cases() {
    return { tab: 'cases', title: esc(t('cases.title')), plain: t('cases.title'), html: `
      <p class="muted small" style="margin:0">${esc(t('cases.intro'))}</p>
      <div class="search"><label class="vh" for="q">${esc(t('cases.search'))}</label>${ic('search')}<input class="input" id="q" type="search" inputmode="text" autocomplete="off" placeholder="${esc(t('cases.search_placeholder'))}" value="${esc(L.q)}"></div>
      <div class="stack-s" role="group" aria-label="${esc(t('cases.filters_label'))}">
        <div class="chips wrap" id="fk">${[['', t('cases.all_kinds')], ['VBG', 'VBG'], ['VDH', 'VDH']].map(([v, l]) => `<button class="chip" data-act="fk" data-v="${v}" aria-pressed="${L.kind === v}">${esc(l)}</button>`).join('')}</div>

  }
  function drawList() {
    const host = document.getElementById('list'); if (!host) return;
    const r = C.filter(c => (!L.q || c.code.toLowerCase().includes(L.q.trim().toLowerCase())) && (!L.status || c.status === L.status) && (!L.kind || c.kind === L.kind));
    host.innerHTML = `<div class="sec-h"><b>${esc(t('cases.results', { count: r.length }))}</b>${(L.q || L.status || L.kind) ? `<button class="btn-link" data-act="resetf">${esc(t('cases.reset'))}</button>` : ''}</div>` +
      (r.length ? r.map(c => `<a class="link-row" href="#/dossier/${c.code}" aria-label="${esc(c.code + ', ' + en('case_status', c.status) + ', ' + t('cases.open'))}"><span class="grow"><span class="row wrap" style="gap:6px"><b>${c.code}</b>${kindBadge(c.kind)}${stBadge(c.status)}</span>
        <span class="small muted" style="display:block;margin-top:4px">${fmt(c.date)} · ${esc(c.commune)} · ${esc(en('violence', c.viol))} · ${esc(t('cases.steps', { count: c.fu.length }))}</span></span>${ic('next', 'sm')}</a>`).join('')
        : `<div class="empty"><b>${esc(L.q || L.status || L.kind ? t('cases.empty_filtered') : t('cases.empty'))}</b>${L.q || L.status || L.kind ? '' : esc(t('cases.empty_text'))}</div>`);
  }
  function sheetSec(title, rows, open) {

  }
  function caseShow(code) {
    const c = find(code);
    if (!c) return { tab: 'cases', back: 'dossiers', title: esc(t('cases.title')), html: `<div class="empty"><b>${esc(t('cases.empty'))}</b></div>` };
    const s = c.sheet, locked = c.status === 'archive';

    return { tab: 'cases', back: 'dossiers', backLabel: t('case.back'), title: `${c.code}`, plain: c.code, html: `
      <div class="row wrap">${kindBadge(c.kind)}${stBadge(c.status)}${badge('mute', t('case.received', { date: fmt(c.date) }))}${badge('mute', t('case.age', { range: c.age }))}</div>
      ${s ? `<p class="muted small" style="margin:0">${esc(t('sheet.reference', { reference: s.ref }))}</p>` : `<p class="note">${ic('info', 'sm')}<span>${esc(t('sheet.not_filled'))}</span></p>`}
      <div class="stack-s">
      ${sheetSec(t('sheet.sections.identification'), [['pseudo', s ? s.pseudo : `Pseudo-${c.code.slice(-2)}${c.age.slice(0, 1)}`], ['sex', c.sex], ['age', c.age], ['population', c.pop], ['zone', `${c.commune} (${c.zone})`]], true)}
      ${sheetSec(t('sheet.sections.facts'), [['date', fmt(c.date)], ['place', sc(s && s.place)], ['type', en('violence', c.viol)], ['description', sc(s && s.desc)]], true)}
      ${sheetSec(t('sheet.sections.services'), [['services', s ? s.services.map(x => en('services', x)).join(', ') : null]])}
      ${sheetSec(t('sheet.sections.orientation'), s ? [['referral', s.referral.to], ['contact', s.referral.contact], ['referral_date', fmt(s.referral.date)], ['reason', s.referral.reason], ['urgency', t('sheet.urgency.' + s.referral.urgency)]] : [['referral', t('sheet.no_referral')]])}
      ${sheetSec(t('sheet.sections.consent'), s ? [['consent', s.consent.given ? t('sheet.yes') : t('sheet.no')], ['mode', t('sheet.modes.' + s.consent.mode)], ['sharing', s.consent.sharing ? t('sheet.yes') : t('sheet.no')]] : [['consent', null]])}</div>
      ${locked ? `<p class="note">${ic('lock', 'sm')}<span>${esc(t('case.locked'))}</span></p>` : `<form class="card stack-s" data-act-form="status" data-code="${c.code}"><div class="fld"><label for="ns">${esc(t('case.status_label'))}</label><select class="input" id="ns"><option value="">${esc(t('case.status_choose'))}</option>${['ouvert', 'en_cours', 'clos', 'archive'].filter(x => x !== c.status).map(x => `<option value="${x}">${esc(en('case_status', x))}</option>`).join('')}</select></div><button class="btn btn-outline" type="submit">${esc(t('case.status_submit'))}</button></form>`}
      <section class="stack-s" aria-labelledby="fh">${secH(t('case.timeline')).replace('<h2>', '<h2 id="fh">')}
        ${fu.length ? `<ol class="tl card">${fu.map(f => `<li class="${f.outcome === 'realise' ? 'done' : ''} ${f.queued ? 'queued' : ''}"><span class="when">${fmt(f.date)}</span><div class="row wrap" style="gap:6px"><b>${esc(f.step)}</b>${badge(f.outcome === 'realise' ? 'ok' : f.outcome === 'planifie' ? '' : 'mute', en('followup_outcome', f.outcome))}${f.queued ? badge('warn', t('case.in_queue')) : ''}</div>
          ${f.comment ? `<div class="small muted">${esc(f.comment)}</div>` : ''}${f.next ? `<div class="small muted">${esc(t('case.next'))} : ${fmt(f.next)}</div>` : ''}
          ${f.outcome === 'planifie' && !locked ? `<button class="btn-link" data-act="done" data-code="${c.code}" data-id="${f.id}">${esc(t('case.mark_done'))}</button>` : ''}</li>`).join('')}</ol>` : `<p class="muted card">${esc(t('case.timeline_empty'))}</p>`}</section>
      ${locked ? '' : `<a class="btn btn-primary btn-block" href="#/suivi/${c.code}">${ic('plus', 'sm')} ${esc(t('case.add'))}</a>`}`,
      mount: pane => { const f = pane.querySelector('[data-act-form="status"]'); if (f) f.addEventListener('submit', e => { e.preventDefault(); const v = f.querySelector('select').value; if (!v) return; c.status = v; Kit.toast(t('case.status_saved')); Kit.render({ noFocus: true }); }); } };
  }
  function followForm(code) {
    const c = find(code); if (!c) return caseShow(code);
    const e = FU.errors; const err = k => (e[k] ? `<span class="err" id="e-${k}">${ic('alert', 'sm')}${esc(e[k])}</span>` : '');
    const inv = k => (e[k] ? `aria-invalid="true" aria-describedby="e-${k}"` : '');
    const ne = Object.keys(e).length;
    return { tab: 'cases', back: `dossier/${code}`, backLabel: code, title: esc(t('case.add_title')), plain: t('case.add_title'), html: `
      <p class="muted small" style="margin:0">${code} · ${esc(t('col.no_identity_title'))}</p>
      ${ne ? `<div class="errsum" role="alert" tabindex="-1" id="es">${esc(t('case.errors_title', { count: ne }))}</div>` : ''}
      <form id="ff" class="stack" novalidate>
        <div class="fld"><label for="f-step">${esc(t('case.fields.step'))} <span class="req" aria-hidden="true">*</span></label><select class="input" id="f-step" ${inv('step')}><option value="">${esc(t('case.choose'))}</option>${T.case.steps_list.map(s => `<option ${FU.step === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>${err('step')}</div>
        <div class="fld"><label for="f-date">${esc(t('case.fields.date'))} <span class="req" aria-hidden="true">*</span></label><input class="input" id="f-date" type="date" value="${FU.date}" ${inv('date')}>${err('date')}</div>
        <div class="fld"><label for="f-out">${esc(t('case.fields.outcome'))}</label><select class="input" id="f-out">${Object.entries(T.enums.followup_outcome).map(([k, v]) => `<option value="${k}" ${FU.outcome === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></div>
        <div class="fld"><label for="f-next">${esc(t('case.fields.next'))} <span class="muted" style="font-weight:400">${esc(t('case.optional'))}</span></label><input class="input" id="f-next" type="date" value="${FU.next}" ${inv('next')}>${err('next')}</div>
        <div class="fld"><label for="f-com">${esc(t('case.fields.comment'))} <span class="muted" style="font-weight:400">${esc(t('case.optional'))}</span></label><textarea class="input" id="f-com" rows="4" ${inv('comment')}>${esc(FU.comment)}</textarea><span class="hint" id="cc">${esc(t('case.comment_hint', { count: FU.comment.length, max: 500 }))}</span>${err('comment')}</div>
        <button class="btn btn-primary btn-block" type="submit">${esc(t('case.add_submit'))}</button></form>`,
      mount: pane => {
        const g = id => pane.querySelector('#' + id);

        ['step', 'date', 'out', 'next'].forEach(k => g('f-' + k).addEventListener('change', ev => { FU[{ out: 'outcome' }[k] || k] = ev.target.value; }));

          const off = S.net === 'off'; const id = Date.now();

  /* ---------- Collecte ---------- */
  function validateStep(n) {
    const e = {};
    if (n === 1) {
      if (!F.kind) e.kind = t('col.errors.required');
      if (!F.date) e.date = t('col.errors.required'); else if (isNaN(Date.parse(F.date))) e.date = t('col.errors.date_invalid'); else if (F.date > TODAY) e.date = t('col.errors.date_future');
    }
    if (n === 2) {
      if (!F.zone) e.zone = t('col.errors.required');
      if (!F.commune) e.commune = t('col.errors.required'); else if (F.zone && !(ZONES[F.zone] || []).includes(F.commune)) e.commune = t('col.errors.commune_in_zone');
    }
    if (n === 3) { if (!F.pop) e.pop = t('col.errors.required'); if (!F.sex) e.sex = t('col.errors.required'); if (!F.age) e.age = t('col.errors.required'); }
    if (n === 4) { if (!F.viol) e.viol = t('col.errors.required'); const nt = F.notes.trim(); if (nt.length > 0 && nt.length < 20) e.notes = t('col.errors.notes_min', { min: 20 }); }
    return e;
  }
  function warnings() {
    const w = []; if (!F.date) return w;
    if ((Date.parse(TODAY) - Date.parse(F.date)) / 31557600000 > 2) w.push(t('col.date_old', { years: 2 }));
    const dup = C.filter(c => c.kind === F.kind && c.commune === F.commune && c.sex === F.sex && c.age === F.age && c.viol === F.viol).map(c => c.code);
    if (dup.length) w.push(t('col.duplicate', { count: dup.length, codes: dup.join(', ') }));
    return w;
  }
  const radio = (name, val, label, cur, extra = '', cls = '') => `<label class="opt ${cls}"><input type="radio" name="${name}" value="${esc(val)}" ${cur === val ? 'checked' : ''}><span class="dot" aria-hidden="true"></span><span class="tx">${label}${extra}</span></label>`;
  function collecte() {
    const e = F.errors; const ne = Object.keys(e).length;
    const err = k => (e[k] ? `<span class="err" id="e-${k}">${ic('alert', 'sm')}${esc(e[k])}</span>` : '');
    const inv = k => (e[k] ? `aria-invalid="true" aria-describedby="e-${k}"` : '');
    const grp = (k, legend, body, req = true) => `<fieldset class="fld" ${e[k] ? `aria-describedby="e-${k}"` : ''}><legend>${esc(legend)} ${req ? '<span class="req" aria-hidden="true">*</span>' : ''}</legend>${body}${err(k)}</fieldset>`;
    const steps = T.col.steps; let body = '';
    if (F.step === 1) body = grp('kind', t('col.fields.kind'), `<div class="opts">${['VBG', 'VDH'].map(k => radio('kind', k, `<b>${k}</b>`, F.kind, `<small>${esc(T.col.kinds_long[k])}</small>`)).join('')}</div>`) +
      `<div class="fld"><label for="date">${esc(t('col.fields.date'))} <span class="req" aria-hidden="true">*</span></label><input class="input" id="date" type="date" max="${TODAY}" value="${F.date}" ${inv('date')}>${err('date')}</div>`;
    if (F.step === 2) body = `<div class="fld"><label for="zone">${esc(t('col.fields.zone'))} <span class="req" aria-hidden="true">*</span></label><select class="input" id="zone" ${inv('zone')}><option value="">${esc(t('col.choose'))}</option>${Object.keys(ZONES).map(z => `<option ${F.zone === z ? 'selected' : ''}>${z}</option>`).join('')}</select>${err('zone')}</div>
      <div class="fld"><label for="commune">${esc(t('col.fields.commune'))} <span class="req" aria-hidden="true">*</span></label><select class="input" id="commune" ${F.zone ? '' : 'disabled'} ${inv('commune')}>${communeOpts()}</select>${F.zone ? '' : `<span class="hint">${esc(t('col.commune_first'))}</span>`}${err('commune')}</div>`;
    if (F.step === 3) body = `<div class="fld"><label for="pop">${esc(t('col.fields.population'))} <span class="req" aria-hidden="true">*</span></label><select class="input" id="pop" ${inv('pop')}><option value="">${esc(t('col.choose'))}</option>${POPS.map(p => `<option ${F.pop === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select>${err('pop')}</div>` +
      grp('sex', t('col.fields.sex'), `<div class="opts">${SEXES.map(s => radio('sex', s, esc(s), F.sex)).join('')}</div>`) +
      grp('age', t('col.fields.age'), `<div class="opts cols3">${AGES.map(a => radio('age', a, esc(a), F.age, '', 'sm')).join('')}</div>`);
    if (F.step === 4) body = grp('viol', t('col.fields.violence'), `<div class="opts">${VIOL.map(v => radio('viol', v, `<b>${esc(en('violence', v))}</b>`, F.viol, `<small>${esc(en('violence_hint', v))}</small>`)).join('')}</div>`) +
      `<div class="fld"><label for="ref">${esc(t('col.fields.referral'))}</label><select class="input" id="ref"><option value="">${esc(t('col.no_referral'))}</option>${Object.entries(T.enums.services).map(([k, v]) => `<option value="${k}" ${F.ref === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></div>
      <div class="fld"><label for="notes">${esc(t('col.fields.notes'))}</label><textarea class="input" id="notes" rows="4" placeholder="${esc(t('col.notes_placeholder'))}" ${inv('notes')}>${esc(F.notes)}</textarea><span class="hint">${esc(t('col.notes_hint', { min: 20 }))}</span>${err('notes')}</div>`;
    if (F.step === 5) {
      const w = warnings(); const off = S.net === 'off';

      body = `<div><h2 class="h2" style="margin:0 0 4px">${esc(t('col.review_title'))}</h2><p class="muted small" style="margin:0">${esc(t('col.review_text'))}</p></div>
        ${w.length ? `<div class="note warn" role="alert">${ic('alert', 'sm')}<div><b>${esc(t('col.warn_title'))}</b>${w.map(x => `<p style="margin-top:6px">${esc(x)}</p>`).join('')}<p style="margin-top:6px;font-size:13px">${esc(t('col.warn_text'))}</p></div></div>` : ''}
        <div class="card review" style="padding:4px 14px">${row('kind', F.kind && `${F.kind} · ${T.col.kinds_long[F.kind]}`, 1)}${row('date', fmt(F.date), 1)}${row('zone', F.zone && `${F.commune} (${F.zone})`, 2)}${row('population', F.pop, 3)}${row('sex', `${F.sex} · ${F.age} ans`, 3)}${row('violence', F.viol && en('violence', F.viol), 4)}${row('referral', F.ref ? en('services', F.ref) : t('col.no_referral'), 4)}${row('notes', F.notes ? `${F.notes.length} caractères` : '', 4)}</div>
        <p class="hint" style="margin:0">${esc(t('col.footnote'))}</p>`;
    }
    const last = F.step === 5; const off = S.net === 'off';
    return { tab: 'collect', title: esc(t('col.title')), plain: t('col.title'), html: `
      <div><div class="steplab"><b>${esc(steps[F.step - 1])}</b><span>${esc(t('col.step', { n: F.step, total: 5 }))}</span></div><div class="stepper" style="--n:5" role="img" aria-label="${esc(t('col.step', { n: F.step, total: 5 }))}">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= F.step ? 'on' : ''}"></i>`).join('')}</div></div>
      ${F.step === 1 ? `<p class="note warn">${ic('lock', 'sm')}<span><b>${esc(t('col.no_identity_title'))}</b> ${esc(t('col.no_identity'))}</span></p>` : ''}
      ${F.step > 1 && F.step < 5 && (F.kind || F.date) ? `<p class="hint" style="margin:0">${esc(t('col.draft_saved'))} <button class="btn-link" data-act="clear" style="min-height:44px">${esc(t('col.draft_clear'))}</button></p>` : ''}
      ${ne ? `<div class="errsum" role="alert" tabindex="-1" id="es">${esc(t('col.errors_title', { count: ne }))}</div>` : ''}
      <form id="cf" class="stack" novalidate>${body}
        <div class="formnav">${F.step > 1 ? `<button type="button" class="btn btn-outline" data-act="prev">${esc(t('col.prev'))}</button>` : ''}
        <button type="submit" class="btn btn-primary">${last ? ic(off ? 'cloud' : 'send', 'sm') + ' ' + esc(t(off ? 'col.submit_offline' : 'col.submit')) : esc(t('col.next'))}</button></div></form>`,
      mount: pane => bindCollecte(pane) };
  }
  const communeOpts = () => `<option value="">${esc(t('col.choose'))}</option>` + (ZONES[F.zone] || []).map(c => `<option ${F.commune === c ? 'selected' : ''}>${esc(c)}</option>`).join('');
  function bindCollecte(pane) {
    const f = pane.querySelector('#cf');
    f.addEventListener('change', ev => {
      const el = ev.target, id = el.id || el.name;
      const map = { kind: 'kind', date: 'date', zone: 'zone', commune: 'commune', pop: 'pop', sex: 'sex', age: 'age', viol: 'viol', ref: 'ref', notes: 'notes' };
      if (map[id]) F[map[id]] = el.value;
      if (id === 'zone') { F.commune = ''; const cm = pane.querySelector('#commune'); cm.disabled = !F.zone; cm.innerHTML = communeOpts(); }
    });
    const nt = pane.querySelector('#notes'); if (nt) nt.addEventListener('input', ev => { F.notes = ev.target.value; });
    f.addEventListener('submit', ev => {
      ev.preventDefault();
      if (F.step < 5) {
        const er = validateStep(F.step); F.errors = er;
        if (Object.keys(er).length) { Kit.render({ noFocus: true }); const s = document.getElementById('es'); s && s.focus(); return; }
        F.step++; Kit.render({ top: true }); document.getElementById('ttl').focus({ preventScroll: true }); return;
      }
      for (let i = 1; i <= 4; i++) { const er = validateStep(i); if (Object.keys(er).length) { F.step = i; F.errors = er; Kit.render({ top: true }); return; } }
      submitCase();
    });
    pane.querySelector('[data-act="prev"]') && pane.querySelector('[data-act="prev"]').addEventListener('click', () => { F.errors = {}; F.step--; Kit.render({ top: true }); });
  }
  function submitCase() {
    const snap = { ...F }; const id = 'q' + (++qSeq);
    const it = { id, kind: 'case', label: `Dossier ${snap.kind} · ${snap.commune}`, status: S.net === 'off' ? 'pending' : 'sent', when: 'à l’instant', data: snap, code: null };
    if (it.status === 'sent') it.code = addCase(snap);
    Q.push(it); F = F0(); Kit.go('#/collecte-ok/' + id);
  }
  function addCase(d) {
    const code = nextCode(d.kind);
    C.unshift({ code, kind: d.kind, date: d.date, zone: d.zone, commune: d.commune, sex: d.sex, age: d.age, pop: d.pop, viol: d.viol, status: 'ouvert', fu: [], sheet: null });
    return code;
  }
  function collecteOk(id) {
    const it = Q.find(i => i.id === id);
    if (!it) return collecte();
    const sent = it.status === 'sent';
    return { tab: 'collect', title: esc(t('col.title')), plain: t(sent ? 'col.sent_title' : 'col.queued_title'), html: `
      <div class="state-card card" aria-live="polite">
        <div class="row">${sent ? badge('ok', t('col.state_sent')) : badge('warn', t('col.state_queued'))}</div>
        <div class="big">${esc(t(sent ? 'col.sent_title' : 'col.queued_title'))}</div>
        ${sent ? `<p style="margin:0">${esc(t('col.saved', { codes: it.code }))}</p><div class="dl"><div><dt>${esc(t('col.code'))}</dt><dd><b class="h2">${it.code}</b></dd></div></div>`
          : `<p style="margin:0">${esc(t('col.queued'))}</p><p class="muted small" style="margin:0">${esc(t('col.code_later'))}</p>${S.net === 'on' ? `<p class="muted small" style="margin:0">${esc(t('col.sending'))}</p>` : ''}`}
      </div>
      <div class="stack-s">${!sent ? `<a class="btn btn-primary btn-block" href="#/sync">${ic('sync', 'sm')} ${esc(t('col.see_queue'))}</a>` : `<a class="btn btn-primary btn-block" href="#/dossier/${it.code}">${esc(t('col.see_cases'))}</a>`}
      <a class="btn btn-outline btn-block" href="#/collecte" data-act="newcol">${esc(t('col.again'))}</a></div>` };
  }

  /* ---------- Synchronisation ---------- */
  let syncing = false;
  function qItem(i) {
    const st = i.status; const cls = st === 'conflict' ? 'conflict' : '';
    const stB = st === 'sent' || st === 'resolved' ? badge('ok', t('sync.states.' + st)) : st === 'conflict' ? badge('warn', t('sync.states.conflict')) : st === 'sending' ? badge('', t('sync.states.sending')) : badge('mute', t('sync.states.pending'));
    let extra = '';
    if (st === 'conflict') {
      extra = `<p class="small" style="margin:0">${esc(t('sync.conflict_text'))}</p>
        <fieldset class="fld cmp"><legend class="vh">${esc(t('sync.field'))} : ${esc(i.field)}</legend>
          <div class="muted small">${esc(t('sync.field'))} : <b style="color:var(--app-text)">${esc(i.field)}</b> · ${esc(t('sync.base'))} : <b style="color:var(--app-text)">${esc(i.base)}</b></div>
          <label class="opt"><input type="radio" name="cmp-${i.id}" value="server" ${i.choice === 'server' ? 'checked' : ''} data-act="pick" data-id="${i.id}"><span class="dot" aria-hidden="true"></span><span class="tx"><b>${esc(t('sync.keep_server'))}</b><small>${esc(t('sync.server'))} : <b>${esc(i.server)}</b></small></span></label>
          <label class="opt"><input type="radio" name="cmp-${i.id}" value="mine" ${i.choice === 'mine' ? 'checked' : ''} data-act="pick" data-id="${i.id}"><span class="dot" aria-hidden="true"></span><span class="tx"><b>${esc(t('sync.keep_mine'))}</b><small>${esc(t('sync.mine'))} : <b>${esc(i.mine)}</b></small></span></label></fieldset>
        <button class="btn btn-primary" data-act="resolve" data-id="${i.id}">${esc(t('sync.resolve'))}</button>`;
    }
    return `<article class="q-item ${cls}" aria-label="${esc(i.label)}"><div class="top"><span class="grow"><h3>${esc(i.label)}</h3><div class="sub">${esc(t('sync.kinds.' + i.kind))} · ${esc(t('sync.created', { when: i.when }))}${i.code ? ` · <b>${i.code}</b>` : ''}</div></span>${stB}</div>${st === 'pending' ? `<div class="sub">${esc(t('sync.retries'))}</div>` : ''}${extra}</article>`;
  }
  function sync() {
    const off = S.net === 'off'; const n = pend();
    const conf = Q.filter(i => i.status === 'conflict'), wait = Q.filter(i => i.status === 'pending' || i.status === 'sending'), done = Q.filter(i => i.status === 'sent' || i.status === 'resolved').slice(-4).reverse();
    return { tab: '', back: 'accueil', backLabel: t('home.title'), title: esc(t('sync.title')), plain: t('sync.title'), html: `
      <section class="card sync-card ${off ? 'off' : ''}" aria-label="${esc(t('sync.title'))}">
        <div class="stat">${ic(syncing ? 'sync' : 'clock', syncing ? 'spin' : off ? 'clock-off' : '')}<div><b>${esc(t('net.pending', { count: n }))}</b><div class="small muted">${esc(off ? t('sync.last_off') : t('sync.last'))}</div></div></div>
        <button class="btn btn-primary btn-block" data-act="syncnow" ${off || syncing ? 'disabled' : ''}>${ic('sync', 'sm')} ${esc(syncing ? t('sync.syncing') : t('sync.now'))}</button>
        ${off ? `<p class="hint" style="margin:0">${esc(t('sync.now_off'))}</p>` : ''}</section>
      ${conf.length ? `<section class="stack-s">${secH(t('sync.conflicts'))}${conf.map(qItem).join('')}</section>` : ''}
      ${wait.length ? `<section class="stack-s">${secH(t('sync.pending'), String(wait.length))}${wait.map(qItem).join('')}</section>` : ''}
      ${done.length ? `<section class="stack-s">${secH(t('sync.sent'))}${done.map(qItem).join('')}</section>` : ''}
      ${!Q.length ? `<div class="empty"><b>${esc(t('sync.empty'))}</b></div>` : ''}` };
  }
  function runSync() {
    if (syncing || S.net === 'off') return; const w = Q.filter(i => i.status === 'pending'); if (!w.length) { return; }
    syncing = true; w.forEach(i => { i.status = 'sending'; }); Kit.render({ noFocus: true });
    setTimeout(() => {
      syncing = false; let k = 0;
      w.forEach(i => {
        if (S.net === 'off') { i.status = 'pending'; return; }
        i.status = 'sent'; k++;
        if (i.kind === 'case') i.code = addCase(i.data);
        if (i.kind === 'followup') { const c = find(i.fuRef[0]); const f = c && c.fu.find(x => x.id === i.fuRef[1]); if (f) f.queued = false; }
      });
      Kit.render({ noFocus: true }); if (k) Kit.toast(t('sync.done', { count: k }));
    }, 1100);
  }

  /* ---------- SOS ---------- */
  function sosScreen() {
    const off = S.net === 'off'; const st = SOSS.state;
    let html;
    if (st === 'sent' || st === 'queued') {
      html = `<div class="state-card card" aria-live="polite"><div>${badge(st === 'sent' ? 'ok' : 'warn', st === 'sent' ? t('col.state_sent') : t('col.state_queued'))}</div><div class="big">${esc(t(st === 'sent' ? 'sos.done' : 'sos.queued'))}</div><p style="margin:0">${esc(t(st === 'sent' ? 'sos.done_text' : 'sos.queued_text'))}</p></div>
        <button class="btn btn-outline btn-block" data-act="safe">${esc(t('sos.safe'))}</button><a class="btn btn-primary btn-block" href="#/accueil" data-act="sosreset">${esc(t('sos.again'))}</a>`;
    } else {
      html = `<div class="sos-wrap"><p style="margin:0">${esc(t('sos.intro'))}</p>
        <button class="sos-btn" id="sosb" aria-describedby="sosh"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" /></svg>SOS</button>
        <p id="sosh" class="small" style="margin:0">${esc(t('sos.help'))}</p>
        ${off ? `<p class="note warn" style="text-align:left">${ic('wifi-off', 'sm')}<span>${esc(t('sos.hint_offline'))}</span></p>` : ''}
        <div class="stack-s" style="width:100%"><span class="muted small">${esc(t('sos.alt'))}</span><button class="btn btn-outline btn-block" data-act="sosalt">${esc(t('sos.alt_btn'))}</button></div></div>`;
    }
    return { tab: 'sos', title: esc(t('sos.title')), plain: t('sos.title'), html, mount: pane => {
      const b = pane.querySelector('#sosb'); if (!b) return; let tm;
      const stop = () => { clearTimeout(tm); b.classList.remove('holding'); };
      b.addEventListener('pointerdown', ev => { ev.preventDefault(); b.classList.add('holding'); tm = setTimeout(() => { stop(); sendSos(); }, 2000); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(n => b.addEventListener(n, stop));
      b.addEventListener('keydown', ev => { if ((ev.key === ' ' || ev.key === 'Enter') && !ev.repeat) { ev.preventDefault(); b.classList.add('holding'); tm = setTimeout(() => { stop(); sendSos(); }, 2000); } });
      b.addEventListener('keyup', stop); b.addEventListener('blur', stop);
    } };
  }
  function sendSos() { SOSS.state = S.net === 'off' ? 'queued' : 'sent'; if (S.net === 'off') Q.push({ id: 'q' + (++qSeq), kind: 'sos', label: 'Alerte SOS', status: 'pending', when: 'à l’instant', data: null, sos: true }); Kit.render({ top: true }); }

    close: d => { if (needNet()) return; Kit.confirm({ title: t('alerts.close_title'), text: esc(t('alerts.close_confirm')), ok: t('alerts.close_yes'), onOk: () => { const a = A.find(x => x.id === d.id); a.status = 'clos'; pushHist(a, 'Clôturée par toi.'); Kit.toast(t('alerts.closed')); Kit.render({ noFocus: true }); } }); },
    fk: d => { L.kind = d.v; Kit.render({ noFocus: true }); },
    fs: d => { L.status = d.v; Kit.render({ noFocus: true }); },
    resetf: () => { L.q = ''; L.status = ''; L.kind = ''; Kit.render({ noFocus: true }); },
    done: d => { const c = find(d.code); const f = c.fu.find(x => x.id === +d.id); f.outcome = 'realise'; if (S.net === 'off') { f.queued = true; Q.push({ id: 'q' + (++qSeq), kind: 'followup', label: `${f.step} · ${d.code}`, status: 'pending', when: 'à l’instant', fuRef: [d.code, f.id] }); } Kit.toast(t('case.followup_done')); Kit.render({ noFocus: true }); },
    goto: d => { F.errors = {}; F.step = +d.step; Kit.render({ top: true }); },
    clear: () => { F = F0(); Kit.toast(t('col.draft_cleared')); Kit.render({ top: true }); },
    newcol: () => { F = F0(); },
    syncnow: () => runSync(),
    pick: d => { Q.find(i => i.id === d.id).choice = document.querySelector(`input[name="cmp-${d.id}"]:checked`).value; },
    resolve: d => { const i = Q.find(x => x.id === d.id); const ch = document.querySelector(`input[name="cmp-${d.id}"]:checked`); if (!ch) return Kit.toast(t('sync.choose_first')); i.choice = ch.value; i.status = 'resolved'; Kit.toast(t('sync.resolved_toast')); Kit.render({ noFocus: true }); },
    sosalt: () => Kit.confirm({ title: t('sos.alt_title'), text: esc(t('sos.alt_text')), ok: t('sos.alt_yes'), cancel: t('sos.cancel'), onOk: sendSos }),
    safe: () => Kit.toast(t('sos.safe_ok')),

  };
