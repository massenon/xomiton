# TEMPORAIRE : génère web/phpstan-baseline.neon (699 erreurs Larastan de niveau 6 existantes) puis le commite sur la branche.
# À supprimer dès que la baseline est en place.
name: Baseline PHPStan (temporaire)

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/phpstan-baseline.yml']

permissions:
  contents: write

defaults:
  run:
    working-directory: web

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, zip, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - name: Générer la baseline
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --generate-baseline=phpstan-baseline.neon --allow-empty-baseline
      - name: Commiter la baseline
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/phpstan-baseline.neon
          git commit -m "PHPStan : baseline des erreurs existantes (niveau 6)" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01SJe5iJaE2RpxFVZHqWJGym"
          git push
