name: CI

on:
  push:
    branches: [main, 'claude/**', 'feature/**', 'fix/**']
    paths: ['web/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/ci.yml']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  php:
    name: Pint · Larastan · Pest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, zip, bcmath
          coverage: none

      - name: Installer les dépendances Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          touch database/database.sqlite

      - name: Style de code (Pint)
        run: vendor/bin/pint --test

      - name: Analyse statique (Larastan niveau 6)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # Les tests de pages et PerformanceHeadTest lisent public/build/manifest.json (gitignoré) : CSS critique,
      # préchargement de police, @vite. Le contrôle des budgets reste dans le job front.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Compiler les paquets Vite (manifest pour Pest)
        run: |
          npm ci
          npm run build:nocheck

      # P16-06 : typographie et longueur des textes de lang/fr (App\Support\LangLinter) ; échoue à la moindre violation.
      - name: Lint des textes (lang:lint)
        run: php artisan lang:lint
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Tests (Pest)
        run: vendor/bin/pest --ci
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

  front:
    name: Vitest · vue-tsc · build Vite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances npm
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires Vue
        run: npm test

      - name: Compiler les paquets Vite
        run: npm run build
