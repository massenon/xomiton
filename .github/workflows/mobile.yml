name: Mobile

on:
  push:
    branches: [main, 'claude/**', 'feature/**', 'fix/**']
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  flutter:
    name: Flutter · analyze · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      # Tests unitaires, widget et d'intégration (test/integration : API simulée, sans émulateur).
      - run: flutter test

  android:
    name: Android · APK debug · budget de taille
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Ni google-services.json ni key.properties en CI (secrets hors dépôt) : le push
      # est désactivé (NoopPushService) et le build release est signé avec la clé de debug.
      - name: APK debug
        run: flutter build apk --debug

      - name: Taille de l'APK debug
        run: python3 tool/check_size.py debug build/app/outputs/flutter-apk/app-debug.apk

      # Mesure représentative : release (R8, ressources réduites), une seule architecture.
      - name: APK release arm64 (mesure de taille)
        run: >
          flutter build apk --release --target-platform android-arm64
          --obfuscate --split-debug-info=build/symbols
          --dart-define=API_BASE_URL=https://api.exemple.invalid/api/v1

      - name: Taille de l'APK release
        run: python3 tool/check_size.py release build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: xomiton-apk-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
